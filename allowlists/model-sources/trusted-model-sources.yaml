# Trusted AI model sources for Singularity AIDR
#
# Used by the AI model supply-chain rules in threats/ai-supply-chain.yaml:
#
#   - `orgs`: Hugging Face organisations/users. A hub download
#     (`huggingface-cli download`, `hf download`, `hf_hub_download`,
#     `snapshot_download`) or a `trust_remote_code=True` load is trusted only
#     when EVERY repository it names belongs to one of these organisations.
#     Matching is case-insensitive and exact (no prefixes).
#   - `hosts`: hosts trusted for direct downloads of model-weight files
#     (`curl`/`wget`/`urlretrieve` of .pt/.pth/.pkl/.ckpt/.joblib/... files).
#     Only HTTPS URLs can be trusted; plain HTTP is never suppressed. Hosts are
#     matched by suffix on a dot boundary ("huggingface.co" covers
#     "www.huggingface.co" but not "evilhuggingface.co"). Anyone can upload to
#     the Hugging Face Hub, so a Hugging Face URL is trusted only when it names
#     a repository of a trusted organisation (`orgs`); LFS/CDN object URLs,
#     which name no repository, are never trusted by host alone.
#   - A download that overrides the hub endpoint (`HF_ENDPOINT=…`,
#     `endpoint=…`) is never trusted by organisation: the repository id then
#     says nothing about where the bytes come from.
#
# A trusted source only removes the "unvetted source" finding. Unsafe loading
# (pickle, torch.load without weights_only=True, trust_remote_code=True, ...)
# is still flagged whatever the source.
#
# This file lives in a subdirectory on purpose: every *.yaml directly under
# allowlists/ is read as a trusted *installer* domain list for pipe-to-shell
# rules, and model hubs must never suppress those.
#
# Operators extend these lists with `ai_supply_chain.trusted_model_orgs` and
# `ai_supply_chain.trusted_model_hosts` in ~/.singularity-aidr/config.json.

hosts:
  - host: huggingface.co
    reason: Hugging Face Hub, including its LFS/CDN download hosts
  - host: hf.co
    reason: Hugging Face Hub short domain
  - host: download.pytorch.org
    reason: Official PyTorch model and wheel downloads
  - host: tfhub.dev
    reason: TensorFlow Hub
  - host: kaggle.com
    reason: Kaggle Models
  - host: ngc.nvidia.com
    reason: NVIDIA NGC model registry
  - host: modelscope.cn
    reason: ModelScope model hub

orgs:
  - org: meta-llama
    reason: Meta Llama models
  - org: facebook
    reason: Meta AI research models
  - org: FacebookAI
    reason: Meta AI (RoBERTa and related canonical models)
  - org: google
    reason: Google models
  - org: google-bert
    reason: Google BERT canonical models
  - org: google-t5
    reason: Google T5 canonical models
  - org: microsoft
    reason: Microsoft models
  - org: openai
    reason: OpenAI open-weight models
  - org: openai-community
    reason: OpenAI GPT-2 canonical models
  - org: mistralai
    reason: Mistral AI models
  - org: Qwen
    reason: Alibaba Qwen models
  - org: deepseek-ai
    reason: DeepSeek models
  - org: nvidia
    reason: NVIDIA models
  - org: apple
    reason: Apple models
  - org: amazon
    reason: Amazon models
  - org: ibm-granite
    reason: IBM Granite models
  - org: allenai
