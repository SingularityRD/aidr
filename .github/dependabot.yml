# Version PRs are temporarily paused during consolidated dependency qualification.
# Security updates are not restricted by these limits. Restore npm=10 and
# Actions/other pip/Docker=5 after lock, build and acceptance gates. Keep NER
# paused until its hash locks, wheel evidence and inference gates are repaired.
version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    assignees:
      - "SingularityRD"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group all patch updates
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Group minor updates for dev dependencies
      dev-dependencies:
        patterns:
          - "@types/*"
          - "vitest*"
          - "@vitest/*"
          - "esbuild*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for critical packages (manual review required)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Every other major bump is done by hand, on its own branch, with a
      # migration and a green `pnpm check && pnpm build && pnpm test`. On
      # 2026-10-08 unreviewed majors (zod 4, koffi 3, react-dom without react)
      # broke the build and the dashboard tests. koffi 3 was later migrated by
      # hand (split native packages, see scripts/stage-windows-koffi.mjs).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # init, autobuild, analyze and upload-sarif must stay on one commit
      # (scripts/ci-workflows.test.mjs enforces it), so bump them together.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Python: the AIG bridge and the privacy workers. Hash locks must be
  # regenerated with the command in each lock header when a PR bumps a pin.
  - package-ecosystem: "pip"
    directories:
      - "/services/aig-bridge"
      - "/packages/privacy/vision"
      - "/packages/privacy/parsers"
      - "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # transformers pins tokenizers to a narrow range (5.13.0: <=0.23.0) and
      # Dependabot cannot see that constraint inside a hash lock. Bump the two
      # together by hand and run the NER worker tests.
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # NER upgrades need coordinated platform hash locks, wheel evidence and
  # real inference gates. Pause version PRs while that qualification is open;
  # Dependabot security updates are not subject to this limit.
  - package-ecosystem: "pip"
    directory: "/packages/privacy/ner"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Container base images: every Dockerfile AIDR builds, including the optional
  # posture scanner images built from vendor/ai-infra-guard (Dockerfile,
  # Dockerfile_Agent). scripts/audit-vendored-aig.mjs requires each base to stay
  # digest-pinned and the golang tag to match the vendored go.mod toolchain.
  - package-ecosystem: "docker"
    directories:
      - "/services/aig-bridge"
      - "/deploy/dashboard"
      - "/deploy/helm/images"
      - "/deploy/privacy-gateway"
      - "/vendor/ai-infra-guard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Base-image majors (Python 3.12 to 3.14, Node 24 to 26) invalidate the
      # image security-scan evidence and the hash-locked musl wheels. They need
      # a real image build and re-scan, so they are upgraded by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Optional AI Security Posture scanner: the vendored AI-Infra-Guard sources
  # that the posture-scanner-server and -agent images are built from. Version
  # PRs stay paused like the rest of this file; security updates are not.
  # After a bump, rerun pnpm audit:vendored and the posture-scanner-supply-chain
  # CI job (govulncheck, Trivy).
  - package-ecosystem: "npm"
    directory: "/vendor/ai-infra-guard/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps(posture-scanner)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directory: "/vendor/ai-infra-guard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps(posture-scanner)"

  - package-ecosystem: "uv"
    directories:
      - "/vendor/ai-infra-guard/AIG-PromptSecurity"
      - "/vendor/ai-infra-guard/agent-scan"
      - "/vendor/ai-infra-guard/skill-scan"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps(posture-scanner)"

  # Hash locks generated with the uv pip compile command in each lock header.
  - package-ecosystem: "pip"
    directories:
      - "/vendor/ai-infra-guard/mcp-scan"
      - "/vendor/ai-infra-guard/services/api_checker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps(posture-scanner)"
