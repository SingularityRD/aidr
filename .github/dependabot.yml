version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "SingularityRD"
    assignees:
      - "SingularityRD"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group all patch updates
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Group minor updates for dev dependencies
      dev-dependencies:
        patterns:
          - "@types/*"
          - "vitest*"
          - "@vitest/*"
          - "esbuild*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for critical packages (manual review required)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Python: the AIG bridge and the privacy workers. Hash locks must be
  # regenerated with the command in each lock header when a PR bumps a pin.
  - package-ecosystem: "pip"
    directories:
      - "/services/aig-bridge"
      - "/packages/privacy/ner"
      - "/packages/privacy/vision"
      - "/packages/privacy/parsers"
      - "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Container base images.
  - package-ecosystem: "docker"
    directories:
      - "/services/aig-bridge"
      - "/deploy/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "SingularityRD"
    commit-message:
      prefix: "deps"
      include: "scope"
