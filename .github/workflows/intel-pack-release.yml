name: Intel Pack Release

# License-bound intel update packs (docs/operations/intel-pack-releases.md).
#
# Weekly, and on demand, this builds a pack from threats/*.yaml plus the curated
# intel/ directory (scripts/intel-pack-release.mjs build), optionally encrypts it
# with the shared pack key (scripts/intel-pack-keys.mjs), signs the manifest with
# the publisher key (scripts/sign-intel-pack-manifest.mjs --audience), verifies
# it with the endpoint's own loader and acceptPack against sample licenses
# (in-term accepted, out-of-term / other customer / revoked license refused),
# and exports release assets plus an offline folder for air-gapped customers.
#
#   publish-release        a DRAFT GitHub release intel-pack-<version>; a person
#                          reviews the verification report and publishes it.
#   publish-control-plane  on request only, behind the intel-pack-publish
#                          environment (required reviewers): registers a generic
#                          (no-audience) pack in the hosted control plane's
#                          private bucket + pack_versions, served by
#                          packs-manifest / packs-download.
#
# The publisher private key is an environment secret (intel-pack-signing) that is
# written to a 0600 file in RUNNER_TEMP for the signing step only and deleted
# right after; it is never in the repository or an artifact.

on:
  schedule:
    # Mondays 05:47 UTC (08:47 Türkiye).
    - cron: "47 5 * * 1"
  workflow_dispatch:
    inputs:
      audience:
        description: "Customer ids the pack is issued for, comma-separated (empty: a generic pack for every licensed customer)"
        required: false
        type: string
        default: ""
      pack_id:
        description: "Pack id (default: aidr-intel, or aidr-intel-<customer> for one customer; required for several customers)"
        required: false
        type: string
        default: ""
      expires_in_days:
        description: "Days until the pack is reported stale on endpoints (it keeps enforcing after)"
        required: false
        type: string
        default: "45"
      encrypt:
        description: "Encrypt the lists with the shared pack key (premium tenants hold it)"
        required: false
        type: boolean
        default: true
      revocations_b64:
        description: "Base64 of a signed aidr-license-revocations-v1 list (empty: the AIDR_LICENSE_REVOCATIONS_B64 variable, if set)"
        required: false
        type: string
        default: ""
      publish_release:
        description: "Create the draft GitHub release"
        required: false
        type: boolean
        default: true
      publish_control_plane:
        description: "Register the generic pack in the hosted control plane (needs intel-pack-publish approval)"
        required: false
        type: boolean
        default: false

concurrency:
  group: intel-pack-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0
  PNPM_VERSION: 10.29.3

jobs:
  build:
    name: Build, sign and verify the intel pack
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: intel-pack-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      built: ${{ steps.build.outputs.built }}
      version: ${{ steps.inputs.outputs.version }}
      pack_id: ${{ steps.inputs.outputs.pack_id }}
      audience: ${{ steps.inputs.outputs.audience }}
    steps:
      - name: Validate release inputs
        id: inputs
        shell: bash
        env:
          AUDIENCE: ${{ inputs.audience }}
          PACK_ID: ${{ inputs.pack_id }}
          EXPIRES_IN_DAYS: ${{ inputs.expires_in_days || '45' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]] || {
            echo "Intel packs are built only from the protected default branch." >&2
            exit 1
          }
          audience="$(printf '%s' "${AUDIENCE}" | tr -d ' ' | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)"
          if [[ -n "${audience}" ]]; then
            for id in ${audience//,/ }; do
              [[ "${id}" =~ ^[a-z0-9][a-z0-9-]{1,31}$ ]] || { echo "audience: ${id} is not a customer id." >&2; exit 1; }
            done
          fi
          if [[ -z "${PACK_ID}" ]]; then
            case "${audience}" in
              "") PACK_ID="aidr-intel" ;;
              *,*) echo "Several customers: name the pack with pack_id." >&2; exit 1 ;;
              *) PACK_ID="aidr-intel-${audience}" ;;
            esac
          fi
          [[ "${PACK_ID}" =~ ^[a-z0-9][a-z0-9._-]{1,127}$ ]] || { echo "pack_id must be [a-z0-9._-]." >&2; exit 1; }
          [[ -z "${audience}" || "${PACK_ID}" != "aidr-intel" ]] || { echo "aidr-intel is the generic pack; a customer pack needs its own pack_id." >&2; exit 1; }
          [[ "${EXPIRES_IN_DAYS}" =~ ^[0-9]{1,3}$ && "${EXPIRES_IN_DAYS}" -ge 1 && "${EXPIRES_IN_DAYS}" -le 366 ]] || { echo "expires_in_days must be 1..366." >&2; exit 1; }
          {
            echo "audience=${audience}"
            echo "pack_id=${PACK_ID}"
            echo "expires_in_days=${EXPIRES_IN_DAYS}"
            # Monotonic per pack id: <year>.<MMDD>.<run number>.
            echo "version=$(date -u +%Y).$(date -u +%m%d).${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build the core verifier
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -C packages/core build

      - name: Build the pack from threats/ and intel/
        id: build
        shell: bash
        env:
          PACK_ID: ${{ steps.inputs.outputs.pack_id }}
          VERSION: ${{ steps.inputs.outputs.version }}
          AUDIENCE: ${{ steps.inputs.outputs.audience }}
          EXPIRES_IN_DAYS: ${{ steps.inputs.outputs.expires_in_days }}
          KEY_ID: ${{ vars.AIDR_INTEL_PACK_KEY_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ -n "${KEY_ID}" ]] || { echo "Set the AIDR_INTEL_PACK_KEY_ID variable on the intel-pack-signing environment." >&2; exit 1; }
          args=(build --out "${RUNNER_TEMP}/pack" --pack-id "${PACK_ID}" --version "${VERSION}" --key-id "${KEY_ID}"
            --threats-dir threats --expires-in-days "${EXPIRES_IN_DAYS}" --source-ref "${GITHUB_SHA}")
          [[ -d intel ]] && args+=(--intel-dir intel)
          [[ -n "${AUDIENCE}" ]] && args+=(--audience "${AUDIENCE}")
          # A scheduled run with nothing to ship is not a failure; a requested one is.
          [[ "${EVENT}" == "schedule" ]] && args+=(--if-empty skip)
          result="$(node scripts/intel-pack-release.mjs "${args[@]}")"
          echo "${result}"
          if [[ "$(jq -r .outcome <<<"${result}")" == "built" ]]; then
            echo "built=true" >> "${GITHUB_OUTPUT}"
          else
            echo "built=false" >> "${GITHUB_OUTPUT}"
            echo "No intel entries to publish this run." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Encrypt the lists with the shared pack key
        if: steps.build.outputs.built == 'true' && (github.event_name == 'schedule' || inputs.encrypt)
        shell: bash
        env:
          SHARED_PACK_KEY: ${{ secrets.AIDR_INTEL_SHARED_PACK_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${SHARED_PACK_KEY}" ]] || { echo "Encryption requested but AIDR_INTEL_SHARED_PACK_KEY is not set (key_id=base64, from intel-pack-keys.mjs new-shared-key)." >&2; exit 1; }
          umask 077
          printf '%s\n' "${SHARED_PACK_KEY}" > "${RUNNER_TEMP}/shared-pack.key"
          node scripts/intel-pack-keys.mjs encrypt-pack --pack "${RUNNER_TEMP}/pack" --shared-key-file "${RUNNER_TEMP}/shared-pack.key"

      - name: Sign the manifest with the publisher key
        if: steps.build.outputs.built == 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.AIDR_INTEL_PACK_SIGNING_KEY }}
          AUDIENCE: ${{ steps.inputs.outputs.audience }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_KEY}" ]] || { echo "AIDR_INTEL_PACK_SIGNING_KEY (Ed25519 PEM) is not set on the intel-pack-signing environment." >&2; exit 1; }
          umask 077
          key="${RUNNER_TEMP}/intel-pack-signing.pem"
          trap 'rm -f "${key}"' EXIT
          printf '%s\n' "${SIGNING_KEY}" > "${key}"
          node scripts/sign-intel-pack-manifest.mjs --manifest "${RUNNER_TEMP}/pack/manifest.json" --private-key "${key}" --audience "${AUDIENCE:-none}"

      - name: Stage trusted key, license registry and revocation list
        if: steps.build.outputs.built == 'true'
        shell: bash
        env:
          KEY_ID: ${{ vars.AIDR_INTEL_PACK_KEY_ID }}
          PUBLIC_KEY: ${{ vars.AIDR_INTEL_PACK_PUBLIC_KEY_PEM }}
          LICENSE_PUBLIC_KEYS_JSON: ${{ vars.AIDR_LICENSE_PUBLIC_KEYS_JSON }}
          REVOCATIONS_INPUT_B64: ${{ inputs.revocations_b64 }}
          REVOCATIONS_VAR_B64: ${{ vars.AIDR_LICENSE_REVOCATIONS_B64 }}
        run: |
          set -euo pipefail
          # Verification uses the PUBLISHED public key, never one derived from the secret.
          [[ "${PUBLIC_KEY}" == *"PUBLIC KEY"* ]] || { echo "Set AIDR_INTEL_PACK_PUBLIC_KEY_PEM (the key endpoints trust)." >&2; exit 1; }
          jq -n --arg id "${KEY_ID}" --arg pem "${PUBLIC_KEY}" '{($id): $pem}' > "${RUNNER_TEMP}/intel-trusted-keys.json"
          if [[ -n "${LICENSE_PUBLIC_KEYS_JSON}" ]]; then
            printf '%s\n' "${LICENSE_PUBLIC_KEYS_JSON}" > "${RUNNER_TEMP}/license-public-keys.json"
          else
            cp deploy/onprem/license-public-keys.json "${RUNNER_TEMP}/license-public-keys.json"
          fi
          revocations="${REVOCATIONS_INPUT_B64:-${REVOCATIONS_VAR_B64}}"
          if [[ -n "${revocations}" ]]; then
            [[ "${revocations}" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || { echo "The revocation list must be base64." >&2; exit 1; }
            printf '%s' "${revocations}" | base64 --decode > "${RUNNER_TEMP}/license-revocations.json"
          fi

      - name: Verify with the endpoint loader and acceptPack, then export
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          verify=(verify --pack "${RUNNER_TEMP}/pack" --trusted-keys "${RUNNER_TEMP}/intel-trusted-keys.json" --report "${RUNNER_TEMP}/verification-report.json")
          export_args=(export --pack "${RUNNER_TEMP}/pack" --trusted-keys "${RUNNER_TEMP}/intel-trusted-keys.json" --out "${RUNNER_TEMP}/release")
          [[ -f "${RUNNER_TEMP}/shared-pack.key" ]] && verify+=(--shared-key-file "${RUNNER_TEMP}/shared-pack.key")
          if [[ -f "${RUNNER_TEMP}/license-revocations.json" ]]; then
            revocation_args=(--license-public-keys "${RUNNER_TEMP}/license-public-keys.json" --license-revocations "${RUNNER_TEMP}/license-revocations.json")
            verify+=("${revocation_args[@]}")
            export_args+=("${revocation_args[@]}")
          fi
          node scripts/intel-pack-release.mjs "${verify[@]}"
          node scripts/intel-pack-release.mjs "${export_args[@]}"
          rm -f "${RUNNER_TEMP}/shared-pack.key"
          cp "${RUNNER_TEMP}/verification-report.json" "${RUNNER_TEMP}/release/"
          {
            echo "### Intel pack ${GITHUB_RUN_NUMBER}"
            echo '```json'
            cat "${RUNNER_TEMP}/verification-report.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attest the release files (pinned)
        if: steps.build.outputs.built == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

      - name: Upload the release and offline folder (pinned)
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-pack-${{ steps.inputs.outputs.pack_id }}-${{ steps.inputs.outputs.version }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Draft the GitHub release
    needs: build
    if: needs.build.outputs.built == 'true' && (github.event_name == 'schedule' || inputs.publish_release)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified release folder (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intel-pack-${{ needs.build.outputs.pack_id }}-${{ needs.build.outputs.version }}
          path: release

      - name: Check the folder against its SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check --strict SHA256SUMS

      - name: Publish draft release (pinned)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: intel-pack-${{ needs.build.outputs.pack_id }}-${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Intel pack ${{ needs.build.outputs.pack_id }} ${{ needs.build.outputs.version }}
          draft: true
          generate_release_notes: false
          body: |
            Signed intel update pack ${{ needs.build.outputs.pack_id }}@${{ needs.build.outputs.version }}${{ needs.build.outputs.audience && format(' for {0}', needs.build.outputs.audience) || '' }}.
            Review verification-report.json, then publish. Air-gapped customers: copy every file and follow IMPORT.txt (EN/TR).
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-control-plane:
    name: Register the generic pack in the hosted control plane
    needs: build
    if: needs.build.outputs.built == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_control_plane && needs.build.outputs.audience == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: intel-pack-publish
    permissions:
      contents: read
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build the core verifier
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -C packages/core build

      - name: Download the verified release folder (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intel-pack-${{ needs.build.outputs.pack_id }}-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Upload to the private bucket and register in pack_versions
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.AIDR_CONTROL_PLANE_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.AIDR_CONTROL_PLANE_SERVICE_ROLE_KEY }}
          ANON_KEY: ${{ secrets.AIDR_CONTROL_PLANE_ANON_KEY }}
          PACK_ID: ${{ needs.build.outputs.pack_id }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ "${SUPABASE_URL}" == https://* && -n "${SERVICE_ROLE_KEY}" ]] || { echo "Set AIDR_CONTROL_PLANE_SUPABASE_URL and AIDR_CONTROL_PLANE_SERVICE_ROLE_KEY on intel-pack-publish." >&2; exit 1; }
          (cd "${RUNNER_TEMP}/release" && sha256sum --check --strict SHA256SUMS)
          umask 077
          deployment="${RUNNER_TEMP}/deployment"
          mkdir -p "${deployment}"
          trap 'rm -rf "${deployment}"' EXIT
          jq -n --arg url "${SUPABASE_URL}" '{mode: "self-hosted", supabase_url: $url}' > "${deployment}/deployment.json"
          printf 'SERVICE_ROLE_KEY=%s\nANON_KEY=%s\n' "${SERVICE_ROLE_KEY}" "${ANON_KEY}" > "${deployment}/.env"
          # Re-verifies the signature and digests, refuses rollback and version
          # equivocation, and only accepts shared-key encryption for a shared row.
          node scripts/import-offline-pack.mjs --pack "${RUNNER_TEMP}/release/${PACK_ID}-${VERSION}.aidrpack.json" \
            --trusted-keys "${RUNNER_TEMP}/release/intel-trusted-keys.json" --target storage --deployment "${deployment}"
