name: AGENTS.md Validation

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.factory/AGENTS.md'
      - 'package.json'
  push:
    branches:
      - main
      - master
    paths:
      - 'CLAUDE.md'
      - '.factory/AGENTS.md'
      - 'package.json'
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

jobs:
  validate-agents-md:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.29.3

      - name: Setup Node (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.1
          cache: pnpm

      - name: Verify AGENTS.md Commands
        run: |
          echo "=== Checking AGENTS.md Command Validations ==="
          
          # Check that key commands are documented
          if grep -q "pnpm install" .factory/AGENTS.md; then
            echo "✓ pnpm install documented"
          else
            echo "✗ pnpm install not documented"
            exit 1
          fi
          
          if grep -q "pnpm test" .factory/AGENTS.md; then
            echo "✓ pnpm test documented"
          else
            echo "✗ pnpm test not documented"
            exit 1
          fi
          
          if grep -q "pnpm build" .factory/AGENTS.md; then
            echo "✓ pnpm build documented"
          else
            echo "✗ pnpm build not documented"
            exit 1
          fi
          
          if grep -q "pnpm check" .factory/AGENTS.md; then
            echo "✓ pnpm check documented"
          else
            echo "✗ pnpm check not documented"
            exit 1
          fi
          
          if grep -q "pnpm lint" .factory/AGENTS.md; then
            echo "✓ pnpm lint documented"
          else
            echo "✗ pnpm lint not documented"
            exit 1
          fi
          
          echo "=== All AGENTS.md commands validated ==="

      - name: Test Documented Commands
        run: |
          echo "=== Testing Documented Commands ==="
          
          # Install dependencies
          pnpm install --frozen-lockfile --ignore-scripts
          
          # Run typecheck
          pnpm check
          
          echo "✓ All documented commands work correctly"

      - name: Validate Command Sync
        run: |
          echo "=== Validating package.json scripts match AGENTS.md ==="
          
          # Extract scripts from package.json and verify they're documented
          SCRIPTS=$(cat package.json | grep -o '"[a-z:-]*":' | tr -d '"' | tr -d ':')
          
          for script in build test check lint; do
            if echo "$SCRIPTS" | grep -q "^$script$"; then
              if grep -q "pnpm $script" .factory/AGENTS.md || grep -q "pnpm run $script" .factory/AGENTS.md; then
                echo "✓ Script '$script' documented in AGENTS.md"
              else
                echo "⚠️ Script '$script' exists but may not be documented"
              fi
            fi
          done
          
          echo "=== Command sync validation complete ==="

      - name: Check Documentation Freshness
        run: |
          echo "=== Checking Documentation Freshness ==="
          
          # Check if AGENTS.md was modified in last 90 days
          AGENTS_MD_DATE=$(git log -1 --format=%ct .factory/AGENTS.md 2>/dev/null || echo "0")
          CURRENT_DATE=$(date +%s)
          DAYS_DIFF=$(( (CURRENT_DATE - AGENTS_MD_DATE) / 86400 ))
          
          if [ $DAYS_DIFF -lt 90 ]; then
            echo "✓ AGENTS.md modified $DAYS_DIFF days ago (within 90 days)"
          else
            echo "⚠️ AGENTS.md last modified $DAYS_DIFF days ago (stale)"
          fi
          
          # Check CLAUDE.md freshness
          CLAUDE_MD_DATE=$(git log -1 --format=%ct CLAUDE.md 2>/dev/null || echo "0")
          DAYS_DIFF_CLAUDE=$(( (CURRENT_DATE - CLAUDE_MD_DATE) / 86400 ))
          
          if [ $DAYS_DIFF_CLAUDE -lt 90 ]; then
            echo "✓ CLAUDE.md modified $DAYS_DIFF_CLAUDE days ago (within 90 days)"
          else
            echo "⚠️ CLAUDE.md last modified $DAYS_DIFF_CLAUDE days ago (stale)"
          fi
          
          echo "=== Documentation freshness check complete ==="

      - name: Notify on Failure
        if: failure()
        uses: 8398a7/action-slack@1750b5085f3ec60384090fb7c52965ef822e869e # v3.18.0
        with:
          status: ${{ job.status }}
          channel: '#aidr-alerts'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "⚠️ AGENTS.md validation failed - documentation may be outdated"
