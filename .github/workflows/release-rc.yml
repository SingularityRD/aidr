name: Release Candidate Build

on:
  push:
    tags:
      - "v*.*.*-rc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing protected vX.Y.Z-rc.N tag to build"
        required: true
        type: string

concurrency:
  group: release-candidate-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0
  PNPM_VERSION: 10.29.3
  VSCE_VERSION: 4.0.0
  AIDR_RELEASE_MODE: commercial
  AIDR_REQUIRE_SBOM: "1"
  AIDR_SIGNING_KEY_ID: ${{ vars.AIDR_SIGNING_KEY_ID }}

jobs:
  build-rc:
    name: Build and test unsigned RC inputs
    runs-on: ubuntu-22.04
    environment: release-candidate
    env:
      AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT }}
    outputs:
      tag: ${{ steps.rc_meta.outputs.tag }}
      sha: ${{ steps.rc_meta.outputs.sha }}
      version: ${{ steps.rc_meta.outputs.version }}
      source_date_epoch: ${{ steps.rc_meta.outputs.source_date_epoch }}
      sbom_sha256: ${{ steps.prepared_inputs.outputs.sbom_sha256 }}
      prepared_archive_sha256: ${{ steps.prepared_inputs.outputs.prepared_archive_sha256 }}
    steps:
      - name: Checkout protected tag (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Resolve and verify immutable RC identity
        id: rc_meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          TAG_PGP_PUBLIC_KEY: ${{ secrets.RELEASE_TAG_PGP_PUBLIC_KEY }}
          TAG_PGP_FINGERPRINT: ${{ secrets.RELEASE_TAG_PGP_FINGERPRINT }}
          MANUAL_BUILD_ENABLED: ${{ vars.RELEASE_MANUAL_BUILD_ENABLED }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          # RC artifacts intentionally carry the stable package version so
          # promotion can retag the exact signed bytes. Building an RC publishes
          # nothing, so a failed acceptance is fixed with the next rc.N of the
          # same version. NPM cannot publish a second tarball with that version,
          # so only one RC per version can ever be promoted; the promotion
          # workflow refuses a version already promoted from another RC tag.
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.(0|[1-9][0-9]{0,3})$ ]] || {
            echo "Only vX.Y.Z-rc.N tags (N without leading zeros) are supported." >&2
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            [[ "${GITHUB_REF_PROTECTED}" == "true" ]] || {
              echo "The RC tag must be protected by a repository ruleset." >&2
              exit 1
            }
            tag_sha="$(git rev-list -n 1 "${tag}^{commit}")"
            [[ "${tag_sha}" == "${GITHUB_SHA}" ]] || {
              echo "Tag does not point at the workflow commit (${tag_sha} != ${GITHUB_SHA})." >&2
              exit 1
            }
          else
            [[ "${MANUAL_BUILD_ENABLED:-false}" == "true" ]] || {
              echo "Manual RC builds require repository variable RELEASE_MANUAL_BUILD_ENABLED=true." >&2
              exit 1
            }
            tag_sha="$(git rev-list -n 1 "${tag}^{commit}")"
            [[ "${GITHUB_REF}" == "refs/tags/${tag}" && "${GITHUB_SHA}" == "${tag_sha}" ]] || {
              echo "Manual RC workflow ref and commit must exactly match the requested protected tag." >&2
              exit 1
            }
          fi

          [[ "$(git cat-file -t "${tag}")" == "tag" ]] || {
            echo "RC tag must be an annotated tag, not a lightweight tag." >&2
            exit 1
          }
          [[ -n "${TAG_PGP_PUBLIC_KEY}" && -n "${TAG_PGP_FINGERPRINT}" ]] || {
            echo "RELEASE_TAG_PGP_PUBLIC_KEY and RELEASE_TAG_PGP_FINGERPRINT are required." >&2
            exit 1
          }
          printf '%s\n' "${TAG_PGP_PUBLIC_KEY}" | gpg --batch --import
          git verify-tag --raw "${tag}" >/tmp/aidr-tag-verification.txt 2>&1 || {
            cat /tmp/aidr-tag-verification.txt >&2
            exit 1
          }
          actual_fingerprint="$(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" {print toupper($3); exit}' /tmp/aidr-tag-verification.txt)"
          expected_fingerprint="$(printf '%s' "${TAG_PGP_FINGERPRINT}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ -n "${actual_fingerprint}" && "${actual_fingerprint}" == "${expected_fingerprint}" ]] || {
            echo "RC tag signer fingerprint mismatch." >&2
            exit 1
          }

          version="${tag#v}"
          version="${version%-rc.*}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: ${version}" >&2; exit 1; }
          for package_json in packages/core/package.json packages/claude-code/package.json packages/extension/package.json packages/openclaw/package.json packages/opencode/package.json packages/cli/package.json packages/sdk/package.json packages/dashboard/package.json packages/codex/package.json packages/mcp-gateway/package.json; do
            package_version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "${package_json}")"
            [[ "${package_version}" == "${version}" ]] || {
              echo "${package_json} must remain at stable base version ${version}; found ${package_version}." >&2
              exit 1
            }
          done
          source_date_epoch="$(git show -s --format=%ct "${tag_sha}")"
          {
            echo "AIDR_RELEASE_TAG=${tag}"
            echo "AIDR_RELEASE_VERSION=${version}"
            echo "AIDR_BUILD_ID=${tag_sha}"
            echo "AIDR_GIT_SHA=${tag_sha}"
            echo "AIDR_CI_RUN_ID=${GITHUB_RUN_ID}"
            echo "AIDR_WATERMARK_ID=rc-${tag_sha}"
            echo "SOURCE_DATE_EPOCH=${source_date_epoch}"
          } >> "${GITHUB_ENV}"
          {
            echo "tag=${tag}"
            echo "sha=${tag_sha}"
            echo "version=${version}"
            echo "source_date_epoch=${source_date_epoch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Full-history secret scan (Gitleaks v8.30.1)
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          [[ "$("${RUNNER_TEMP}/gitleaks" version)" == "8.30.1" ]]
          PATH="${RUNNER_TEMP}:${PATH}" pnpm verify:secrets

      - name: Frozen dependency install (no lifecycle mutation)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cloudflare Worker contract
        run: node --test deploy/cloudflare/worker.test.mjs deploy/cloudflare/verify-operational.test.mjs deploy/cloudflare/staging-deploy.test.mjs

      - name: Setup pinned Python for bridge E2E
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: services/aig-bridge/requirements-ci.lock

      - name: Install hash-locked bridge E2E dependencies
        working-directory: services/aig-bridge
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip check

      - name: Assert clean checkout and vendored AIG source
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { git status --short; exit 1; }
          source_type="$(git ls-tree HEAD vendor/ai-infra-guard | awk '{print $2}')"
          [[ "${source_type}" == "tree" ]] || {
            echo "AIG source must be a committed directory" >&2
            exit 1
          }

      - name: Strict AIG source and generated-data gate
        shell: bash
        env:
          AIG_STRICT_CASE: "true"
        run: |
          set -euo pipefail
          pnpm aig:verify
          pnpm compile:aig
          git diff --exit-code -- packages/core/src/generated

      - name: Install pinned Supabase CLI 2.114.0
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/supabase_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/supabase/cli/releases/download/v2.114.0/supabase_linux_amd64.tar.gz"
          echo "f36a33ca867f1cce9ba5efa705863fdc545d1465d3719a721793ea67eb692c5a  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" supabase
          chmod 0755 "${RUNNER_TEMP}/supabase"
          echo "SUPABASE_BIN=${RUNNER_TEMP}/supabase" >> "${GITHUB_ENV}"

      - name: Supabase migration, reset, lint and live boundary gate
        shell: bash
        env:
          AIDR_RLS_TEST_DB_CONTAINER: supabase_db_aidr
          AIDR_POSTGRES_DOCKER_CONTAINER: supabase_db_aidr
          AIDR_TEST_DISPOSABLE_DB: "1"
        run: |
          set -euo pipefail
          pnpm supabase:check
          pnpm supabase:check:edge-typed-slice
          "${SUPABASE_BIN}" start
          "${SUPABASE_BIN}" db reset --local --no-seed
          "${SUPABASE_BIN}" db lint --local --fail-on error
          node scripts/database-boundary-hardening-postgres.mjs
          node scripts/tenant-lifecycle-rls-postgres.test.mjs --installed
          node scripts/team-resource-read-rls-postgres.mjs
          node scripts/team-invitation-atomic-audit-postgres.mjs
          node scripts/team-member-email-projection-postgres.mjs
          node scripts/scim-saml-identity-postgres.mjs
          node scripts/scim-canonical-membership-postgres.mjs
          node scripts/owner-role-audit-postgres.mjs
          node scripts/member-role-audit-postgres.mjs
          node scripts/member-removal-audit-postgres.mjs
          node scripts/member-authorization-race-postgres.mjs
          node scripts/billing-channel-intent-postgres.mjs
          node scripts/events-seat-admission-postgres.mjs
          node scripts/pilot-approval-seat-postgres.mjs
          node scripts/enrollment-admission-postgres.test.mjs
          node scripts/tenant-ga-admission-postgres.test.mjs --installed
          node scripts/tenant-ga-admission-concurrency-postgres.test.mjs
          node scripts/ga-trial-legal-consent-postgres.test.mjs --installed
          node scripts/ga-trial-auth-delete-postgres.test.mjs --installed
          node scripts/team-invitation-acceptance-postgres.mjs --installed
          node scripts/member-api-key-revocation-postgres.mjs
          node scripts/cloud-signup-workspace-name-postgres.mjs
          node scripts/onprem-licensed-bootstrap-postgres.test.mjs
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/ingest-seat-reduction.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/provider-term-seat-expiry.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/events-seat-admission.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/seat-usage-effective-view.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/enrollment-rotation-resolution.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/device-membership-token.rollback.sql
          pnpm verify:supabase-pilot-audit-live
          pnpm verify:supabase-device-revocation-live

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          if [[ -n "${SUPABASE_BIN:-}" && -x "${SUPABASE_BIN}" ]]; then
            "${SUPABASE_BIN}" stop --no-backup
          fi

      - name: Blocking offboarding and retention PostgreSQL gates
        shell: bash
        run: |
          set -euo pipefail
          docker pull supabase/postgres:17.11.0.004
          node --test scripts/oidc-administration-postgres.test.mjs
          node --test scripts/saml-administration-postgres.test.mjs
          node --test scripts/saml-outage-recovery.test.mjs scripts/saml-outage-recovery-postgres.test.mjs
          node --test scripts/discovery-cloud-postgres.test.mjs
          node --test scripts/fleet-signed-delivery-postgres.test.mjs
          node --test scripts/delegated-session-policy-postgres.test.mjs
          pnpm verify:offboarding
          pnpm verify:retention
          node --test scripts/tenant-rate-limit-postgres.test.mjs

      - name: Full deterministic quality gate
        run: pnpm quality:static && pnpm audit:prod && pnpm audit:build && pnpm check && pnpm test && pnpm test:coverage && pnpm test:coverage:core && pnpm verify:release-signing && pnpm verify:provenance

      - name: Setup private profile Node (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          cache: pnpm

      - name: Private privacy full and installed signed MCP release gate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl libseccomp2
          python -m venv --copies "${RUNNER_TEMP}/privacy-python"
          "${RUNNER_TEMP}/privacy-python/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r packages/privacy/parsers/requirements.lock.txt
          "${RUNNER_TEMP}/privacy-python/bin/python" -m pip check
          AIDR_PYTHON="${RUNNER_TEMP}/privacy-python/bin/python" AIDR_TEST_PYTHON="${RUNNER_TEMP}/privacy-python/bin/python" pnpm --filter @singularityrd/aidr-privacy test:ci:platform

      - name: Mandatory SDK ESM and CJS mTLS input and output gate
        run: |
          pnpm --filter @singularityrd/aidr-privacy build:release
          node --test packages/sdk/src/__tests__/privacy-send-mtls.test.mjs

      # verify:enforcement rebuilds the development flavour in place before it
      # restores a release build, so it runs before the deterministic build
      # whose dist/ trees become the candidate inputs.
      - name: Built-artifact enforcement in both build flavours
        run: pnpm build:release && pnpm verify:enforcement

      - name: Deterministic commercial release build
        env:
          AIDR_BUILD_FLAVOR: commercial
        run: pnpm build:release

      - name: Codex hook verification against the candidate bundle
        run: pnpm verify:codex

      - name: Verify Unix fleet lifecycle
        run: pnpm verify:fleet:unix

      - name: Dashboard static route gate
        run: pnpm -C packages/dashboard test:route-smoke:static

      - name: Clean-source and diff gate after unsigned build
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/lib/release-source-clean.mjs

      - name: Archive unsigned release inputs
        id: prepared_inputs
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs = require('node:fs'); const crypto = require('node:crypto'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sbom_sha256=' + crypto.createHash('sha256').update(fs.readFileSync('.release-evidence/aidr-sbom.cdx.json')).digest('hex') + '\n');"
          if find packages/core/dist packages/claude-code/dist packages/claude-code/resources packages/extension/dist \
            packages/openclaw/dist packages/opencode/dist packages/cli/dist packages/sdk/dist \
            packages/dashboard/dist packages/codex/dist packages/mcp-gateway/dist packages/privacy/dist \
            -name '.env*' -print -quit | grep -q .; then
            echo "Release inputs contain a forbidden .env* path." >&2
            exit 1
          fi
          tar -czf "${RUNNER_TEMP}/prepared-release.tgz" \
            .release-evidence/aidr-sbom.cdx.json \
            .release-evidence/aidr-sbom.cdx.json.sha256 \
            packages/core/dist packages/claude-code/dist packages/claude-code/resources packages/extension/dist \
            packages/openclaw/dist packages/opencode/dist packages/cli/dist \
            packages/sdk/dist packages/dashboard/dist packages/codex/dist packages/mcp-gateway/dist packages/privacy/dist
          echo "prepared_archive_sha256=$(sha256sum "${RUNNER_TEMP}/prepared-release.tgz" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Upload unsigned release inputs (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-prepared-${{ steps.rc_meta.outputs.tag }}
          path: ${{ runner.temp }}/prepared-release.tgz
          if-no-files-found: error
          retention-days: 1

  windows-authenticode:
    name: Sign exact Windows fleet and native response inputs
    needs: build-rc
    runs-on: windows-2022
    timeout-minutes: 20
    environment: release-candidate
    permissions:
      contents: read
      # Only for the azure-key-vault / jsign AZUREKEYVAULT signer: a GitHub OIDC token
      # exchanged for a short-lived Azure token (no client secret is stored).
      id-token: write
    outputs:
      receipt_sha256: ${{ steps.windows_sign.outputs.receipt_sha256 }}
      archive_sha256: ${{ steps.windows_sign.outputs.archive_sha256 }}
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download unsigned release inputs (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-prepared-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/prepared-release

      - name: Prepare independently bound Windows signing inputs
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.build-rc.outputs.sha }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build-rc.outputs.prepared_archive_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "prepared-release/prepared-release.tgz"
          if ($env:EXPECTED_ARCHIVE_SHA256 -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_ARCHIVE_SHA256) { throw "Unsigned build archive hash mismatch" }
          & tar -xzf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Unsigned release extraction failed" }
          & node .github/scripts/windows-authenticode-inputs.mjs prepare --stage (Join-Path $env:RUNNER_TEMP "windows-authenticode") --git-sha $env:EXPECTED_SHA --unsigned-release-sha256 $env:EXPECTED_ARCHIVE_SHA256
          if ($LASTEXITCODE -ne 0) { throw "Windows signing input verification failed" }

      - name: Authenticode sign with ephemeral runner certificate custody
        id: windows_sign
        shell: pwsh
        env:
          # Signer backend (scripts/windows-authenticode-signer.ps1, docs/operations/windows-code-signing.md):
          # pfx (ephemeral PFX custody, local tests), azure-key-vault (AzureSignTool) or jsign (cloud HSM / token).
          AIDR_WINDOWS_SIGNER: ${{ vars.AIDR_WINDOWS_SIGNER || 'pfx' }}
          AIDR_AZURE_KEY_VAULT_URL: ${{ vars.AIDR_AZURE_KEY_VAULT_URL }}
          AIDR_AZURE_KEY_VAULT_CERTIFICATE: ${{ vars.AIDR_AZURE_KEY_VAULT_CERTIFICATE }}
          AIDR_AZURE_TENANT_ID: ${{ vars.AIDR_AZURE_TENANT_ID }}
          AIDR_AZURE_CLIENT_ID: ${{ vars.AIDR_AZURE_CLIENT_ID }}
          AIDR_JSIGN_STORETYPE: ${{ vars.AIDR_JSIGN_STORETYPE }}
          AIDR_JSIGN_KEYSTORE: ${{ vars.AIDR_JSIGN_KEYSTORE }}
          AIDR_JSIGN_ALIAS: ${{ vars.AIDR_JSIGN_ALIAS }}
          AIDR_JSIGN_CERTCHAIN_PEM: ${{ vars.AIDR_JSIGN_CERTCHAIN_PEM }}
          AIDR_JSIGN_STOREPASS: ${{ (vars.AIDR_WINDOWS_SIGNER || 'pfx') == 'jsign' && secrets.AIDR_JSIGN_STOREPASS || '' }}
          WINDOWS_CODE_SIGNING_PFX_B64: ${{ (vars.AIDR_WINDOWS_SIGNER || 'pfx') == 'pfx' && secrets.AIDR_WINDOWS_CODE_SIGNING_PFX_B64 || '' }}
          WINDOWS_CODE_SIGNING_PFX_PASSWORD: ${{ (vars.AIDR_WINDOWS_SIGNER || 'pfx') == 'pfx' && secrets.AIDR_WINDOWS_CODE_SIGNING_PFX_PASSWORD || '' }}
          WINDOWS_CODE_SIGNING_THUMBPRINT: ${{ secrets.AIDR_WINDOWS_CODE_SIGNING_THUMBPRINT }}
          WINDOWS_TIMESTAMP_SERVER: ${{ vars.AIDR_WINDOWS_TIMESTAMP_SERVER }}
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/windows-authenticode-signer.ps1
          $signer = Resolve-AidrAuthenticodeSigner $env:AIDR_WINDOWS_SIGNER
          if ($signer -eq 'pfx') {
            if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "PFX import requires an ephemeral GitHub-hosted runner" }
          } elseif (-not [string]::IsNullOrWhiteSpace($env:AIDR_JSIGN_CERTCHAIN_PEM)) {
            # The public certificate chain some jsign store types need (--certfile).
            $env:AIDR_JSIGN_CERTFILE = Join-Path $env:RUNNER_TEMP 'aidr-jsign-chain.pem'
            [System.IO.File]::WriteAllText($env:AIDR_JSIGN_CERTFILE, $env:AIDR_JSIGN_CERTCHAIN_PEM)
          }
          $thumbprint = $env:WINDOWS_CODE_SIGNING_THUMBPRINT
          $timestamp = $env:WINDOWS_TIMESTAMP_SERVER
          if ($thumbprint -cnotmatch '^[0-9A-F]{40}$') { throw "The independently pinned Windows signing thumbprint is required" }
          if ($signer -eq 'pfx' -and ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_PASSWORD))) { throw "Protected Windows signing certificate, password and thumbprint are required" }
          $timestampUri = $null
          if (-not [Uri]::TryCreate($timestamp, [UriKind]::Absolute, [ref]$timestampUri) -or $timestampUri.Scheme -cne 'https' -or $timestampUri.UserInfo -or $timestampUri.Query -or $timestampUri.Fragment) { throw "An approved protected HTTPS timestamp server is required" }
          $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
          if (Test-Path -LiteralPath $certificatePath) { throw "Signing certificate already exists; refusing to replace runner custody" }
          $privateDirectory = Join-Path $env:RUNNER_TEMP "aidr-windows-signing-private"
          $pfxPath = Join-Path $privateDirectory "publisher.pfx"
          $imported = $false
          $collection = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          try {
            if ($signer -eq 'pfx') {
            New-Item -ItemType Directory -Path $privateDirectory -ErrorAction Stop | Out-Null
            $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            $acl.SetAccessRuleProtection($true, $false)
            $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
            $acl.SetOwner($sid)
            foreach ($identity in @($sid, [System.Security.Principal.SecurityIdentifier]::new('S-1-5-18'), [System.Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'))) {
              $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($identity, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
            }
            Set-Acl -LiteralPath $privateDirectory -AclObject $acl
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_PFX_B64)
            $passwordText = $env:WINDOWS_CODE_SIGNING_PFX_PASSWORD
            $password = ConvertTo-SecureString -String $passwordText -AsPlainText -Force
            Remove-Item Env:WINDOWS_CODE_SIGNING_PFX_B64, Env:WINDOWS_CODE_SIGNING_PFX_PASSWORD
            try {
              $collection.Import($pfxBytes, $passwordText, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            } finally {
              $passwordText = $null
            }
            if ($collection.Count -ne 1 -or $collection[0].Thumbprint -cne $thumbprint -or -not $collection[0].HasPrivateKey) { throw "PFX must contain exactly the independently pinned publisher certificate and private key" }
            [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
            $importedCertificates = @(Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation 'Cert:\CurrentUser\My' -ErrorAction Stop)
            $imported = Test-Path -LiteralPath $certificatePath
            if ($importedCertificates.Count -ne 1 -or $importedCertificates[0].Thumbprint -cne $thumbprint -or -not $imported) { throw "Runner certificate import did not preserve the approved identity" }
            Remove-Item -LiteralPath $pfxPath -Force
            }
            $stage = Join-Path $env:RUNNER_TEMP "windows-authenticode"
            & ./scripts/sign-windows-response-payload.ps1 -FleetScriptRoot (Join-Path $stage 'fleet') -ClaudeDist (Join-Path $stage 'claude') -InputManifestPath (Join-Path $stage 'input-manifest.json') -ExpectedThumbprint $thumbprint -TimestampServer $timestamp -ReceiptPath (Join-Path $stage 'authenticode-receipt.json') -Signer $signer
            if ($LASTEXITCODE -ne 0) { throw "Windows Authenticode signing failed" }
            $receiptHash = (Get-FileHash -LiteralPath (Join-Path $stage 'authenticode-receipt.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            $signedArchive = Join-Path $env:RUNNER_TEMP 'windows-authenticode.tgz'
            & tar -czf $signedArchive -C $stage fleet claude input-manifest.json authenticode-receipt.json
            if ($LASTEXITCODE -ne 0) { throw "Signed Windows input archiving failed" }
            "receipt_sha256=$receiptHash" >> $env:GITHUB_OUTPUT
            "archive_sha256=$((Get-FileHash -LiteralPath $signedArchive -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "Windows Authenticode receipt SHA-256: $receiptHash" >> $env:GITHUB_STEP_SUMMARY
          } finally {
            $passwordText = $null
            Remove-Item Env:WINDOWS_CODE_SIGNING_PFX_B64, Env:WINDOWS_CODE_SIGNING_PFX_PASSWORD -ErrorAction SilentlyContinue
            foreach ($certificate in $collection) { $certificate.Dispose() }
            if ($password) { $password.Dispose() }
            if ($imported -or (Test-Path -LiteralPath $certificatePath)) { Remove-Item -LiteralPath $certificatePath -DeleteKey -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
            if (Test-Path -LiteralPath $privateDirectory) { Remove-Item -LiteralPath $privateDirectory -Force }
          }

      - name: Upload signed Windows inputs (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-windows-authenticode-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/windows-authenticode.tgz
          if-no-files-found: error
          retention-days: 1

  package-signing:
    name: Sign AIG data and package manifests
    needs: [build-rc, windows-authenticode]
    runs-on: ubuntu-22.04
    environment: release-candidate
    permissions:
      contents: read
    env:
      AIDR_RELEASE_TAG: ${{ needs.build-rc.outputs.tag }}
      AIDR_RELEASE_VERSION: ${{ needs.build-rc.outputs.version }}
      AIDR_EXPECTED_PREBUILT_SBOM_SHA256: ${{ needs.build-rc.outputs.sbom_sha256 }}
      AIDR_EXPECTED_WINDOWS_AUTHENTICODE_RECEIPT_SHA256: ${{ needs.windows-authenticode.outputs.receipt_sha256 }}
      AIDR_WINDOWS_CODE_SIGNING_THUMBPRINT: ${{ secrets.AIDR_WINDOWS_CODE_SIGNING_THUMBPRINT }}
      AIDR_BUILD_ID: ${{ needs.build-rc.outputs.sha }}
      AIDR_GIT_SHA: ${{ needs.build-rc.outputs.sha }}
      AIDR_CI_RUN_ID: ${{ github.run_id }}
      AIDR_WATERMARK_ID: rc-${{ needs.build-rc.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.build-rc.outputs.source_date_epoch }}
      AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT }}
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download unsigned release inputs (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-prepared-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/prepared-release

      - name: Restore unsigned release inputs
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build-rc.outputs.prepared_archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_ARCHIVE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          echo "${EXPECTED_ARCHIVE_SHA256}  ${RUNNER_TEMP}/prepared-release/prepared-release.tgz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/prepared-release/prepared-release.tgz" -C "${GITHUB_WORKSPACE}"

      - name: Download signed Windows inputs (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-windows-authenticode-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/signed-windows

      - name: Verify and consume Authenticode inputs before package manifests
        shell: bash
        env:
          EXPECTED_WINDOWS_ARCHIVE_SHA256: ${{ needs.windows-authenticode.outputs.archive_sha256 }}
          EXPECTED_UNSIGNED_ARCHIVE_SHA256: ${{ needs.build-rc.outputs.prepared_archive_sha256 }}
          EXPECTED_TIMESTAMP_SERVER: ${{ vars.AIDR_WINDOWS_TIMESTAMP_SERVER }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_WINDOWS_ARCHIVE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          echo "${EXPECTED_WINDOWS_ARCHIVE_SHA256}  ${RUNNER_TEMP}/signed-windows/windows-authenticode.tgz" | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/verified-windows"
          tar -xzf "${RUNNER_TEMP}/signed-windows/windows-authenticode.tgz" -C "${RUNNER_TEMP}/verified-windows"
          node .github/scripts/windows-authenticode-inputs.mjs consume \
            --stage "${RUNNER_TEMP}/verified-windows" --git-sha "${AIDR_GIT_SHA}" \
            --unsigned-release-sha256 "${EXPECTED_UNSIGNED_ARCHIVE_SHA256}" \
            --receipt-sha256 "${AIDR_EXPECTED_WINDOWS_AUTHENTICODE_RECEIPT_SHA256}" \
            --thumbprint "${AIDR_WINDOWS_CODE_SIGNING_THUMBPRINT}" --timestamp-server "${EXPECTED_TIMESTAMP_SERVER}"

      - name: Sign and verify pinned AIG data only
        shell: bash
        env:
          AIG_PRIVATE_KEY_PEM: ${{ secrets.AIG_DATA_SIGNING_PRIVATE_KEY_PEM }}
          AIG_PUBLIC_KEY_PEM: ${{ secrets.AIG_DATA_SIGNING_PUBLIC_KEY_PEM }}
          AIG_EXPECTED_PUBLIC_SHA256: ${{ secrets.AIG_DATA_SIGNING_PUBLIC_KEY_SHA256 }}
          AIG_KEY_ID: ${{ vars.AIG_DATA_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          [[ -n "${AIG_PRIVATE_KEY_PEM}" && -n "${AIG_PUBLIC_KEY_PEM}" && -n "${AIG_EXPECTED_PUBLIC_SHA256}" && -n "${AIG_KEY_ID}" ]] || {
            echo "AIG release signing key, public key, fingerprint and key id are required." >&2
            exit 1
          }
          [[ "${AIG_EXPECTED_PUBLIC_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${AIG_KEY_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          private_path="${RUNNER_TEMP}/aig-data-private.pem"
          public_path="${RUNNER_TEMP}/aig-data-public.pem"
          cleanup() { rm -f "${private_path}" "${public_path}"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "${AIG_PRIVATE_KEY_PEM}" > "${private_path}"
          printf '%s\n' "${AIG_PUBLIC_KEY_PEM}" > "${public_path}"
          unset AIG_PRIVATE_KEY_PEM AIG_PUBLIC_KEY_PEM
          node --input-type=module - "${private_path}" "${public_path}" "${AIG_EXPECTED_PUBLIC_SHA256}" <<'NODE'
          import { createHash, createPrivateKey, createPublicKey } from "node:crypto";
          import { readFileSync } from "node:fs";
          const privateKey = createPrivateKey(readFileSync(process.argv[2], "utf8"));
          const suppliedPublic = createPublicKey(readFileSync(process.argv[3], "utf8"));
          const derivedPublic = createPublicKey(privateKey);
          if (privateKey.asymmetricKeyType !== "rsa" || suppliedPublic.asymmetricKeyType !== "rsa") throw new Error("AIG release keys must be RSA");
          const suppliedDer = suppliedPublic.export({ type: "spki", format: "der" });
          const derivedDer = derivedPublic.export({ type: "spki", format: "der" });
          if (!suppliedDer.equals(derivedDer)) throw new Error("AIG private/public key mismatch");
          const actual = createHash("sha256").update(suppliedDer).digest("hex");
          if (actual !== process.argv[4]) throw new Error(`AIG public-key fingerprint mismatch: ${actual}`);
          NODE
          AIG_SIGNING_PRIVATE_KEY_PATH="${private_path}" AIG_SIGNING_KEY_ID="${AIG_KEY_ID}" node scripts/compile-aig-data.mjs
          rm -f "${private_path}"
          AIG_RELEASE=true AIG_REQUIRE_SIGNED=true \
            AIG_SIGNING_PUBLIC_KEY_PATH="${public_path}" \
            AIG_TRUSTED_SIGNING_KEY_ID="${AIG_KEY_ID}" \
            AIG_TRUSTED_SIGNING_PUBLIC_KEY_SHA256="${AIG_EXPECTED_PUBLIC_SHA256}" \
            node scripts/verify-aig-source.mjs
          node packages/core/scripts/copy-generated.mjs
          AIG_RELEASE=true AIG_REQUIRE_SIGNED=true \
            AIG_GENERATED_DIR="${GITHUB_WORKSPACE}/packages/core/dist/generated" \
            AIG_SIGNING_PUBLIC_KEY_PATH="${public_path}" \
            AIG_TRUSTED_SIGNING_KEY_ID="${AIG_KEY_ID}" \
            AIG_TRUSTED_SIGNING_PUBLIC_KEY_SHA256="${AIG_EXPECTED_PUBLIC_SHA256}" \
            node scripts/verify-aig-source.mjs
          signed_data_digest="$(node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { existsSync } from "node:fs";
          import { readdir, readFile } from "node:fs/promises";
          import path from "node:path";
          const root = process.cwd();
          const roots = ["packages/core/src/generated", "threats", "allowlists"].map((item) => path.join(root, item)).filter(existsSync);
          const tuples = [];
          for (const start of roots) {
            const stack = [start];
            while (stack.length) {
              const current = stack.pop();
              for (const entry of await readdir(current, { withFileTypes: true })) {
                const file = path.join(current, entry.name);
                if (entry.isDirectory()) stack.push(file);
                else if (entry.isFile()) tuples.push({ path: path.relative(root, file).replaceAll("\\", "/"), sha256: createHash("sha256").update(await readFile(file)).digest("hex") });
              }
            }
          }
          tuples.sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
          process.stdout.write(`sha256:${createHash("sha256").update(JSON.stringify(tuples)).digest("hex")}`);
          NODE
          )"
          [[ "${signed_data_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "AIDR_DATA_DIGEST=${signed_data_digest}" >> "${GITHUB_ENV}"
          git restore --source=HEAD --worktree -- packages/core/src/generated
          git diff --exit-code -- packages/core/src/generated
          cleanup
          trap - EXIT

      - name: Prepare final package manifests without private keys
        shell: bash
        run: |
          set -euo pipefail
          AIDR_PREBUILT_SBOM_PATH="${GITHUB_WORKSPACE}/.release-evidence/aidr-sbom.cdx.json" \
            node scripts/release-artifact-manifests.mjs

      - name: Sign package manifests only
        shell: bash
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.AIDR_SIGNING_PRIVATE_KEY_PEM }}
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_PRIVATE_KEY}" && -n "${SIGNING_PUBLIC_KEY}" && -n "${AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT}" ]] || {
            echo "Package signing key, public key and fingerprint are required." >&2
            exit 1
          }
          private_path="${RUNNER_TEMP}/aidr-package-private.pem"
          public_path="${RUNNER_TEMP}/aidr-package-public.pem"
          cleanup() { rm -f "${private_path}" "${public_path}"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "${SIGNING_PRIVATE_KEY}" > "${private_path}"
          printf '%s\n' "${SIGNING_PUBLIC_KEY}" > "${public_path}"
          unset SIGNING_PRIVATE_KEY SIGNING_PUBLIC_KEY
          node --input-type=module - "${private_path}" "${public_path}" "${AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT}" <<'NODE'
          import { createHash, createPrivateKey, createPublicKey } from "node:crypto";
          import { readFileSync } from "node:fs";
          const privateKey = createPrivateKey(readFileSync(process.argv[2], "utf8"));
          const suppliedPublic = createPublicKey(readFileSync(process.argv[3], "utf8"));
          const derivedPublic = createPublicKey(privateKey);
          if (privateKey.asymmetricKeyType !== "ed25519" || suppliedPublic.asymmetricKeyType !== "ed25519") throw new Error("Package signing keys must be Ed25519");
          const suppliedDer = suppliedPublic.export({ type: "spki", format: "der" });
          if (!suppliedDer.equals(derivedPublic.export({ type: "spki", format: "der" }))) throw new Error("Package private/public key mismatch");
          const expected = process.argv[4].toLowerCase().replace(/^sha256:/, "");
          const actual = createHash("sha256").update(suppliedDer).digest("hex");
          if (!/^[0-9a-f]{64}$/.test(expected) || actual !== expected) throw new Error(`Package public-key fingerprint mismatch: ${actual}`);
          NODE
          artifact_dirs=(
            packages/core/dist packages/claude-code/dist packages/extension/dist
            packages/openclaw/dist packages/opencode/dist packages/cli/dist
            packages/sdk/dist packages/dashboard/dist packages/codex/dist packages/mcp-gateway/dist packages/privacy/dist
          )
          for artifact_dir in "${artifact_dirs[@]}"; do
            node scripts/sign-artifact-manifest.mjs --dir "${artifact_dir}" --key "${private_path}"
          done
          node scripts/generate-artifact-manifest.mjs \
            --dir packages/claude-code \
            --id claude-code/package \
            --version "${AIDR_RELEASE_VERSION}" \
            --watermark-id "${AIDR_WATERMARK_ID}" \
            --channel commercial
          node scripts/sign-artifact-manifest.mjs --dir packages/claude-code --key "${private_path}"
          rm -f "${private_path}"
          node scripts/verify-release-evidence.mjs \
            --public-key "${public_path}" \
            --fingerprint "${AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT}" \
            --dirs "${artifact_dirs[@]}" packages/claude-code
          cleanup
          trap - EXIT

      - name: Archive signed package inputs
        shell: bash
        run: |
          set -euo pipefail
          if find packages/core/dist packages/claude-code/dist packages/claude-code/resources packages/extension/dist \
            packages/openclaw/dist packages/opencode/dist packages/cli/dist packages/sdk/dist \
            packages/dashboard/dist packages/codex/dist packages/mcp-gateway/dist packages/privacy/dist \
            -name '.env*' -print -quit | grep -q .; then
            echo "Release inputs contain a forbidden .env* path." >&2
            exit 1
          fi
          tar -czf "${RUNNER_TEMP}/signed-package-inputs.tgz" \
            .release-evidence/windows-fleet .release-evidence/windows-authenticode-input-manifest.json .release-evidence/windows-authenticode-receipt.json \
            .release-evidence/aidr-sbom.cdx.json \
            .release-evidence/aidr-sbom.cdx.json.sha256 \
            packages/core/dist packages/claude-code/package.json packages/claude-code/aidr-artifact.manifest.json packages/claude-code/aidr-artifact.manifest.sig packages/claude-code/dist packages/claude-code/resources packages/extension/dist \
            packages/openclaw/dist packages/opencode/dist packages/cli/dist \
            packages/sdk/dist packages/dashboard/dist packages/codex/dist packages/mcp-gateway/dist packages/privacy/dist

      - name: Upload signed package inputs (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-signed-packages-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/signed-package-inputs.tgz
          if-no-files-found: error
          retention-days: 1

  assemble-e2e:
    name: Assemble and verify exact RC candidate
    needs: [build-rc, package-signing]
    runs-on: ubuntu-22.04
    environment: release-candidate
    permissions:
      contents: read
    outputs:
      candidate_digest: ${{ steps.candidate.outputs.digest }}
      candidate_bound_at: ${{ steps.candidate.outputs.bound_at }}
    env:
      AIDR_RELEASE_TAG: ${{ needs.build-rc.outputs.tag }}
      AIDR_RELEASE_VERSION: ${{ needs.build-rc.outputs.version }}
      AIDR_BUILD_ID: ${{ needs.build-rc.outputs.sha }}
      AIDR_GIT_SHA: ${{ needs.build-rc.outputs.sha }}
      AIDR_CI_RUN_ID: ${{ github.run_id }}
      AIDR_WATERMARK_ID: rc-${{ needs.build-rc.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.build-rc.outputs.source_date_epoch }}
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen dependency install (no lifecycle mutation)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download signed package inputs (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-signed-packages-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/signed-packages

      - name: Restore signed package inputs
        run: tar -xzf "${RUNNER_TEMP}/signed-packages/signed-package-inputs.tgz" -C "${GITHUB_WORKSPACE}"

      - name: Reverify signed packages across runner boundary
        shell: bash
        env:
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
          SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_PUBLIC_KEY}" && -n "${SIGNING_PUBLIC_KEY_FINGERPRINT}" ]] || {
            echo "Package public key and fingerprint are required." >&2
            exit 1
          }
          public_path="${RUNNER_TEMP}/aidr-package-public.pem"
          cleanup() { rm -f "${public_path}"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "${SIGNING_PUBLIC_KEY}" > "${public_path}"
          unset SIGNING_PUBLIC_KEY
          node scripts/verify-release-evidence.mjs \
            --public-key "${public_path}" \
            --fingerprint "${SIGNING_PUBLIC_KEY_FINGERPRINT}" \
            --dirs \
              packages/core/dist packages/claude-code/dist packages/extension/dist \
              packages/openclaw/dist packages/opencode/dist packages/cli/dist \
              packages/sdk/dist packages/dashboard/dist packages/codex/dist packages/mcp-gateway/dist packages/privacy/dist \
              packages/claude-code
          cleanup
          trap - EXIT

      - name: Verify restored Claude plugin payload
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {
            assertClaudePluginPackage,
            assertClaudePluginResourcesCanonical,
          } from "./scripts/lib/claude-plugin-package.mjs";
          assertClaudePluginPackage(process.cwd());
          assertClaudePluginResourcesCanonical(process.cwd());
          NODE

      - name: Assemble exact consumer artifacts
        env:
          RELEASE_OUTPUT_DIR: ${{ github.workspace }}/release-output
          AIDR_DETERMINISTIC_MANIFEST: "1"
          VSIX_OUTPUT_DIR: ${{ github.workspace }}/release-output
        run: |
          set -euo pipefail
          node .github/scripts/build-release-bundle.mjs
          node .github/scripts/package-vsix.mjs

      - name: Clean-consumer package install gate
        shell: bash
        env:
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_PUBLIC_KEY}" ]] || { echo "Package public key is required for the signed clean-consumer gate." >&2; exit 1; }
          public_path="${RUNNER_TEMP}/aidr-clean-consumer-public.pem"
          cleanup() { rm -f "${public_path}"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "${SIGNING_PUBLIC_KEY}" > "${public_path}"
          unset SIGNING_PUBLIC_KEY
          AIDR_SIGNING_PUBLIC_KEY_PEM_PATH="${public_path}" \
            node scripts/verify-package-install.mjs --require-signed --tarball-dir release-output
          cleanup
          trap - EXIT

      - name: Bind candidate identity and digest
        id: candidate
        shell: bash
        env:
          EXPECTED_TAG: ${{ needs.build-rc.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.build-rc.outputs.version }}
          EXPECTED_SHA: ${{ needs.build-rc.outputs.sha }}
          EXPECTED_SOURCE_DATE_EPOCH: ${{ needs.build-rc.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync("release-output/release-metadata.json", "utf8"));
          const expected = {
            release_tag: process.env.EXPECTED_TAG,
            release_version: process.env.EXPECTED_VERSION,
            git_sha: process.env.EXPECTED_SHA,
            source_date_epoch: Number(process.env.EXPECTED_SOURCE_DATE_EPOCH),
          };
          for (const [field, value] of Object.entries(expected)) {
            if (metadata[field] !== value) throw new Error(`candidate ${field} mismatch: ${metadata[field]} != ${value}`);
          }
          NODE
          candidate_digest="$(sha256sum release-output/release-metadata.json release-output/release-inventory.json | sha256sum | awk '{print $1}')"
          [[ "${candidate_digest}" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid candidate digest" >&2; exit 1; }
          candidate_bound_at="$(node -p 'new Date().toISOString()')"
          {
            echo "digest=${candidate_digest}"
            echo "bound_at=${candidate_bound_at}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "AIDR_E2E_RC_DIGEST=${candidate_digest}"
            echo "AIDR_E2E_CANDIDATE_BOUND_AT=${candidate_bound_at}"
            echo "AIDR_CANDIDATE_SHA256=${candidate_digest}"
            echo "AIDR_RELEASE_CANDIDATE_SHA256=${candidate_digest}"
          } >> "${GITHUB_ENV}"

      - name: Clean-source and diff gate after candidate assembly
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/lib/release-source-clean.mjs

      - name: Archive exact unsigned outer bundle
        run: tar -czf "${RUNNER_TEMP}/exact-release-candidate.tgz" release-output

      - name: Upload exact unsigned outer bundle (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-exact-candidate-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/exact-release-candidate.tgz
          if-no-files-found: error
          retention-days: 1

  acceptance-windows-native:
    name: Windows native Claude package acceptance of exact RC
    needs: [build-rc, assemble-e2e]
    runs-on: windows-2022
    environment: release-candidate
    permissions:
      contents: read
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download exact unsigned outer bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-exact-candidate-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/exact-candidate

      - name: Download signed Claude fleet inputs (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-signed-packages-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/signed-packages

      - name: Verify Windows fleet lifecycle against signed inputs
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_THUMBPRINT: ${{ secrets.AIDR_WINDOWS_CODE_SIGNING_THUMBPRINT }}
          WINDOWS_TIMESTAMP_SERVER: ${{ vars.AIDR_WINDOWS_TIMESTAMP_SERVER }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "signed-packages/signed-package-inputs.tgz"
          & tar -xzf $archive -C $env:GITHUB_WORKSPACE packages/claude-code/dist .release-evidence/windows-fleet .release-evidence/windows-authenticode-input-manifest.json .release-evidence/windows-authenticode-receipt.json
          if ($LASTEXITCODE -ne 0) { throw "Signed Claude fleet input extraction failed" }
          & ./scripts/sign-windows-response-payload.ps1 -CheckOnly -FleetScriptRoot (Join-Path $env:GITHUB_WORKSPACE '.release-evidence/windows-fleet') -ClaudeDist (Join-Path $env:GITHUB_WORKSPACE 'packages/claude-code/dist') -InputManifestPath (Join-Path $env:GITHUB_WORKSPACE '.release-evidence/windows-authenticode-input-manifest.json') -ReceiptPath (Join-Path $env:GITHUB_WORKSPACE '.release-evidence/windows-authenticode-receipt.json') -ExpectedThumbprint $env:WINDOWS_CODE_SIGNING_THUMBPRINT -TimestampServer $env:WINDOWS_TIMESTAMP_SERVER
          if ($LASTEXITCODE -ne 0) { throw "Final packaged Authenticode verification failed" }
          & node scripts/verify-windows-fleet.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows fleet lifecycle verification failed" }

      - name: Verify Windows response actions and worker lifecycle
        run: node --test scripts/windows-response-action.test.mjs scripts/windows-response-worker-install.test.mjs

      - name: Verify packaged native AMSI and hook decisions on Windows
        shell: pwsh
        env:
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.assemble-e2e.outputs.candidate_digest }}
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PUBLIC_KEY)) { throw "Package public key is required for native candidate acceptance" }
          $archive = Join-Path $env:RUNNER_TEMP "exact-candidate/exact-release-candidate.tgz"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Exact candidate archive is missing" }
          & tar -xzf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Exact candidate extraction failed" }
          $publicFile = New-TemporaryFile
          try {
            [System.IO.File]::WriteAllText($publicFile.FullName, $env:SIGNING_PUBLIC_KEY, [System.Text.UTF8Encoding]::new($false))
            $result = & node scripts/verify-claude-native-candidate.mjs --candidate release-output --expected-candidate-digest $env:EXPECTED_CANDIDATE_DIGEST --public-key $publicFile.FullName
            if ($LASTEXITCODE -ne 0) { throw "Claude native candidate acceptance failed" }
            $result | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "claude-native-candidate.json") -Encoding utf8NoBOM
            $result
          } finally {
            Remove-Item -LiteralPath $publicFile.FullName -Force
          }

      - name: Upload Windows native package receipt (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-claude-native-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/claude-native-candidate.json
          if-no-files-found: error
          retention-days: 90

  acceptance-e2e:
    name: Protected real-host acceptance of exact RC
    needs: [build-rc, assemble-e2e]
    runs-on: ${{ vars.AIDR_ACCEPTANCE_RUNNER_LABEL || 'ubuntu-22.04' }}
    environment: release-candidate
    permissions:
      contents: read
    env:
      AIDR_RELEASE_TAG: ${{ needs.build-rc.outputs.tag }}
      AIDR_RELEASE_VERSION: ${{ needs.build-rc.outputs.version }}
      AIDR_BUILD_ID: ${{ needs.build-rc.outputs.sha }}
      AIDR_GIT_SHA: ${{ needs.build-rc.outputs.sha }}
      AIDR_CI_RUN_ID: ${{ github.run_id }}
      AIDR_WATERMARK_ID: rc-${{ needs.build-rc.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.build-rc.outputs.source_date_epoch }}
      AIDR_E2E_RC_DIGEST: ${{ needs.assemble-e2e.outputs.candidate_digest }}
      AIDR_E2E_CANDIDATE_BOUND_AT: ${{ needs.assemble-e2e.outputs.candidate_bound_at }}
    steps:
      - name: Fail early unless protected real-host prerequisites exist
        shell: bash
        env:
          AIDR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          AIDR_CURSOR_PATH: ${{ vars.AIDR_CURSOR_PATH }}
          AIDR_VSCODE_PATH: ${{ vars.AIDR_VSCODE_PATH }}
          AIDR_AGENT_PATH: ${{ vars.AIDR_AGENT_PATH }}
          AIDR_CODEX_PATH: ${{ vars.AIDR_CODEX_PATH }}
          AIDR_CODEX_CREDENTIALS: ${{ vars.AIDR_CODEX_CREDENTIALS }}
          AIDR_AIG_PYTHON: ${{ vars.AIDR_AIG_PYTHON }}
          AIDR_ACCEPTANCE_DEPLOYMENT_DIR: ${{ vars.AIDR_ACCEPTANCE_DEPLOYMENT_DIR }}
          AIDR_AIG_E2E_EVIDENCE_SOURCE: ${{ vars.AIDR_AIG_E2E_EVIDENCE }}
          AIDR_AIG_E2E_EVIDENCE_SIGNATURE_SOURCE: ${{ vars.AIDR_AIG_E2E_EVIDENCE_SIGNATURE }}
          AIDR_SUPABASE_E2E_EVIDENCE_SOURCE: ${{ vars.AIDR_SUPABASE_E2E_EVIDENCE }}
          AIDR_SUPABASE_E2E_EVIDENCE_SIGNATURE_SOURCE: ${{ vars.AIDR_SUPABASE_E2E_EVIDENCE_SIGNATURE }}
          AIDR_DASHBOARD_BROWSER_EVIDENCE_SOURCE: ${{ vars.AIDR_DASHBOARD_BROWSER_EVIDENCE }}
          AIDR_DASHBOARD_BROWSER_EVIDENCE_SIGNATURE_SOURCE: ${{ vars.AIDR_DASHBOARD_BROWSER_EVIDENCE_SIGNATURE }}
          AIDR_OPENCLAW_HOST_EVIDENCE_SOURCE: ${{ vars.AIDR_OPENCLAW_HOST_EVIDENCE }}
          AIDR_OPENCLAW_HOST_EVIDENCE_SIGNATURE_SOURCE: ${{ vars.AIDR_OPENCLAW_HOST_EVIDENCE_SIGNATURE }}
          AIDR_OPENCLAW_HOST_EVIDENCE_PUBLIC_KEY: ${{ secrets.AIDR_OPENCLAW_HOST_EVIDENCE_PUBLIC_KEY_PEM }}
          AIDR_EXTERNAL_E2E_EVIDENCE_PUBLIC_KEY: ${{ secrets.AIDR_EXTERNAL_E2E_EVIDENCE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          [[ "${AIDR_RUNNER_ENVIRONMENT}" == "self-hosted" ]] || {
            echo "Real-host acceptance requires a protected self-hosted runner. Configure AIDR_ACCEPTANCE_RUNNER_LABEL before approving this job." >&2
            exit 1
          }
          for command_name in claude opencode; do
            command -v "${command_name}" >/dev/null || {
              echo "Required real-host command is unavailable: ${command_name}" >&2
              exit 1
            }
          done
          for path_name in AIDR_CURSOR_PATH AIDR_VSCODE_PATH AIDR_AGENT_PATH AIDR_CODEX_PATH AIDR_AIG_PYTHON; do
            path_value="${!path_name:-}"
            [[ -n "${path_value}" && -f "${path_value}" && -x "${path_value}" ]] || {
              echo "Protected runner prerequisite ${path_name} must name an executable file." >&2
              exit 1
            }
          done
          [[ -n "${AIDR_CODEX_CREDENTIALS}" && -f "${AIDR_CODEX_CREDENTIALS}" ]] || {
            echo "Protected runner prerequisite AIDR_CODEX_CREDENTIALS must name an existing file." >&2
            exit 1
          }
          [[ -n "${AIDR_ACCEPTANCE_DEPLOYMENT_DIR}" && -f "${AIDR_ACCEPTANCE_DEPLOYMENT_DIR}/deployment.json" ]] || {
            echo "AIDR_ACCEPTANCE_DEPLOYMENT_DIR must name an isolated, installed loopback control plane." >&2
            exit 1
          }
          for evidence_name in AIDR_AIG_E2E_EVIDENCE_SOURCE AIDR_AIG_E2E_EVIDENCE_SIGNATURE_SOURCE AIDR_SUPABASE_E2E_EVIDENCE_SOURCE AIDR_SUPABASE_E2E_EVIDENCE_SIGNATURE_SOURCE AIDR_DASHBOARD_BROWSER_EVIDENCE_SOURCE AIDR_DASHBOARD_BROWSER_EVIDENCE_SIGNATURE_SOURCE AIDR_OPENCLAW_HOST_EVIDENCE_SOURCE AIDR_OPENCLAW_HOST_EVIDENCE_SIGNATURE_SOURCE; do
            evidence_path="${!evidence_name:-}"
            [[ -n "${evidence_path}" && -f "${evidence_path}" ]] || {
              echo "${evidence_name} must name redacted external evidence generated after candidate ${AIDR_E2E_RC_DIGEST} was bound at ${AIDR_E2E_CANDIDATE_BOUND_AT}." >&2
              exit 1
            }
          done
          [[ -n "${AIDR_OPENCLAW_HOST_EVIDENCE_PUBLIC_KEY}" ]] || {
            echo "AIDR_OPENCLAW_HOST_EVIDENCE_PUBLIC_KEY_PEM is required to authenticate the OpenClaw candidate receipt." >&2
            exit 1
          }
          [[ -n "${AIDR_EXTERNAL_E2E_EVIDENCE_PUBLIC_KEY}" ]] || {
            echo "AIDR_EXTERNAL_E2E_EVIDENCE_PUBLIC_KEY_PEM is required to authenticate AIG, Supabase and dashboard candidate receipts." >&2
            exit 1
          }
          evidence_input_dir="${RUNNER_TEMP}/post-candidate-evidence"
          mkdir -p "${evidence_input_dir}"
          cp "${AIDR_AIG_E2E_EVIDENCE_SOURCE}" "${evidence_input_dir}/aig-live-control-plane.json"
          cp "${AIDR_AIG_E2E_EVIDENCE_SIGNATURE_SOURCE}" "${evidence_input_dir}/aig-live-control-plane.json.sig"
          cp "${AIDR_SUPABASE_E2E_EVIDENCE_SOURCE}" "${evidence_input_dir}/supabase-live-control-plane.json"
          cp "${AIDR_SUPABASE_E2E_EVIDENCE_SIGNATURE_SOURCE}" "${evidence_input_dir}/supabase-live-control-plane.json.sig"
          cp "${AIDR_DASHBOARD_BROWSER_EVIDENCE_SOURCE}" "${evidence_input_dir}/dashboard-browser.json"
          cp "${AIDR_DASHBOARD_BROWSER_EVIDENCE_SIGNATURE_SOURCE}" "${evidence_input_dir}/dashboard-browser.json.sig"
          cp "${AIDR_OPENCLAW_HOST_EVIDENCE_SOURCE}" "${evidence_input_dir}/openclaw-host.json"
          cp "${AIDR_OPENCLAW_HOST_EVIDENCE_SIGNATURE_SOURCE}" "${evidence_input_dir}/openclaw-host.json.sig"
          umask 077
          printf '%s\n' "${AIDR_OPENCLAW_HOST_EVIDENCE_PUBLIC_KEY}" > "${evidence_input_dir}/openclaw-host-public.pem"
          printf '%s\n' "${AIDR_EXTERNAL_E2E_EVIDENCE_PUBLIC_KEY}" > "${evidence_input_dir}/external-e2e-public.pem"
          unset AIDR_OPENCLAW_HOST_EVIDENCE_PUBLIC_KEY AIDR_EXTERNAL_E2E_EVIDENCE_PUBLIC_KEY

      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen dependency install (no lifecycle mutation)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download signed package inputs (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-signed-packages-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/signed-packages

      - name: Download exact unsigned outer bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-exact-candidate-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/exact-candidate

      - name: Restore signed inputs and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/signed-packages/signed-package-inputs.tgz" -C "${GITHUB_WORKSPACE}"
          tar -xzf "${RUNNER_TEMP}/exact-candidate/exact-release-candidate.tgz" -C "${GITHUB_WORKSPACE}"

      - name: Recheck exact candidate identity across runner boundary
        shell: bash
        env:
          EXPECTED_TAG: ${{ needs.build-rc.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.build-rc.outputs.version }}
          EXPECTED_SHA: ${{ needs.build-rc.outputs.sha }}
          EXPECTED_SOURCE_DATE_EPOCH: ${{ needs.build-rc.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync("release-output/release-metadata.json", "utf8"));
          const expected = {
            release_tag: process.env.EXPECTED_TAG,
            release_version: process.env.EXPECTED_VERSION,
            git_sha: process.env.EXPECTED_SHA,
            source_date_epoch: Number(process.env.EXPECTED_SOURCE_DATE_EPOCH),
          };
          for (const [field, value] of Object.entries(expected)) {
            if (metadata[field] !== value) throw new Error(`candidate ${field} mismatch: ${metadata[field]} != ${value}`);
          }
          NODE
          actual="$(sha256sum release-output/release-metadata.json release-output/release-inventory.json | sha256sum | awk '{print $1}')"
          [[ "${actual}" == "${AIDR_E2E_RC_DIGEST}" ]] || {
            echo "Candidate identity or inventory changed across runner boundary." >&2
            exit 1
          }
          mapfile -t vsix_paths < <(find release-output -maxdepth 1 -type f -name '*.vsix' -print)
          cursor_vsix_path="release-output/aidr-cursor.vsix"
          vscode_vsix_path="release-output/aidr-vscode.vsix"
          [[ "${#vsix_paths[@]}" -eq 2 && -f "${cursor_vsix_path}" && -f "${vscode_vsix_path}" ]] || {
            echo "Exact candidate must contain only aidr-cursor.vsix and aidr-vscode.vsix." >&2
            exit 1
          }
          cursor_vsix_sha256="$(sha256sum "${cursor_vsix_path}" | awk '{print $1}')"
          vscode_vsix_sha256="$(sha256sum "${vscode_vsix_path}" | awk '{print $1}')"
          CURSOR_VSIX_SHA256="${cursor_vsix_sha256}" VSCODE_VSIX_SHA256="${vscode_vsix_sha256}" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const inventory = JSON.parse(readFileSync("release-output/release-inventory.json", "utf8"));
          const expected = new Map([
            ["aidr-cursor.vsix", process.env.CURSOR_VSIX_SHA256],
            ["aidr-vscode.vsix", process.env.VSCODE_VSIX_SHA256],
          ]);
          for (const [name, sha256] of expected) {
            const entry = inventory.artifacts?.find((item) => item.staged_path === name);
            if (!entry || entry.sha256 !== sha256) throw new Error(`${name} digest does not match the exact-candidate inventory`);
          }
          NODE
          {
            echo "AIDR_E2E_CURSOR_VSIX_PATH=${GITHUB_WORKSPACE}/${cursor_vsix_path}"
            echo "AIDR_E2E_CURSOR_VSIX_SHA256=${cursor_vsix_sha256}"
            echo "AIDR_E2E_VSCODE_VSIX_PATH=${GITHUB_WORKSPACE}/${vscode_vsix_path}"
            echo "AIDR_E2E_VSCODE_VSIX_SHA256=${vscode_vsix_sha256}"
          } >> "${GITHUB_ENV}"

      - name: Reverify signed packages on acceptance runner
        shell: bash
        env:
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
          SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_PUBLIC_KEY}" && -n "${SIGNING_PUBLIC_KEY_FINGERPRINT}" ]] || {
            echo "Package public key and fingerprint are required." >&2
            exit 1
          }
          public_path="${RUNNER_TEMP}/aidr-package-public.pem"
          cleanup() { rm -f "${public_path}"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "${SIGNING_PUBLIC_KEY}" > "${public_path}"
          unset SIGNING_PUBLIC_KEY
          node scripts/verify-release-evidence.mjs \
            --public-key "${public_path}" \
            --fingerprint "${SIGNING_PUBLIC_KEY_FINGERPRINT}" \
            --dirs \
              packages/core/dist packages/claude-code/dist packages/extension/dist \
              packages/openclaw/dist packages/opencode/dist packages/cli/dist \
              packages/sdk/dist packages/dashboard/dist packages/codex/dist packages/mcp-gateway/dist packages/privacy/dist \
              packages/claude-code
          cleanup
          trap - EXIT

      - name: Candidate-bound isolated control-plane acceptance
        shell: bash
        env:
          AIDR_ACCEPTANCE_DEPLOYMENT_DIR: ${{ vars.AIDR_ACCEPTANCE_DEPLOYMENT_DIR }}
        run: |
          set -euo pipefail
          node scripts/deployment-smoke.mjs "${AIDR_ACCEPTANCE_DEPLOYMENT_DIR}" --candidate-inventory release-output/release-inventory.json

      - name: Upload candidate-bound control-plane receipt (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-control-plane-${{ needs.build-rc.outputs.tag }}
          path: ${{ vars.AIDR_ACCEPTANCE_DEPLOYMENT_DIR }}/smoke-evidence-${{ needs.assemble-e2e.outputs.candidate_digest }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stage post-candidate external evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${GITHUB_WORKSPACE}/.e2e-artifacts/external"
          evidence_input_dir="${RUNNER_TEMP}/post-candidate-evidence"
          mkdir -p "${evidence_dir}"
          cp "${evidence_input_dir}/aig-live-control-plane.json" "${evidence_dir}/aig-live-control-plane.json"
          cp "${evidence_input_dir}/aig-live-control-plane.json.sig" "${evidence_dir}/aig-live-control-plane.json.sig"
          cp "${evidence_input_dir}/supabase-live-control-plane.json" "${evidence_dir}/supabase-live-control-plane.json"
          cp "${evidence_input_dir}/supabase-live-control-plane.json.sig" "${evidence_dir}/supabase-live-control-plane.json.sig"
          cp "${evidence_input_dir}/dashboard-browser.json" "${evidence_dir}/dashboard-browser.json"
          cp "${evidence_input_dir}/dashboard-browser.json.sig" "${evidence_dir}/dashboard-browser.json.sig"
          cp "${evidence_input_dir}/openclaw-host.json" "${evidence_dir}/openclaw-host.json"
          cp "${evidence_input_dir}/openclaw-host.json.sig" "${evidence_dir}/openclaw-host.json.sig"
          {
            echo "AIDR_AIG_E2E_EVIDENCE=${evidence_dir}/aig-live-control-plane.json"
            echo "AIDR_AIG_E2E_EVIDENCE_SIGNATURE=${evidence_dir}/aig-live-control-plane.json.sig"
            echo "AIDR_SUPABASE_E2E_EVIDENCE=${evidence_dir}/supabase-live-control-plane.json"
            echo "AIDR_SUPABASE_E2E_EVIDENCE_SIGNATURE=${evidence_dir}/supabase-live-control-plane.json.sig"
            echo "AIDR_DASHBOARD_BROWSER_EVIDENCE=${evidence_dir}/dashboard-browser.json"
            echo "AIDR_DASHBOARD_BROWSER_EVIDENCE_SIGNATURE=${evidence_dir}/dashboard-browser.json.sig"
            echo "AIDR_OPENCLAW_HOST_EVIDENCE=${evidence_dir}/openclaw-host.json"
            echo "AIDR_OPENCLAW_HOST_EVIDENCE_SIGNATURE=${evidence_dir}/openclaw-host.json.sig"
            echo "AIDR_OPENCLAW_HOST_EVIDENCE_PUBLIC_KEY_PATH=${evidence_input_dir}/openclaw-host-public.pem"
            echo "AIDR_EXTERNAL_E2E_EVIDENCE_PUBLIC_KEY_PATH=${evidence_input_dir}/external-e2e-public.pem"
          } >> "${GITHUB_ENV}"

      - name: Real-host connector E2E gate
        env:
          AIDR_E2E_REQUIRE_REAL: "1"
          AIDR_E2E_ENABLE_IDE_HOST: "1"
          AIDR_CURSOR_PATH: ${{ vars.AIDR_CURSOR_PATH }}
          AIDR_VSCODE_PATH: ${{ vars.AIDR_VSCODE_PATH }}
          AIDR_AGENT_PATH: ${{ vars.AIDR_AGENT_PATH }}
          AIDR_CODEX_PATH: ${{ vars.AIDR_CODEX_PATH }}
          AIDR_CODEX_CREDENTIALS: ${{ vars.AIDR_CODEX_CREDENTIALS }}
          AIDR_AIG_PYTHON: ${{ vars.AIDR_AIG_PYTHON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          OPENCLAW_E2E_HOST: ${{ vars.OPENCLAW_E2E_HOST }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHBOARD_SMOKE_BASE_URL: ${{ vars.DASHBOARD_SMOKE_BASE_URL }}
        run: |
          set -euo pipefail
          pnpm test:e2e
          pnpm test:e2e:negative

      - name: Clean-source and diff gate after acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/lib/release-source-clean.mjs

  final-sign-publish:
    name: Canonically sign, attest and publish RC
    needs: [build-rc, assemble-e2e, acceptance-e2e, acceptance-windows-native, installers-linux, installers-windows, installers-sea-sign]
    runs-on: ubuntu-22.04
    environment: release-candidate
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      AIDR_GIT_SHA: ${{ needs.build-rc.outputs.sha }}
    steps:
      - name: Checkout immutable RC signing code (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download exact unsigned outer bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-exact-candidate-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/exact-candidate

      - name: Restore and recheck exact candidate
        shell: bash
        env:
          EXPECTED_TAG: ${{ needs.build-rc.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.build-rc.outputs.version }}
          EXPECTED_SHA: ${{ needs.build-rc.outputs.sha }}
          EXPECTED_SOURCE_DATE_EPOCH: ${{ needs.build-rc.outputs.source_date_epoch }}
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.assemble-e2e.outputs.candidate_digest }}
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/exact-candidate/exact-release-candidate.tgz" -C "${GITHUB_WORKSPACE}"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync("release-output/release-metadata.json", "utf8"));
          const expected = {
            release_tag: process.env.EXPECTED_TAG,
            release_version: process.env.EXPECTED_VERSION,
            git_sha: process.env.EXPECTED_SHA,
            source_date_epoch: Number(process.env.EXPECTED_SOURCE_DATE_EPOCH),
          };
          for (const [field, value] of Object.entries(expected)) {
            if (metadata[field] !== value) throw new Error(`candidate ${field} mismatch: ${metadata[field]} != ${value}`);
          }
          NODE
          actual="$(sha256sum release-output/release-metadata.json release-output/release-inventory.json | sha256sum | awk '{print $1}')"
          [[ "${actual}" == "${EXPECTED_CANDIDATE_DIGEST}" ]] || {
            echo "Candidate identity or inventory changed across runner boundary." >&2
            exit 1
          }

      - name: Canonically sign and independently verify exact bundle
        shell: bash
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.AIDR_SIGNING_PRIVATE_KEY_PEM }}
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
          SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT }}
          SIGNER_POLICY_JSON: ${{ secrets.AIDR_RELEASE_SIGNER_POLICY_JSON }}
          RELEASE_SEQUENCE: ${{ vars.AIDR_RELEASE_SEQUENCE }}
          SIGNATURE_LIFETIME_SECONDS: ${{ vars.AIDR_RELEASE_SIGNATURE_LIFETIME_SECONDS }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_PRIVATE_KEY}" && -n "${SIGNING_PUBLIC_KEY}" && -n "${SIGNING_PUBLIC_KEY_FINGERPRINT}" && -n "${SIGNER_POLICY_JSON}" ]] || {
            echo "Release private key, independently distributed public key, fingerprint and signer policy are required." >&2
            exit 1
          }
          [[ "${RELEASE_SEQUENCE}" =~ ^[1-9][0-9]*$ ]] || { echo "AIDR_RELEASE_SEQUENCE must be a positive integer." >&2; exit 1; }
          [[ "${SIGNATURE_LIFETIME_SECONDS}" =~ ^[1-9][0-9]*$ ]] || { echo "AIDR_RELEASE_SIGNATURE_LIFETIME_SECONDS must be a positive integer." >&2; exit 1; }
          mapfile -t signing_times < <(SIGNATURE_LIFETIME_SECONDS="${SIGNATURE_LIFETIME_SECONDS}" node --input-type=module <<'NODE'
          const issued = new Date();
          const expires = new Date(issued.getTime() + Number(process.env.SIGNATURE_LIFETIME_SECONDS) * 1000);
          console.log(issued.toISOString());
          console.log(expires.toISOString());
          NODE
          )
          issued_at="${signing_times[0]}"
          expires_at="${signing_times[1]}"
          private_path="${RUNNER_TEMP}/aidr-release-private.pem"
          public_path="${RUNNER_TEMP}/aidr-release-public.pem"
          policy_path="${RUNNER_TEMP}/aidr-release-signer-policy.json"
          state_path="${RUNNER_TEMP}/aidr-release-verification-state.json"
          cleanup() { rm -f "${private_path}" "${public_path}" "${policy_path}" "${state_path}" "${state_path}.lock"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "${SIGNING_PRIVATE_KEY}" > "${private_path}"
          printf '%s\n' "${SIGNING_PUBLIC_KEY}" > "${public_path}"
          printf '%s\n' "${SIGNER_POLICY_JSON}" > "${policy_path}"
          unset SIGNING_PRIVATE_KEY SIGNING_PUBLIC_KEY SIGNER_POLICY_JSON
          node --input-type=module - "${private_path}" "${public_path}" "${SIGNING_PUBLIC_KEY_FINGERPRINT}" <<'NODE'
          import { createHash, createPrivateKey, createPublicKey } from "node:crypto";
          import { readFileSync } from "node:fs";
          const privateKey = createPrivateKey(readFileSync(process.argv[2], "utf8"));
          const suppliedPublic = createPublicKey(readFileSync(process.argv[3], "utf8"));
          const derivedPublic = createPublicKey(privateKey);
          if (privateKey.asymmetricKeyType !== "ed25519" || suppliedPublic.asymmetricKeyType !== "ed25519") throw new Error("Release signing keys must be Ed25519");
          const suppliedDer = suppliedPublic.export({ type: "spki", format: "der" });
          if (!suppliedDer.equals(derivedPublic.export({ type: "spki", format: "der" }))) throw new Error("Release private/public key mismatch");
          const expected = process.argv[4].toLowerCase().replace(/^sha256:/, "");
          const actual = createHash("sha256").update(suppliedDer).digest("hex");
          if (!/^[0-9a-f]{64}$/.test(expected) || actual !== expected) throw new Error(`Release public-key fingerprint mismatch: ${actual}`);
          NODE
          node scripts/release-sign.mjs \
            --bundle release-output \
            --private-key "${private_path}" \
            --key-id "${AIDR_SIGNING_KEY_ID}" \
            --sequence "${RELEASE_SEQUENCE}" \
            --issued-at "${issued_at}" \
            --expires-at "${expires_at}" \
            --channel stable
          rm -f "${private_path}"
          node scripts/release-verify.mjs \
            --bundle release-output \
            --policy "${policy_path}" \
            --state "${state_path}"
          cleanup
          trap - EXIT

      - name: Attest the exact release bundle (pinned)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-output/*

      - name: Upload immutable RC evidence (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-release-${{ needs.build-rc.outputs.tag }}
          path: release-output/
          if-no-files-found: error
          retention-days: 90

      - name: Download Linux installers (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-installers-linux-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/installers/linux

      - name: Download Windows installer (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-installers-windows-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/installers/windows

      - name: Recheck installer checksums across runner boundary
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux windows; do
            (cd "${RUNNER_TEMP}/installers/${platform}" && sha256sum --check --strict SHA256SUMS)
          done
          if ls "${RUNNER_TEMP}"/installers/*/*UNSIGNED* >/dev/null 2>&1; then
            echo "An unsigned installer reached the release job." >&2
            exit 1
          fi

      # The release-key-signed SEA bundles the installers were built from. A
      # per-customer installer (customer-installer.yml) is rebuilt from these
      # release assets, so they are published and attested with the installers.
      - name: Download signed SEA bundles (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-sea-signed-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/installers/sea

      - name: Recheck signed SEA bundles across runner boundary
        shell: bash
        env:
          EXPECTED_LINUX_SHA256: ${{ needs.installers-sea-sign.outputs.linux_sha256 }}
          EXPECTED_WINDOWS_SHA256: ${{ needs.installers-sea-sign.outputs.windows_sha256 }}
        run: |
          set -euo pipefail
          echo "${EXPECTED_LINUX_SHA256}  ${RUNNER_TEMP}/installers/sea/aidr-sea-linux-signed.tgz" | sha256sum --check --strict
          echo "${EXPECTED_WINDOWS_SHA256}  ${RUNNER_TEMP}/installers/sea/aidr-sea-windows-signed.tgz" | sha256sum --check --strict

      - name: Attest the desktop installers (pinned)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/installers/linux/*.deb
            ${{ runner.temp }}/installers/linux/*.rpm
            ${{ runner.temp }}/installers/linux/*.tar.gz
            ${{ runner.temp }}/installers/windows/*.msi
            ${{ runner.temp }}/installers/sea/*.tgz

      - name: Publish draft prerelease evidence (pinned)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build-rc.outputs.tag }}
          name: AIDR ${{ needs.build-rc.outputs.tag }}
          prerelease: true
          draft: true
          generate_release_notes: false
          files: |
            release-output/*
            ${{ runner.temp }}/installers/linux/*
            ${{ runner.temp }}/installers/windows/*
            ${{ runner.temp }}/installers/sea/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Desktop installers (deploy/installers) ────────────────────────────────
  # The installers ship the RELEASE-flavour multi-call SEA bundle. Build jobs
  # run the RC code and hold no signing key; installers-sea-sign holds only the
  # release Ed25519 key (no dependency install) and signs both bundle manifests
  # between the bundle build and packaging; packaging and the GPG/Authenticode
  # jobs consume only hash-bound, signed bundles.

  installers-linux-sea:
    name: Build the unsigned release-flavour Linux SEA bundle
    needs: build-rc
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-candidate
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.linux_sea.outputs.archive_sha256 }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-rc.outputs.source_date_epoch }}
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen dependency install (no lifecycle mutation)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the release-flavour SEA bundle from the verified commit
        id: linux_sea
        shell: bash
        run: |
          set -euo pipefail
          for package in @singularityrd/aidr-core @singularityrd/aidr-cli @singularityrd/aidr-claude-code @singularityrd/aidr-codex; do
            pnpm --filter "${package}" build:release
          done
          node packages/claude-code/scripts/build-sea.mjs --prebuilt --flavor release --out "${RUNNER_TEMP}/aidr-sea"
          archive="${RUNNER_TEMP}/aidr-sea-linux-unsigned.tgz"
          tar -C "${RUNNER_TEMP}/aidr-sea" -czf "${archive}" .
          echo "archive_sha256=$(sha256sum "${archive}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Upload unsigned Linux SEA bundle (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-sea-linux-unsigned-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/aidr-sea-linux-unsigned.tgz
          if-no-files-found: error
          retention-days: 7

  installers-windows-build:
    name: Build the unsigned release-flavour Windows SEA bundle
    needs: build-rc
    runs-on: windows-2022
    timeout-minutes: 45
    environment: release-candidate
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.windows_sea.outputs.archive_sha256 }}
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen dependency install (no lifecycle mutation)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the release-flavour SEA bundle from the verified commit
        id: windows_sea
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($package in @("@singularityrd/aidr-core", "@singularityrd/aidr-cli", "@singularityrd/aidr-claude-code", "@singularityrd/aidr-codex")) {
            pnpm --filter $package build:release
            if ($LASTEXITCODE -ne 0) { throw "$package release build failed" }
          }
          $sea = Join-Path $env:RUNNER_TEMP "aidr-sea"
          node packages/claude-code/scripts/build-sea.mjs --prebuilt --flavor release --out $sea
          if ($LASTEXITCODE -ne 0) { throw "SEA build failed" }
          $archive = Join-Path $env:RUNNER_TEMP "aidr-sea-windows-unsigned.tgz"
          & tar -czf $archive -C $sea .
          if ($LASTEXITCODE -ne 0) { throw "SEA archiving failed" }
          "archive_sha256=$((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned Windows SEA bundle (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-sea-windows-unsigned-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/aidr-sea-windows-unsigned.tgz
          if-no-files-found: error
          retention-days: 7

  installers-sea-sign:
    name: Add the editor VSIXs and sign the SEA bundles with the release key
    needs: [build-rc, assemble-e2e, installers-linux-sea, installers-windows-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-candidate
    permissions:
      contents: read
    outputs:
      linux_sha256: ${{ steps.sea_sign.outputs.linux_sha256 }}
      windows_sha256: ${{ steps.sea_sign.outputs.windows_sha256 }}
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download unsigned Linux SEA bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-sea-linux-unsigned-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/sea-unsigned

      - name: Download unsigned Windows SEA bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-sea-windows-unsigned-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/sea-unsigned

      - name: Download exact unsigned outer bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-exact-candidate-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/exact-candidate

      - name: Add the candidate VSIXs and sign both bundles fail-closed
        id: sea_sign
        shell: bash
        env:
          EXPECTED_LINUX_SHA256: ${{ needs.installers-linux-sea.outputs.archive_sha256 }}
          EXPECTED_WINDOWS_SHA256: ${{ needs.installers-windows-build.outputs.archive_sha256 }}
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.assemble-e2e.outputs.candidate_digest }}
          SIGNING_PRIVATE_KEY: ${{ secrets.AIDR_SIGNING_PRIVATE_KEY_PEM }}
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
          SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_PRIVATE_KEY}" && -n "${SIGNING_PUBLIC_KEY}" && -n "${SIGNING_PUBLIC_KEY_FINGERPRINT}" ]] || {
            echo "The release signing key, its public key and fingerprint are required; no unsigned SEA bundle is packaged." >&2
            exit 1
          }
          echo "${EXPECTED_LINUX_SHA256}  ${RUNNER_TEMP}/sea-unsigned/aidr-sea-linux-unsigned.tgz" | sha256sum --check --strict
          echo "${EXPECTED_WINDOWS_SHA256}  ${RUNNER_TEMP}/sea-unsigned/aidr-sea-windows-unsigned.tgz" | sha256sum --check --strict
          candidate="${RUNNER_TEMP}/candidate"
          mkdir -p "${candidate}"
          tar -xzf "${RUNNER_TEMP}/exact-candidate/exact-release-candidate.tgz" -C "${candidate}"
          actual="$(cd "${candidate}" && sha256sum release-output/release-metadata.json release-output/release-inventory.json | sha256sum | awk '{print $1}')"
          [[ "${actual}" == "${EXPECTED_CANDIDATE_DIGEST}" ]] || { echo "Candidate identity changed across runner boundary." >&2; exit 1; }
          # Each VSIX must be the exact candidate artifact the inventory records.
          node --input-type=module - "${candidate}/release-output" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const dir = process.argv[2];
          const recorded = new Map(JSON.parse(readFileSync(join(dir, "release-metadata.json"), "utf8")).artifacts.map((entry) => [entry.path, entry.sha256]));
          for (const name of ["aidr-cursor.vsix", "aidr-vscode.vsix"]) {
            const actual = createHash("sha256").update(readFileSync(join(dir, name))).digest("hex");
            if (recorded.get(name) !== actual) throw new Error(`${name} is not the recorded candidate artifact`);
          }
          NODE
          private_path="${RUNNER_TEMP}/aidr-sea-private.pem"
          public_path="${RUNNER_TEMP}/aidr-sea-public.pem"
          cleanup() { rm -f "${private_path}" "${public_path}"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "${SIGNING_PRIVATE_KEY}" > "${private_path}"
          printf '%s\n' "${SIGNING_PUBLIC_KEY}" > "${public_path}"
          unset SIGNING_PRIVATE_KEY SIGNING_PUBLIC_KEY
          umask 022
          for platform in linux windows; do
            sea="${RUNNER_TEMP}/aidr-sea-${platform}"
            mkdir -p "${sea}"
            tar -xzf "${RUNNER_TEMP}/sea-unsigned/aidr-sea-${platform}-unsigned.tgz" -C "${sea}"
            node packages/claude-code/scripts/build-sea.mjs --add-extensions "${sea}" \
              --vsix "${candidate}/release-output/aidr-cursor.vsix" --vsix "${candidate}/release-output/aidr-vscode.vsix"
            node packages/claude-code/scripts/build-sea.mjs --sign "${sea}" --key "${private_path}" --public-key "${public_path}" \
              | tee "${RUNNER_TEMP}/sign-${platform}.log"
            fingerprint="${SIGNING_PUBLIC_KEY_FINGERPRINT,,}"
            grep -q "sha256:${fingerprint#sha256:}" "${RUNNER_TEMP}/sign-${platform}.log" || {
              echo "The release key does not match its pinned fingerprint." >&2
              exit 1
            }
            archive="${RUNNER_TEMP}/aidr-sea-${platform}-signed.tgz"
            tar -C "${sea}" -czf "${archive}" .
            echo "${platform}_sha256=$(sha256sum "${archive}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          done
          rm -f "${private_path}"
          # The Linux bundle runs here: verify it end to end with the public key only.
          node packages/claude-code/scripts/build-sea.mjs --verify "${RUNNER_TEMP}/aidr-sea-linux" --public-key "${public_path}"
          cleanup
          trap - EXIT

      - name: Upload signed SEA bundles (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-sea-signed-${{ needs.build-rc.outputs.tag }}
          path: |
            ${{ runner.temp }}/aidr-sea-linux-signed.tgz
            ${{ runner.temp }}/aidr-sea-windows-signed.tgz
          if-no-files-found: error
          retention-days: 7

  installers-linux-build:
    name: Build unsigned Linux desktop installers
    needs: [build-rc, installers-sea-sign]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-candidate
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.linux_unsigned.outputs.archive_sha256 }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-rc.outputs.source_date_epoch }}
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen dependency install (no lifecycle mutation)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download signed SEA bundles (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-sea-signed-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/sea-signed

      - name: Installer builder contract tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm
          node --test deploy/installers/installers.test.mjs

      - name: Build Linux packages with the pinned release trust key
        id: linux_unsigned
        shell: bash
        env:
          EXPECTED_SEA_SHA256: ${{ needs.installers-sea-sign.outputs.linux_sha256 }}
          # Optional: the public key `aidr update` verifies the installer catalog with.
          CATALOG_PUBLIC_KEY: ${{ vars.AIDR_INSTALLER_MANIFEST_PUBLIC_KEY_PEM || secrets.AIDR_INSTALLER_MANIFEST_PUBLIC_KEY_PEM }}
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
          SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT }}
          RC_VERSION: ${{ needs.build-rc.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_PUBLIC_KEY}" && -n "${SIGNING_PUBLIC_KEY_FINGERPRINT}" ]] || {
            echo "The release trust public key and its fingerprint are required to build installers." >&2
            exit 1
          }
          echo "${EXPECTED_SEA_SHA256}  ${RUNNER_TEMP}/sea-signed/aidr-sea-linux-signed.tgz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/aidr-sea"
          tar -xzf "${RUNNER_TEMP}/sea-signed/aidr-sea-linux-signed.tgz" -C "${RUNNER_TEMP}/aidr-sea"
          printf '%s\n' "${SIGNING_PUBLIC_KEY}" > "${RUNNER_TEMP}/release-public.pem"
          # Relocated canary with the release key: allows ls, denies the canary, blocks everything without the key.
          node packages/claude-code/scripts/build-sea.mjs --verify "${RUNNER_TEMP}/aidr-sea" --public-key "${RUNNER_TEMP}/release-public.pem"
          out="${RUNNER_TEMP}/installers-linux"
          catalog_args=()
          if [[ -n "${CATALOG_PUBLIC_KEY}" ]]; then
            printf '%s\n' "${CATALOG_PUBLIC_KEY}" > "${RUNNER_TEMP}/installer-catalog-public.pem"
            catalog_args=(--catalog-key "${RUNNER_TEMP}/installer-catalog-public.pem")
          fi
          node deploy/installers/linux/build-linux-packages.mjs \
            --sea-dir "${RUNNER_TEMP}/aidr-sea" \
            --trust-key "${RUNNER_TEMP}/release-public.pem" \
            --trust-key-fingerprint "${SIGNING_PUBLIC_KEY_FINGERPRINT}" \
            --version "${RC_VERSION}" \
            --out "${out}" \
            --formats deb,rpm,tar \
            "${catalog_args[@]}"
          cp "${RUNNER_TEMP}/aidr-sea/aidr-artifact.manifest.json" "${out}/sea-manifest-linux-x64.json"
          archive="${RUNNER_TEMP}/installers-linux-unsigned.tgz"
          tar -C "${out}" -czf "${archive}" .
          echo "archive_sha256=$(sha256sum "${archive}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Upload unsigned Linux installers (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-installers-linux-unsigned-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/installers-linux-unsigned.tgz
          if-no-files-found: error
          retention-days: 7

  installers-linux:
    name: Sign Linux desktop installers
    needs: [build-rc, installers-linux-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-candidate
    permissions:
      contents: read
    steps:
      - name: Download unsigned Linux installers (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-installers-linux-unsigned-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/linux-unsigned

      - name: Sign Linux packages with ephemeral GPG custody
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.installers-linux-build.outputs.archive_sha256 }}
          LINUX_PACKAGE_GPG_PRIVATE_KEY: ${{ secrets.AIDR_LINUX_PACKAGE_GPG_PRIVATE_KEY }}
          LINUX_PACKAGE_GPG_PASSPHRASE: ${{ secrets.AIDR_LINUX_PACKAGE_GPG_PASSPHRASE }}
          LINUX_PACKAGE_GPG_FINGERPRINT: ${{ secrets.AIDR_LINUX_PACKAGE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ -n "${LINUX_PACKAGE_GPG_PRIVATE_KEY}" && -n "${LINUX_PACKAGE_GPG_PASSPHRASE}" && "${LINUX_PACKAGE_GPG_FINGERPRINT}" =~ ^[0-9A-F]{40}$ ]] || {
            echo "Linux package signing key, passphrase and 40-hex fingerprint are required; no unsigned package is published." >&2
            exit 1
          }
          archive="${RUNNER_TEMP}/linux-unsigned/installers-linux-unsigned.tgz"
          echo "${EXPECTED_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          out="${RUNNER_TEMP}/installers-linux"
          mkdir -p "${out}"
          tar -xzf "${archive}" -C "${out}"
          rm -f "${out}/SHA256SUMS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm
          export GNUPGHOME="$(mktemp -d)"
          cleanup() { gpgconf --kill gpg-agent || true; rm -rf "${GNUPGHOME}"; }
          trap cleanup EXIT
          printf '%s\n' "${LINUX_PACKAGE_GPG_PRIVATE_KEY}" | gpg --batch --import
          unset LINUX_PACKAGE_GPG_PRIVATE_KEY
          gpg --batch --list-secret-keys --with-colons | grep -q "^fpr:::::::::${LINUX_PACKAGE_GPG_FINGERPRINT}:" || {
            echo "Imported key does not match the pinned fingerprint." >&2
            exit 1
          }
          passfile="${GNUPGHOME}/passphrase"
          printf '%s' "${LINUX_PACKAGE_GPG_PASSPHRASE}" > "${passfile}"
          unset LINUX_PACKAGE_GPG_PASSPHRASE
          cd "${out}"
          rpm --define "_gpg_name ${LINUX_PACKAGE_GPG_FINGERPRINT}" \
            --define "__gpg_sign_cmd %{__gpg} gpg --batch --pinentry-mode loopback --passphrase-file ${passfile} --no-armor -u %{_gpg_name} -sbo %{__signature_filename} %{__plaintext_filename}" \
            --addsign ./*.rpm
          gpg --batch --armor --export "${LINUX_PACKAGE_GPG_FINGERPRINT}" > linux-package-signing-key.asc
          rpmdb="$(mktemp -d)"
          rpmkeys --dbpath "${rpmdb}" --import linux-package-signing-key.asc
          rpmkeys --dbpath "${rpmdb}" --checksig ./*.rpm
          rm -rf "${rpmdb}"
          # rpm signing changed the .rpm bytes: the checksums are taken afterwards.
          sha256sum ./*.deb ./*.rpm ./*.tar.gz | sed 's#  \./#  #' > SHA256SUMS
          for file in ./*.deb ./*.tar.gz SHA256SUMS; do
            gpg --batch --pinentry-mode loopback --passphrase-file "${passfile}" -u "${LINUX_PACKAGE_GPG_FINGERPRINT}" --armor --detach-sign --output "${file}.asc" "${file}"
            gpg --batch --verify "${file}.asc" "${file}"
          done
          sha256sum --check --strict SHA256SUMS

      - name: Upload Linux installers (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-installers-linux-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/installers-linux/
          if-no-files-found: error
          retention-days: 90

  installers-windows:
    name: Build and Authenticode-sign the Windows MSI
    needs: [build-rc, installers-sea-sign]
    runs-on: windows-2022
    timeout-minutes: 45
    environment: release-candidate
    permissions:
      contents: read
      # Only for the azure-key-vault / jsign AZUREKEYVAULT signer (GitHub OIDC -> Azure token).
      id-token: write
    steps:
      - name: Checkout immutable RC commit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-rc.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX install failed" }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX UI extension install failed" }

      - name: Download signed SEA bundles (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-sea-signed-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/sea-signed

      - name: Build and Authenticode-sign the MSI with ephemeral runner certificate custody
        shell: pwsh
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.installers-sea-sign.outputs.windows_sha256 }}
          # Signer backend (scripts/windows-authenticode-signer.ps1, docs/operations/windows-code-signing.md):
          # pfx (ephemeral PFX custody, local tests), azure-key-vault (AzureSignTool) or jsign (cloud HSM / token).
          AIDR_WINDOWS_SIGNER: ${{ vars.AIDR_WINDOWS_SIGNER || 'pfx' }}
          AIDR_AZURE_KEY_VAULT_URL: ${{ vars.AIDR_AZURE_KEY_VAULT_URL }}
          AIDR_AZURE_KEY_VAULT_CERTIFICATE: ${{ vars.AIDR_AZURE_KEY_VAULT_CERTIFICATE }}
          AIDR_AZURE_TENANT_ID: ${{ vars.AIDR_AZURE_TENANT_ID }}
          AIDR_AZURE_CLIENT_ID: ${{ vars.AIDR_AZURE_CLIENT_ID }}
          AIDR_JSIGN_STORETYPE: ${{ vars.AIDR_JSIGN_STORETYPE }}
          AIDR_JSIGN_KEYSTORE: ${{ vars.AIDR_JSIGN_KEYSTORE }}
          AIDR_JSIGN_ALIAS: ${{ vars.AIDR_JSIGN_ALIAS }}
          AIDR_JSIGN_CERTCHAIN_PEM: ${{ vars.AIDR_JSIGN_CERTCHAIN_PEM }}
          AIDR_JSIGN_STOREPASS: ${{ (vars.AIDR_WINDOWS_SIGNER || 'pfx') == 'jsign' && secrets.AIDR_JSIGN_STOREPASS || '' }}
          WINDOWS_CODE_SIGNING_PFX_B64: ${{ (vars.AIDR_WINDOWS_SIGNER || 'pfx') == 'pfx' && secrets.AIDR_WINDOWS_CODE_SIGNING_PFX_B64 || '' }}
          WINDOWS_CODE_SIGNING_PFX_PASSWORD: ${{ (vars.AIDR_WINDOWS_SIGNER || 'pfx') == 'pfx' && secrets.AIDR_WINDOWS_CODE_SIGNING_PFX_PASSWORD || '' }}
          WINDOWS_CODE_SIGNING_THUMBPRINT: ${{ secrets.AIDR_WINDOWS_CODE_SIGNING_THUMBPRINT }}
          WINDOWS_TIMESTAMP_SERVER: ${{ vars.AIDR_WINDOWS_TIMESTAMP_SERVER }}
          SIGNING_PUBLIC_KEY: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_PEM }}
          SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ secrets.AIDR_SIGNING_PUBLIC_KEY_FINGERPRINT }}
          CATALOG_PUBLIC_KEY: ${{ vars.AIDR_INSTALLER_MANIFEST_PUBLIC_KEY_PEM || secrets.AIDR_INSTALLER_MANIFEST_PUBLIC_KEY_PEM }}
          RC_VERSION: ${{ needs.build-rc.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/windows-authenticode-signer.ps1
          $signer = Resolve-AidrAuthenticodeSigner $env:AIDR_WINDOWS_SIGNER
          if ($signer -eq 'pfx') {
            if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "PFX import requires an ephemeral GitHub-hosted runner" }
          } elseif (-not [string]::IsNullOrWhiteSpace($env:AIDR_JSIGN_CERTCHAIN_PEM)) {
            # The public certificate chain some jsign store types need (--certfile).
            $env:AIDR_JSIGN_CERTFILE = Join-Path $env:RUNNER_TEMP 'aidr-jsign-chain.pem'
            [System.IO.File]::WriteAllText($env:AIDR_JSIGN_CERTFILE, $env:AIDR_JSIGN_CERTCHAIN_PEM)
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PUBLIC_KEY) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PUBLIC_KEY_FINGERPRINT)) { throw "The release trust public key and its fingerprint are required to build installers" }
          $thumbprint = $env:WINDOWS_CODE_SIGNING_THUMBPRINT
          $timestamp = $env:WINDOWS_TIMESTAMP_SERVER
          if ($thumbprint -cnotmatch '^[0-9A-F]{40}$') { throw "The independently pinned Windows signing thumbprint is required; no unsigned MSI is published" }
          if ($signer -eq 'pfx' -and ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_PASSWORD))) { throw "Protected Windows signing certificate, password and thumbprint are required; no unsigned MSI is published" }
          $timestampUri = $null
          if (-not [Uri]::TryCreate($timestamp, [UriKind]::Absolute, [ref]$timestampUri) -or $timestampUri.Scheme -cne 'https' -or $timestampUri.UserInfo -or $timestampUri.Query -or $timestampUri.Fragment) { throw "An approved protected HTTPS timestamp server is required" }
          $archive = Join-Path $env:RUNNER_TEMP "sea-signed/aidr-sea-windows-signed.tgz"
          if ($env:EXPECTED_ARCHIVE_SHA256 -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_ARCHIVE_SHA256) { throw "Signed SEA archive hash mismatch" }
          $sea = Join-Path $env:RUNNER_TEMP "aidr-sea"
          New-Item -ItemType Directory -Path $sea | Out-Null
          & tar -xzf $archive -C $sea
          if ($LASTEXITCODE -ne 0) { throw "SEA extraction failed" }
          $trustKey = Join-Path $env:RUNNER_TEMP "release-public.pem"
          Set-Content -LiteralPath $trustKey -Value $env:SIGNING_PUBLIC_KEY -NoNewline
          $catalogKey = ''
          if (-not [string]::IsNullOrWhiteSpace($env:CATALOG_PUBLIC_KEY)) {
            $catalogKey = Join-Path $env:RUNNER_TEMP "installer-catalog-public.pem"
            Set-Content -LiteralPath $catalogKey -Value $env:CATALOG_PUBLIC_KEY -NoNewline
          }
          $out = Join-Path $env:RUNNER_TEMP "installers-windows"
          $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
          if (Test-Path -LiteralPath $certificatePath) { throw "Signing certificate already exists; refusing to replace runner custody" }
          $privateDirectory = Join-Path $env:RUNNER_TEMP "aidr-msi-signing-private"
          $pfxPath = Join-Path $privateDirectory "publisher.pfx"
          $imported = $false
          $collection = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          try {
            if ($signer -eq 'pfx') {
            New-Item -ItemType Directory -Path $privateDirectory -ErrorAction Stop | Out-Null
            $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            $acl.SetAccessRuleProtection($true, $false)
            $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
            $acl.SetOwner($sid)
            foreach ($identity in @($sid, [System.Security.Principal.SecurityIdentifier]::new('S-1-5-18'), [System.Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'))) {
              $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($identity, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
            }
            Set-Acl -LiteralPath $privateDirectory -AclObject $acl
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_PFX_B64)
            $passwordText = $env:WINDOWS_CODE_SIGNING_PFX_PASSWORD
            $password = ConvertTo-SecureString -String $passwordText -AsPlainText -Force
            Remove-Item Env:WINDOWS_CODE_SIGNING_PFX_B64, Env:WINDOWS_CODE_SIGNING_PFX_PASSWORD
            try {
              $collection.Import($pfxBytes, $passwordText, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            } finally {
              $passwordText = $null
            }
            if ($collection.Count -ne 1 -or $collection[0].Thumbprint -cne $thumbprint -or -not $collection[0].HasPrivateKey) { throw "PFX must contain exactly the independently pinned publisher certificate and private key" }
            [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
            $importedCertificates = @(Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation 'Cert:\CurrentUser\My' -ErrorAction Stop)
            $imported = Test-Path -LiteralPath $certificatePath
            if ($importedCertificates.Count -ne 1 -or $importedCertificates[0].Thumbprint -cne $thumbprint -or -not $imported) { throw "Runner certificate import did not preserve the approved identity" }
            Remove-Item -LiteralPath $pfxPath -Force
            }
            & ./deploy/installers/windows/build-msi.ps1 -SeaDir $sea -TrustKey $trustKey -TrustKeyFingerprint $env:SIGNING_PUBLIC_KEY_FINGERPRINT -Version $env:RC_VERSION -OutDir $out -SignThumbprint $thumbprint -Signer $signer -TimestampServer $timestamp -CatalogKey $catalogKey
          } finally {
            $passwordText = $null
            Remove-Item Env:WINDOWS_CODE_SIGNING_PFX_B64, Env:WINDOWS_CODE_SIGNING_PFX_PASSWORD -ErrorAction SilentlyContinue
            foreach ($certificate in $collection) { $certificate.Dispose() }
            if ($password) { $password.Dispose() }
            if ($imported -or (Test-Path -LiteralPath $certificatePath)) { Remove-Item -LiteralPath $certificatePath -DeleteKey -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
            if (Test-Path -LiteralPath $privateDirectory) { Remove-Item -LiteralPath $privateDirectory -Force }
          }
          $msis = @(Get-ChildItem -LiteralPath $out -Filter *.msi)
          if ($msis.Count -ne 1 -or $msis[0].Name -match 'UNSIGNED') { throw "Exactly one signed MSI is expected" }
          Copy-Item (Join-Path $sea "aidr-artifact.manifest.json") (Join-Path $out "sea-manifest-windows-x64.before-authenticode.json")
          $lines = foreach ($msi in $msis) { "$((Get-FileHash -Algorithm SHA256 -LiteralPath $msi.FullName).Hash.ToLowerInvariant())  $($msi.Name)" }
          [System.IO.File]::WriteAllText((Join-Path $out "SHA256SUMS"), (($lines -join "`n") + "`n"))

      - name: Upload Windows installer (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-installers-windows-${{ needs.build-rc.outputs.tag }}
          path: ${{ runner.temp }}/installers-windows/
          if-no-files-found: error
          retention-days: 90
