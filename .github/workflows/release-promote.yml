name: Release Promote, Rollback or Yank

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to perform"
        required: true
        type: choice
        options: [promote, dry-run, rollback, yank]
        default: promote
      tag:
        description: "Protected RC/GA tag (promote/rollback)"
        required: false
        type: string
      rc_run_id:
        description: "Successful Release Candidate workflow run ID (promote/rollback)"
        required: false
        type: string
      rollback_version:
        description: "Previously verified package version (rollback)"
        required: false
        type: string
      bad_version:
        description: "Withdrawn package version (yank)"
        required: false
        type: string
      confirm:
        description: "Type I_UNDERSTAND for yank"
        required: false
        type: string

concurrency:
  group: release-promotion-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

env:
  NODE_VERSION: 22.12.0
  PNPM_VERSION: 10.29.3
  GH_CLI_VERSION: "2.101.0"
  GH_CLI_SHA256_LINUX_AMD64: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
  # Commercial packages are private GitHub Packages artifacts. Keep the
  # scope mapping explicit; never fall back to public npmjs.org.
  NPM_REGISTRY: https://npm.pkg.github.com
  NPM_REGISTRY_HOST: npm.pkg.github.com
  NPM_SCOPE: "@singularityrd"

jobs:
  promote:
    name: Promote one tested RC digest
    if: inputs.action == 'promote'
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: write
      actions: read
      attestations: read
      packages: write
    steps:
      - name: Validate promotion inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]] || {
            echo "Release promotion must run from the protected default branch." >&2
            exit 1
          }
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.0$ ]] || {
            echo "Only a protected vX.Y.Z-rc.0 tag can be promoted; repeated RCs collide with the stable package version." >&2
            exit 1
          }
          [[ "${RC_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "A successful RC workflow run ID is required." >&2; exit 1; }

      - name: Checkout the exact RC tag (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Checkout immutable trusted verifier (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-release-verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install pinned GitHub CLI for attestation verification
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GH_CLI_SHA256_LINUX_AMD64}" "${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          gh_dir="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          [[ -x "${gh_dir}/gh" ]] || { echo "Pinned gh binary is missing." >&2; exit 1; }
          [[ "$("${gh_dir}/gh" version | sed -n '1p')" == "gh version ${GH_CLI_VERSION}" ]] || {
            echo "Pinned GitHub CLI version mismatch." >&2
            exit 1
          }
          echo "${gh_dir}" >> "${GITHUB_PATH}"

      - name: Resolve latest protected anti-rollback state
        id: prior_state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          run_id="$(node .trusted-release-verifier/scripts/find-release-state-run.mjs \
            --artifact-name aidr-promotion-anti-rollback-state \
            --repository "${GITHUB_REPOSITORY}" \
            --api-url "${GITHUB_API_URL}" \
            --workflow-path .github/workflows/release-promote.yml \
            --default-branch "${DEFAULT_BRANCH}")"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Restore protected anti-rollback state (pinned)
        if: steps.prior_state.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-promotion-anti-rollback-state
          path: ${{ runner.temp }}/aidr-promotion-state
          run-id: ${{ steps.prior_state.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download the signed RC bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-release-${{ inputs.tag }}
          path: release-output
          run-id: ${{ inputs.rc_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub build attestations for every release file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          mapfile -d '' release_files < <(find release-output -type f -print0)
          ((${#release_files[@]} > 0)) || { echo "Release bundle is empty." >&2; exit 1; }
          for file in "${release_files[@]}"; do
            gh attestation verify "${file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-rc.yml" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "${expected_sha}" \
              --hostname "${GITHUB_SERVER_URL#https://}" >/dev/null
          done

      - name: Prepare trusted release-signer policy
        shell: bash
        env:
          SIGNER_POLICY_JSON: ${{ secrets.AIDR_RELEASE_SIGNER_POLICY_JSON }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNER_POLICY_JSON}" ]] || { echo "AIDR_RELEASE_SIGNER_POLICY_JSON is required." >&2; exit 1; }
          policy_path="${RUNNER_TEMP}/aidr-release-signer-policy.json"
          umask 077
          printf '%s\n' "${SIGNER_POLICY_JSON}" > "${policy_path}"
          echo "AIDR_RELEASE_SIGNER_POLICY_PATH=${policy_path}" >> "${GITHUB_ENV}"

      - name: Frozen verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify RC identity, manifest, SBOM and signatures
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version="${version%-rc.*}"
          expected_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          state_dir="${RUNNER_TEMP}/aidr-promotion-state"
          state_path="${state_dir}/anti-rollback-state.json"
          receipt_path="${state_dir}/verification-receipt.json"
          mkdir -p "${state_dir}"
          rm -f "${state_path}.lock" "${receipt_path}" "${receipt_path}.preflight"
          node .trusted-release-verifier/scripts/verify-release-run.mjs \
            --bundle release-output \
            --run-id "${RC_RUN_ID}" \
            --expected-tag "${RELEASE_TAG}" \
            --expected-sha "${expected_sha}" \
            --repository "${GITHUB_REPOSITORY}" \
            --api-url "${GITHUB_API_URL}" \
            --workflow-path .github/workflows/release-rc.yml
          node .trusted-release-verifier/scripts/verify-release-promotion.mjs \
            --bundle release-output \
            --policy "${AIDR_RELEASE_SIGNER_POLICY_PATH}" \
            --state "${state_path}" \
            --receipt "${receipt_path}" \
            --lockfile pnpm-lock.yaml \
            --expected-tag "${RELEASE_TAG}" \
            --expected-version "${version}" \
            --expected-sha "${expected_sha}" \
            --run-id "${RC_RUN_ID}" \
            --record
          for file in release-output/singularityrd-aidr-core-"${version}".tgz release-output/singularityrd-aidr-openclaw-"${version}".tgz release-output/singularityrd-aidr-opencode-"${version}".tgz release-output/singularityrd-aidr-sdk-"${version}".tgz release-output/singularityrd-aidr-cli-"${version}".tgz release-output/singularityrd-aidr-codex-"${version}".tgz; do
            [[ -f "${file}" ]] || { echo "Missing stable-version package artifact ${file}." >&2; exit 1; }
            package_version="$(tar -xOzf "${file}" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            [[ "${package_version}" == "${version}" ]] || {
              echo "${file} has package version ${package_version}; expected ${version}." >&2
              exit 1
            }
          done

      - name: Persist anti-rollback state and verification receipt (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-promotion-anti-rollback-state
          path: |
            ${{ runner.temp }}/aidr-promotion-state/anti-rollback-state.json
            ${{ runner.temp }}/aidr-promotion-state/verification-receipt.json
          if-no-files-found: error
          retention-days: 365
          overwrite: true

      - name: Publish verified npm packages under rc dist-tag
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "${NODE_AUTH_TOKEN}" ]] || { echo "GitHub Actions token is required for private GitHub Packages publishing." >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          version="${version%-rc.*}"
          npm config set "${NPM_SCOPE}:registry" "${NPM_REGISTRY}"
          npm config set "//${NPM_REGISTRY_HOST}/:_authToken" "${NODE_AUTH_TOKEN}"
          declare -a packages=(
            "@singularityrd/aidr-core:release-output/singularityrd-aidr-core-${version}.tgz"
            "@singularityrd/aidr-openclaw:release-output/singularityrd-aidr-openclaw-${version}.tgz"
            "@singularityrd/aidr-opencode:release-output/singularityrd-aidr-opencode-${version}.tgz"
            "@singularityrd/aidr-sdk:release-output/singularityrd-aidr-sdk-${version}.tgz"
            "@singularityrd/aidr-cli:release-output/singularityrd-aidr-cli-${version}.tgz"
            "@singularityrd/aidr-codex:release-output/singularityrd-aidr-codex-${version}.tgz"
          )
          declare -a candidate_args=()
          for item in "${packages[@]}"; do
            package="${item%%:*}"
            file="${item#*:}"
            [[ -f "${file}" ]] || { echo "Missing signed npm tarball ${file}" >&2; exit 1; }
            candidate_args+=(--candidate "${package}=${file}")
          done
          publication_plan="${RUNNER_TEMP}/aidr-npm-publication-plan.txt"
          node .trusted-release-verifier/scripts/plan-npm-release-publication.mjs \
            --version "${version}" \
            --registry "${NPM_REGISTRY}" \
            "${candidate_args[@]}" > "${publication_plan}"
          mapfile -t unpublished_files < "${publication_plan}"
          for file in "${unpublished_files[@]}"; do
            npm publish "${file}" --tag rc --access restricted --registry "${NPM_REGISTRY}"
          done

      - name: Promote the exact dashboard commit and run remote smoke
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.DASHBOARD_DEPLOY_HOOK_URL }}
          VERSION_URL: ${{ secrets.DASHBOARD_VERSION_URL }}
          SMOKE_BASE_URL: ${{ secrets.DASHBOARD_SMOKE_BASE_URL }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_HOOK}" && -n "${VERSION_URL}" && -n "${SMOKE_BASE_URL}" ]] || {
            echo "DASHBOARD_DEPLOY_HOOK_URL, DASHBOARD_VERSION_URL and DASHBOARD_SMOKE_BASE_URL are required." >&2
            exit 1
          }
          version="${RELEASE_TAG#v}"
          expected_version="${version%-rc.*}"
          expected_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          dashboard_archive="release-output/aidr-dashboard-dist-${expected_version}.tar.gz"
          [[ -f "${dashboard_archive}" ]] || { echo "Signed dashboard archive is missing." >&2; exit 1; }
          dashboard_sha="$(sha256sum "${dashboard_archive}" | awk '{print $1}')"
          curl --fail --silent --show-error --retry 3 --retry-all-errors -X POST \
            -H 'content-type: application/json' \
            --data "{\"version\":\"${expected_version}\",\"git_sha\":\"${expected_sha}\",\"dashboard_archive_sha256\":\"${dashboard_sha}\"}" "${DEPLOY_HOOK}" >/dev/null
          for attempt in $(seq 1 30); do
            if deployment_state="$(curl --fail --silent --show-error --retry 2 "${VERSION_URL}")" && \
              DEPLOYMENT_STATE="${deployment_state}" EXPECTED_VERSION="${expected_version}" EXPECTED_SHA="${expected_sha}" node -e '
                const state = JSON.parse(process.env.DEPLOYMENT_STATE);
                if (state.version !== process.env.EXPECTED_VERSION || state.git_sha !== process.env.EXPECTED_SHA) process.exit(1);
              '; then
              break
            fi
            [[ "${attempt}" -eq 30 ]] && { echo "Dashboard version endpoint did not report ${expected_sha}." >&2; exit 1; }
            sleep 10
          done
          node .trusted-release-verifier/scripts/verify-deployed-dashboard.mjs \
            --archive "${dashboard_archive}" \
            --base-url "${SMOKE_BASE_URL}" \
            --expected-version "${expected_version}" \
            --expected-sha "${expected_sha}"
          DASHBOARD_SMOKE_BASE_URL="${SMOKE_BASE_URL}" pnpm -C packages/dashboard test:route-smoke

      - name: Move npm dist-tags to latest only after deployed smoke
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version="${version%-rc.*}"
          npm config set "${NPM_SCOPE}:registry" "${NPM_REGISTRY}"
          npm config set "//${NPM_REGISTRY_HOST}/:_authToken" "${NODE_AUTH_TOKEN}"
          for package in @singularityrd/aidr-core @singularityrd/aidr-openclaw @singularityrd/aidr-opencode @singularityrd/aidr-sdk @singularityrd/aidr-cli @singularityrd/aidr-codex; do
            npm dist-tag add "${package}@${version}" latest --registry "${NPM_REGISTRY}"
          done

      - name: Publish final GitHub release from the same bundle (pinned)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          name: AIDR ${{ inputs.tag }}
          prerelease: false
          draft: false
          generate_release_notes: false
          files: release-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive promotion evidence (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidr-promotion-${{ inputs.tag }}-${{ github.run_id }}
          path: release-output/
          retention-days: 365

  dry-run:
    name: Rehearse private package publication (no mutation)
    if: inputs.action == 'dry-run'
    runs-on: ubuntu-22.04
    environment: release-candidate
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: read
    steps:
      - name: Validate dry-run inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]] || { echo "Release rehearsal must run from the protected default branch." >&2; exit 1; }
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.0$ ]] || { echo "Only a protected vX.Y.Z-rc.0 tag can be rehearsed." >&2; exit 1; }
          [[ "${RC_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "A successful RC workflow run ID is required." >&2; exit 1; }

      - name: Checkout the exact RC tag (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable trusted verifier (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-release-verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned GitHub CLI for attestation verification
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GH_CLI_SHA256_LINUX_AMD64}" "${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          gh_dir="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          [[ -x "${gh_dir}/gh" ]] || { echo "Pinned gh binary is missing." >&2; exit 1; }
          [[ "$("${gh_dir}/gh" version | sed -n '1p')" == "gh version ${GH_CLI_VERSION}" ]] || {
            echo "Pinned GitHub CLI version mismatch." >&2
            exit 1
          }
          echo "${gh_dir}" >> "${GITHUB_PATH}"

      - name: Download the signed RC bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-release-${{ inputs.tag }}
          path: release-output
          run-id: ${{ inputs.rc_run_id }}
          github-token: ${{ github.token }}

      - name: Verify GitHub build attestations for every release file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          mapfile -d '' release_files < <(find release-output -type f -print0)
          ((${#release_files[@]} > 0)) || { echo "Release bundle is empty." >&2; exit 1; }
          for file in "${release_files[@]}"; do
            gh attestation verify "${file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-rc.yml" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "${expected_sha}" \
              --hostname "${GITHUB_SERVER_URL#https://}" >/dev/null
          done

      - name: Prepare trusted release-signer policy
        shell: bash
        env:
          SIGNER_POLICY_JSON: ${{ secrets.AIDR_RELEASE_SIGNER_POLICY_JSON }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNER_POLICY_JSON}" ]] || { echo "AIDR_RELEASE_SIGNER_POLICY_JSON is required." >&2; exit 1; }
          policy_path="${RUNNER_TEMP}/aidr-release-signer-policy.json"
          umask 077
          printf '%s\n' "${SIGNER_POLICY_JSON}" > "${policy_path}"
          echo "AIDR_RELEASE_SIGNER_POLICY_PATH=${policy_path}" >> "${GITHUB_ENV}"

      - name: Verify signed bundle and rehearse private registry publication
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_path="${RUNNER_TEMP}/aidr-dry-run-rollback-state.json"
          receipt_path="${RUNNER_TEMP}/aidr-dry-run-verification-receipt.json"
          rm -f "${state_path}" "${state_path}.lock" "${receipt_path}"
          version="${RELEASE_TAG#v}"
          version="${version%-rc.*}"
          expected_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          node .trusted-release-verifier/scripts/verify-release-run.mjs \
            --bundle release-output \
            --run-id "${RC_RUN_ID}" \
            --expected-tag "${RELEASE_TAG}" \
            --expected-sha "${expected_sha}" \
            --repository "${GITHUB_REPOSITORY}" \
            --api-url "${GITHUB_API_URL}" \
            --workflow-path .github/workflows/release-rc.yml
          node .trusted-release-verifier/scripts/verify-release-promotion.mjs \
            --bundle release-output \
            --policy "${AIDR_RELEASE_SIGNER_POLICY_PATH}" \
            --state "${state_path}" \
            --receipt "${receipt_path}" \
            --lockfile pnpm-lock.yaml \
            --expected-tag "${RELEASE_TAG}" \
            --expected-version "${version}" \
            --expected-sha "${expected_sha}" \
            --run-id "${RC_RUN_ID}"
          npm config set "${NPM_SCOPE}:registry" "${NPM_REGISTRY}"
          npm config set "//${NPM_REGISTRY_HOST}/:_authToken" "${NODE_AUTH_TOKEN}"
          for package in core openclaw opencode sdk cli codex; do
            file="release-output/singularityrd-aidr-${package}-${version}.tgz"
            [[ -f "${file}" ]] || { echo "Missing ${file}" >&2; exit 1; }
            npm publish "${file}" --dry-run --tag rc --access restricted --registry "${NPM_REGISTRY}"
          done

  rollback:
    name: Roll back npm tags and dashboard deployment
    if: inputs.action == 'rollback'
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: write
    steps:
      - name: Validate rollback inputs
        shell: bash
        env:
          VERSION: ${{ inputs.rollback_version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          DEPLOY_HOOK: ${{ secrets.DASHBOARD_ROLLBACK_HOOK_URL }}
          VERSION_URL: ${{ secrets.DASHBOARD_VERSION_URL }}
          SMOKE_BASE_URL: ${{ secrets.DASHBOARD_SMOKE_BASE_URL }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]] || { echo "Release rollback must run from the protected default branch." >&2; exit 1; }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "rollback_version must be x.y.z" >&2; exit 1; }
          [[ "${RELEASE_TAG}" == "v${VERSION}-rc.0" ]] || { echo "rollback tag must be v${VERSION}-rc.0" >&2; exit 1; }
          [[ "${RC_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "A successful RC workflow run ID is required for rollback." >&2; exit 1; }
          [[ -n "${DEPLOY_HOOK}" && -n "${VERSION_URL}" && -n "${SMOKE_BASE_URL}" ]] || {
            echo "Rollback dashboard hook, version endpoint and smoke URL are required." >&2
            exit 1
          }

      - name: Checkout the exact rollback RC tag (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable trusted verifier (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-release-verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned GitHub CLI for attestation verification
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GH_CLI_SHA256_LINUX_AMD64}" "${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          gh_dir="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          [[ -x "${gh_dir}/gh" ]] || { echo "Pinned gh binary is missing." >&2; exit 1; }
          [[ "$("${gh_dir}/gh" version | sed -n '1p')" == "gh version ${GH_CLI_VERSION}" ]] || {
            echo "Pinned GitHub CLI version mismatch." >&2
            exit 1
          }
          echo "${gh_dir}" >> "${GITHUB_PATH}"

      - name: Download the signed rollback RC bundle (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidr-release-${{ inputs.tag }}
          path: release-output
          run-id: ${{ inputs.rc_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub build attestations for every release file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          mapfile -d '' release_files < <(find release-output -type f -print0)
          ((${#release_files[@]} > 0)) || { echo "Release bundle is empty." >&2; exit 1; }
          for file in "${release_files[@]}"; do
            gh attestation verify "${file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-rc.yml" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "${expected_sha}" \
              --hostname "${GITHUB_SERVER_URL#https://}" >/dev/null
          done

      - name: Verify rollback RC signature and identity
        id: rollback_verify
        shell: bash
        env:
          SIGNER_POLICY_JSON: ${{ secrets.AIDR_RELEASE_SIGNER_POLICY_JSON }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.rollback_version }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNER_POLICY_JSON}" ]] || { echo "AIDR_RELEASE_SIGNER_POLICY_JSON is required." >&2; exit 1; }
          policy_path="${RUNNER_TEMP}/aidr-release-signer-policy.json"
          state_path="${RUNNER_TEMP}/aidr-rollback-verification-state.json"
          receipt_path="${RUNNER_TEMP}/aidr-rollback-verification-receipt.json"
          umask 077
          printf '%s\n' "${SIGNER_POLICY_JSON}" > "${policy_path}"
          rm -f "${state_path}" "${state_path}.lock" "${receipt_path}"
          expected_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          node .trusted-release-verifier/scripts/verify-release-run.mjs \
            --bundle release-output \
            --run-id "${RC_RUN_ID}" \
            --expected-tag "${RELEASE_TAG}" \
            --expected-sha "${expected_sha}" \
            --repository "${GITHUB_REPOSITORY}" \
            --api-url "${GITHUB_API_URL}" \
            --workflow-path .github/workflows/release-rc.yml
          node .trusted-release-verifier/scripts/verify-release-promotion.mjs \
            --bundle release-output \
            --policy "${policy_path}" \
            --state "${state_path}" \
            --receipt "${receipt_path}" \
            --lockfile pnpm-lock.yaml \
            --expected-tag "${RELEASE_TAG}" \
            --expected-version "${VERSION}" \
            --expected-sha "${expected_sha}" \
            --run-id "${RC_RUN_ID}"
          echo "verified_sha=${expected_sha}" >> "${GITHUB_OUTPUT}"

      - name: Retag verified npm versions and dashboard deployment
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.rollback_version }}
          DEPLOY_HOOK: ${{ secrets.DASHBOARD_ROLLBACK_HOOK_URL }}
          VERSION_URL: ${{ secrets.DASHBOARD_VERSION_URL }}
          SMOKE_BASE_URL: ${{ secrets.DASHBOARD_SMOKE_BASE_URL }}
          VERIFIED_SHA: ${{ steps.rollback_verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          [[ -n "${NODE_AUTH_TOKEN}" ]] || { echo "GitHub Actions token is required." >&2; exit 1; }
          [[ "${VERIFIED_SHA}" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]] || { echo "Verified rollback commit is missing or invalid." >&2; exit 1; }
          npm config set "${NPM_SCOPE}:registry" "${NPM_REGISTRY}"
          npm config set "//${NPM_REGISTRY_HOST}/:_authToken" "${NODE_AUTH_TOKEN}"
          registry_dir="${RUNNER_TEMP}/aidr-registry-rollback-packages"
          rm -rf "${registry_dir}"
          mkdir -p "${registry_dir}"
          for package in @singularityrd/aidr-core @singularityrd/aidr-openclaw @singularityrd/aidr-opencode @singularityrd/aidr-sdk @singularityrd/aidr-cli @singularityrd/aidr-codex; do
            pack_json="$(npm pack "${package}@${VERSION}" --ignore-scripts --json --pack-destination "${registry_dir}" --registry "${NPM_REGISTRY}")"
            registry_name="$(PACK_JSON="${pack_json}" node -e 'const rows=JSON.parse(process.env.PACK_JSON); if(!Array.isArray(rows)||rows.length!==1||typeof rows[0].filename!=="string") process.exit(1); process.stdout.write(rows[0].filename)')"
            component="${package##*/}"
            signed_file="release-output/singularityrd-${component}-${VERSION}.tgz"
            registry_file="${registry_dir}/${registry_name}"
            [[ -f "${signed_file}" && -f "${registry_file}" ]] || { echo "Missing signed or registry package for ${package}@${VERSION}." >&2; exit 1; }
            if ! cmp -s "${signed_file}" "${registry_file}"; then
              echo "Registry bytes differ from signed RC for ${package}@${VERSION}." >&2
              sha256sum "${signed_file}" "${registry_file}" >&2
              exit 1
            fi
          done
          dashboard_archive="release-output/aidr-dashboard-dist-${VERSION}.tar.gz"
          [[ -f "${dashboard_archive}" ]] || { echo "Signed dashboard archive is missing." >&2; exit 1; }
          dashboard_sha="$(sha256sum "${dashboard_archive}" | awk '{print $1}')"
          curl --fail --silent --show-error --retry 3 --retry-all-errors -X POST \
            -H 'content-type: application/json' \
            --data "{\"version\":\"${VERSION}\",\"git_sha\":\"${VERIFIED_SHA}\",\"dashboard_archive_sha256\":\"${dashboard_sha}\"}" "${DEPLOY_HOOK}" >/dev/null
          for attempt in $(seq 1 30); do
            deployment_state="$(curl --fail --silent --show-error --retry 2 "${VERSION_URL}")"
            if DEPLOYMENT_STATE="${deployment_state}" EXPECTED_VERSION="${VERSION}" EXPECTED_SHA="${VERIFIED_SHA}" node -e '
              const state = JSON.parse(process.env.DEPLOYMENT_STATE);
              if (state.version !== process.env.EXPECTED_VERSION || state.git_sha !== process.env.EXPECTED_SHA) process.exit(1);
            '; then break; fi
            [[ "${attempt}" -eq 30 ]] && { echo "Rollback deployment did not attest ${VERSION} at ${VERIFIED_SHA}." >&2; exit 1; }
            sleep 10
          done
          node .trusted-release-verifier/scripts/verify-deployed-dashboard.mjs \
            --archive "${dashboard_archive}" \
            --base-url "${SMOKE_BASE_URL}" \
            --expected-version "${VERSION}" \
            --expected-sha "${VERIFIED_SHA}"
          for route in / /pilot /pricing /verify /login; do
            body="$(curl --fail --silent --show-error --retry 2 "${SMOKE_BASE_URL}${route}")"
            echo "${body}" | grep -F 'id="root"' >/dev/null || {
              echo "Dashboard rollback smoke failed for ${route}." >&2
              exit 1
            }
          done
          for package in @singularityrd/aidr-core @singularityrd/aidr-openclaw @singularityrd/aidr-opencode @singularityrd/aidr-sdk @singularityrd/aidr-cli @singularityrd/aidr-codex; do
            npm dist-tag add "${package}@${VERSION}" latest --registry "${NPM_REGISTRY}"
          done

  yank:
    name: Deprecate and withdraw a bad release
    if: inputs.action == 'yank'
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate yank confirmation
        shell: bash
        env:
          VERSION: ${{ inputs.bad_version }}
          CONFIRM: ${{ inputs.confirm }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]] || { echo "Release withdrawal must run from the protected default branch." >&2; exit 1; }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad_version must be x.y.z" >&2; exit 1; }
          [[ "${CONFIRM}" == "I_UNDERSTAND" ]] || { echo "Type I_UNDERSTAND to deprecate a release." >&2; exit 1; }

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deprecate npm versions without destructive unpublish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.bad_version }}
          MARKETPLACE_YANK_HOOK_URL: ${{ secrets.MARKETPLACE_YANK_HOOK_URL }}
        run: |
          set -euo pipefail
          [[ -n "${NODE_AUTH_TOKEN}" ]] || { echo "GitHub Actions token is required." >&2; exit 1; }
          npm config set "${NPM_SCOPE}:registry" "${NPM_REGISTRY}"
          npm config set "//${NPM_REGISTRY_HOST}/:_authToken" "${NODE_AUTH_TOKEN}"
          for package in @singularityrd/aidr-core @singularityrd/aidr-openclaw @singularityrd/aidr-opencode @singularityrd/aidr-sdk @singularityrd/aidr-cli @singularityrd/aidr-codex; do
            npm deprecate "${package}@${VERSION}" "Withdrawn AIDR release ${VERSION}; use the next signed release." --registry "${NPM_REGISTRY}"
            latest="$(npm view "${package}@latest" version --registry "${NPM_REGISTRY}" 2>/dev/null || true)"
            if [[ "${latest}" == "${VERSION}" ]]; then npm dist-tag rm "${package}" latest --registry "${NPM_REGISTRY}"; fi
          done
          if [[ -z "${MARKETPLACE_YANK_HOOK_URL:-}" ]]; then
            echo "MARKETPLACE_YANK_HOOK_URL is not configured; npm packages were deprecated but private VSIX/Claude assets still require manual withdrawal." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors -X POST \
            -H 'content-type: application/json' \
            --data "{\"version\":\"${VERSION}\"}" "${MARKETPLACE_YANK_HOOK_URL}" >/dev/null
