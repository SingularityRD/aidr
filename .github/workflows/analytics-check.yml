name: Product Analytics Instrumentation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify analytics instrumentation without writing source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f packages/core/src/analytics.ts ]]; then
            git diff --exit-code -- packages/core/src/analytics.ts
            echo "Analytics utility is present and the check was read-only."
          else
            echo "Analytics utility is not present; no source is synthesized by CI."
          fi
