  browser-guard:
    name: Browser Guard build, unit and real-browser E2E
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen install without postinstall mutation
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium pinned to the browser-guard playwright-core version
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(node -p 'require("./packages/browser-guard/package.json").devDependencies["playwright-core"]')"
          [[ "${pinned}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "playwright-core must be an exact version pin, found ${pinned}" >&2; exit 1; }
          installed="$(node -p 'require(require.resolve("playwright-core/package.json", { paths: ["packages/browser-guard"] })).version')"
          [[ "${installed}" == "${pinned}" ]] || { echo "Installed playwright-core ${installed} != pinned ${pinned}" >&2; exit 1; }
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/pw-browsers" >> "${GITHUB_ENV}"
          PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/pw-browsers" \
            node packages/browser-guard/node_modules/playwright-core/cli.js install --with-deps --no-shell chromium

      - name: Build the extension
        run: pnpm build:browser-guard

      - name: Unit tests
        run: pnpm exec vitest run --config vitest.browser-guard.config.ts --reporter=dot

      - name: Real-browser E2E (hermetic fixtures)
        run: pnpm test:e2e:browser-guard

      - name: Package release zips and checksums
        shell: bash
        run: |
          set -euo pipefail
          pnpm package:browser-guard
          (cd packages/browser-guard/dist && sha256sum --check --strict SHA256SUMS)

      - name: Upload Browser Guard zips (pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-guard-${{ github.run_id }}
          path: |
            packages/browser-guard/dist/*.zip
            packages/browser-guard/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  real-host-e2e:
    name: Provisioned real-host connector E2E (manual opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_e2e
    runs-on: ubuntu-22.04
    environment: connector-e2e
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup pinned Python for release E2E
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: services/aig-bridge/requirements-ci.lock

      - name: Install pinned bridge E2E dependencies
        working-directory: services/aig-bridge
        run: |
          set -euo pipefail
          # requirements-ci.lock = requirements.txt + pytest pins, hash-locked.
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip check

      - name: Run positive and negative connector suites
        env:
          AIDR_E2E_REQUIRE_REAL: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          AIDR_AGENT_PATH: ${{ secrets.AIDR_AGENT_PATH }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          pnpm test:e2e
          pnpm test:e2e:negative

      - name: Verify connector evidence upload boundary
        if: always()
        id: evidence_boundary
        run: node --test scripts/ci-evidence-upload.test.mjs scripts/run-e2e-release.test.mjs scripts/release-signing.test.mjs

      - name: Upload connector evidence (pinned)
        if: always() && steps.evidence_boundary.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connector-e2e-${{ github.run_id }}
          path: |
            .e2e-artifacts/release/*.json
            .e2e-artifacts/release/*.xml
            .e2e-artifacts/release/*.log
          if-no-files-found: error
          retention-days: 90
