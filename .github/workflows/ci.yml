name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_real_e2e:
        description: "Run provisioned real-host connector E2E suites"
        required: false
        type: boolean
        default: false
      run_supabase_local:
        description: "Run the pinned local Supabase lint/reset contract"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20.19.1
  PNPM_VERSION: 10.29.3

jobs:
  quality-gate:
    name: Deterministic quality gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodule (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen install without postinstall mutation
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify clean checkout and AIG gitlink
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { git status --short; exit 1; }
          expected="$(git ls-tree HEAD vendor/ai-infra-guard | awk '{print $3}')"
          actual="$(git -C vendor/ai-infra-guard rev-parse HEAD)"
          [[ -n "${expected}" && "${expected}" == "${actual}" ]] || {
            echo "AIG submodule gitlink mismatch: expected=${expected} actual=${actual}" >&2
            exit 1
          }

      - name: Strict AIG verification and generated-data freshness
        shell: bash
        env:
          AIG_STRICT_CASE: "true"
        run: |
          set -euo pipefail
          pnpm aig:verify
          pnpm compile:aig
          git diff --exit-code -- packages/core/src/generated

      - name: Supabase migration contract
        run: pnpm supabase:check

      - name: Pinned local Supabase schema contract (manual CI opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.run_supabase_local
        run: |
          pnpm dlx supabase@2.33.9 db lint --local
          pnpm dlx supabase@2.33.9 db reset --local --no-seed

      - name: Type, lint, audit, tests, coverage and release build
        run: pnpm quality:gate

      - name: Dashboard static route smoke
        run: pnpm -C packages/dashboard test:route-smoke:static

      - name: Enforce clean diff after verification/build
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Verification or build mutated tracked files:" >&2
            git status --short >&2
            exit 1
          fi

      - name: Upload deterministic test evidence (pinned)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-${{ github.run_id }}
          path: |
            coverage/
            .e2e-artifacts/
            .release-evidence/
          if-no-files-found: ignore
          retention-days: 30

  aig-bridge:
    name: AIG bridge dependency and contract gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python (pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: services/aig-bridge/requirements.txt

      - name: Install pinned bridge tooling and dependencies
        working-directory: services/aig-bridge
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pip-audit==2.9.0 pytest==8.4.1 pytest-asyncio==1.1.0
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Audit and test bridge
        working-directory: services/aig-bridge
        run: |
          pip-audit -r requirements.txt
          PYTHONPATH=. pytest -q tests

  real-host-e2e:
    name: Provisioned real-host connector E2E (manual opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_e2e
    runs-on: ubuntu-22.04
    environment: connector-e2e
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup pinned Python for release E2E
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: services/aig-bridge/requirements.txt

      - name: Install pinned bridge E2E dependencies
        working-directory: services/aig-bridge
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest==8.4.1 pytest-asyncio==1.1.0
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Run positive and negative connector suites
        env:
          AIDR_E2E_REQUIRE_REAL: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          AIDR_AGENT_PATH: ${{ secrets.AIDR_AGENT_PATH }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          pnpm test:e2e
          pnpm test:e2e:negative

      - name: Upload connector evidence (pinned)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-e2e-${{ github.run_id }}
          path: .e2e-artifacts/
          if-no-files-found: error
          retention-days: 90
