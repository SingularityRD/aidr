name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_real_e2e:
        description: "Run provisioned real-host connector E2E suites"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0
  PNPM_VERSION: 10.29.3

jobs:
  quality-gate:
    name: Deterministic quality gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodule (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Current-worktree secret scan (pinned)
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check --strict
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" gitleaks
          PATH="${bin_dir}:${PATH}" pnpm verify:secrets:current

      - name: Prometheus alert contract (promtool 3.14.0, pinned)
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/prometheus-3.14.0.linux-amd64.tar.gz"
          tool_dir="${RUNNER_TEMP}/promtool"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz
          echo "f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d  ${archive}" | sha256sum --check --strict
          mkdir -p "${tool_dir}"
          tar -xzf "${archive}" -C "${tool_dir}" --strip-components=1 prometheus-3.14.0.linux-amd64/promtool
          (
            cd deploy/monitoring
            "${tool_dir}/promtool" check rules prometheus-alerts.yml
            "${tool_dir}/promtool" test rules prometheus-alerts.test.yml
          )

      - name: Frozen install without postinstall mutation
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cloudflare Worker contract
        run: node --test deploy/cloudflare/worker.test.mjs deploy/cloudflare/verify-operational.test.mjs deploy/cloudflare/staging-deploy.test.mjs

      - name: Verify clean checkout and vendored AIG source
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { git status --short; exit 1; }
          source_type="$(git ls-tree HEAD vendor/ai-infra-guard | awk '{print $2}')"
          [[ "${source_type}" == "tree" ]] || {
            echo "AIG source must be a committed directory" >&2
            exit 1
          }

      - name: Strict AIG verification and generated-data freshness
        shell: bash
        env:
          AIG_STRICT_CASE: "true"
        run: |
          set -euo pipefail
          pnpm aig:verify
          pnpm compile:aig
          git diff --exit-code -- packages/core/src/generated

      - name: Supabase migration contract
        run: pnpm supabase:check

      - name: Pinned Deno Edge typecheck (9-route security-critical slice)
        run: pnpm supabase:check:edge-typed-slice

      - name: Pinned local Supabase schema contract
        env:
          AIDR_RLS_TEST_DB_CONTAINER: supabase_db_aidr
          AIDR_POSTGRES_DOCKER_CONTAINER: supabase_db_aidr
          AIDR_TEST_DISPOSABLE_DB: "1"
        run: |
          set -euo pipefail
          pnpm dlx supabase@2.114.0 start
          pnpm dlx supabase@2.114.0 db reset --local --no-seed
          pnpm dlx supabase@2.114.0 db lint --local --fail-on error
          node scripts/database-boundary-hardening-postgres.mjs
          node scripts/tenant-lifecycle-rls-postgres.test.mjs --installed
          node scripts/team-resource-read-rls-postgres.mjs
          node scripts/team-invitation-atomic-audit-postgres.mjs
          node scripts/team-member-email-projection-postgres.mjs
          node scripts/scim-saml-identity-postgres.mjs --with-claim-recovery-migration
          node scripts/scim-canonical-membership-postgres.mjs --with-lock-order-migration
          node scripts/owner-role-audit-postgres.mjs
          node scripts/member-role-audit-postgres.mjs
          node scripts/member-removal-audit-postgres.mjs
          node scripts/member-authorization-race-postgres.mjs
          node scripts/billing-channel-intent-postgres.mjs
          node scripts/events-seat-admission-postgres.mjs
          node scripts/pilot-approval-seat-postgres.mjs
          node scripts/tenant-ga-admission-postgres.test.mjs --installed
          node scripts/tenant-ga-admission-concurrency-postgres.test.mjs
          node scripts/ga-trial-legal-consent-postgres.test.mjs --installed
          node scripts/ga-trial-auth-delete-postgres.test.mjs --installed
          node scripts/team-invitation-acceptance-postgres.mjs --installed
          node scripts/member-api-key-revocation-postgres.mjs
          node scripts/cloud-signup-workspace-name-postgres.mjs
          node scripts/onprem-licensed-bootstrap-postgres.test.mjs
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/ingest-seat-reduction.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/provider-term-seat-expiry.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/events-seat-admission.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/seat-usage-effective-view.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/enrollment-rotation-resolution.rollback.sql
          docker exec -i "${AIDR_RLS_TEST_DB_CONTAINER}" psql -X -qAt -v ON_ERROR_STOP=1 -w -U postgres -d postgres < supabase/functions/__tests__/device-membership-token.rollback.sql
          pnpm verify:supabase-pilot-audit-live
          pnpm verify:supabase-device-revocation-live

      - name: Stop pinned local Supabase stack
        if: always()
        run: pnpm dlx supabase@2.114.0 stop --no-backup

      - name: Blocking reputation, offboarding and retention PostgreSQL gates
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17-alpine
          node --test scripts/reputation-write-lockdown-postgres.test.mjs
          node --test scripts/device-authorization-membership-race-postgres.test.mjs
          node --test scripts/identity-recovery-cross-tenant-postgres.test.mjs
          node --test scripts/billing-resubscription-postgres.test.mjs
          node --test scripts/device-poll-membership-revocation-postgres.test.mjs
          docker pull supabase/postgres:17.6.1.136
          pnpm verify:offboarding
          pnpm verify:retention
          node --test scripts/tenant-rate-limit-postgres.test.mjs

      - name: Type, lint, audit, tests, coverage and release build
        run: pnpm quality:gate

      - name: MCP gateway and dashboard auth callback tests
        env:
          AIDR_TEST_NO_BUILD: "1"
        run: |
          pnpm --filter @singularityrd/aidr-mcp-gateway test
          pnpm exec vitest run --config vitest.config.ts packages/dashboard/supabase/functions/auth-callback/index.test.ts --reporter=dot

      - name: Verify Windows and Unix fleet lifecycles
        run: pnpm verify:fleet:windows && pnpm verify:fleet:unix

      - name: Install every packed consumer artifact
        run: pnpm verify:package-install

      - name: Dashboard static route smoke
        run: pnpm -C packages/dashboard test:route-smoke:static

      - name: Enforce clean diff after verification/build
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Verification or build mutated tracked files:" >&2
            git status --short >&2
            exit 1
          fi

      - name: Verify CI evidence upload boundary
        if: always()
        id: evidence_boundary
        run: node --test scripts/ci-evidence-upload.test.mjs scripts/run-e2e-release.test.mjs scripts/release-signing.test.mjs

      - name: Upload deterministic test evidence (pinned)
        if: always() && steps.evidence_boundary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-${{ github.run_id }}
          path: |
            coverage/
          if-no-files-found: ignore
          retention-days: 30

  aig-bridge:
    name: AIG bridge dependency and contract gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python (pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: services/aig-bridge/requirements.txt

      - name: Install pinned bridge tooling and dependencies
        working-directory: services/aig-bridge
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pip-audit==2.9.0 pytest==8.4.1 pytest-asyncio==1.1.0
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Audit and test bridge
        working-directory: services/aig-bridge
        run: |
          pip-audit -r requirements.txt
          PYTHONPATH=. pytest -q tests

  real-host-e2e:
    name: Provisioned real-host connector E2E (manual opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_e2e
    runs-on: ubuntu-22.04
    environment: connector-e2e
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup pinned Python for release E2E
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: services/aig-bridge/requirements.txt

      - name: Install pinned bridge E2E dependencies
        working-directory: services/aig-bridge
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest==8.4.1 pytest-asyncio==1.1.0
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Run positive and negative connector suites
        env:
          AIDR_E2E_REQUIRE_REAL: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          AIDR_AGENT_PATH: ${{ secrets.AIDR_AGENT_PATH }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          pnpm test:e2e
          pnpm test:e2e:negative

      - name: Verify connector evidence upload boundary
        if: always()
        id: evidence_boundary
        run: node --test scripts/ci-evidence-upload.test.mjs scripts/run-e2e-release.test.mjs scripts/release-signing.test.mjs

      - name: Upload connector evidence (pinned)
        if: always() && steps.evidence_boundary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-e2e-${{ github.run_id }}
          path: |
            .e2e-artifacts/release/*.json
            .e2e-artifacts/release/*.xml
            .e2e-artifacts/release/*.log
          if-no-files-found: error
          retention-days: 90
