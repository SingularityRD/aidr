name: Documentation Generation

on:
  push:
    branches: [main, master]
    paths:
      - "packages/**/src/**/*.ts"
      - "packages/**/src/**/*.tsx"
  pull_request:
    paths:
      - "packages/**/src/**/*.ts"
      - "packages/**/src/**/*.tsx"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 20.19.1
  PNPM_VERSION: 10.29.3
  TYPEDOC_VERSION: 0.28.13

jobs:
  generate-docs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen install without lockfile mutation
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate API documentation with pinned TypeDoc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/api/core docs/api/sdk
          pnpm dlx "typedoc@${TYPEDOC_VERSION}" --out docs/api/core packages/core/src/index.ts --name "@singularityrd/aidr-core"
          pnpm dlx "typedoc@${TYPEDOC_VERSION}" --out docs/api/sdk packages/sdk/src/index.ts --name "@singularityrd/aidr-sdk"

      - name: Generate architecture diagram as an artifact only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/diagrams
          cat > docs/diagrams/package-structure.mmd <<'EOF'
          graph TD
            Core["@singularityrd/aidr-core"]
            Claude["@singularityrd/aidr-claude-code"]
            OpenClaw["@singularityrd/aidr-openclaw"]
            OpenCode["@singularityrd/aidr-opencode"]
            Extension["aidr-cursor / aidr-vscode"]
            SDK["@singularityrd/aidr-sdk"]
            Dashboard["aidr-dashboard"]
            Core --> Claude
            Core --> OpenClaw
            Core --> OpenCode
            Core --> Extension
            Core --> SDK
            Dashboard --> Core
          EOF

      - name: Upload generated documentation (pinned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-docs-${{ github.run_id }}
          path: |
            docs/api/
            docs/diagrams/
          if-no-files-found: error
          retention-days: 30

      - name: Assert documentation job is read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':!docs/api' ':!docs/diagrams'
          unexpected="$(git status --porcelain | grep -vE '^\?\? docs/(api|diagrams)/' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Documentation verification modified tracked/source files:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
