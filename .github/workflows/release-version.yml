name: Release Version PR

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version-pr:
    name: Create or update Changesets version PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Changesets dependencies without lifecycle mutation
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Version packages only (never publish)
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert version workflow cannot publish
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings "changeset publish" .github/workflows/release-version.yml; then
            echo "The version workflow must never contain a publish command." >&2
            exit 1
          fi
