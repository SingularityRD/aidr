name: Feature Request
description: Suggest a new feature for Singularity AIDR
title: "[FEATURE] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What solution would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions have you considered?
  - type: checkboxes
    id: platforms
    attributes:
      label: Affected Platforms
      options:
        - label: Claude Code
        - label: Cursor / VS Code
        - label: OpenClaw
        - label: OpenCode
        - label: Core Engine
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
        - label: This is a feature request, not a bug report
