{{- if .Values.migrations.enabled }}
{{- $component := "migrations" -}}
{{- $values := .Values.migrations -}}
# Applies supabase/migrations in filename order inside ONE transaction guarded by
# an advisory lock. Every applied file is recorded with its SHA-256 in
# public.aidr_schema_migrations; already-applied files are skipped and a changed
# or unknown migration aborts the run (same contract as deployment-migrate.mjs).
#
# Hook phases: post-install (the Supabase roles and the storage schema the
# migrations depend on are created by the stack's first boot, so there is
# nothing to migrate before install) and pre-upgrade (schema moves before any
# new application pod rolls out).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aidr.component" (dict "root" . "component" $component) }}
  labels:
    {{- include "aidr.labels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ $values.backoffLimit }}
  activeDeadlineSeconds: {{ $values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "aidr.labels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "aidr.podCommon" (dict "root" . "values" (dict)) | nindent 6 }}
      {{- include "aidr.podSecurityContext" (dict "root" . "runAsUser" $values.runAsUser) | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "aidr.image" (dict "root" . "image" $values.image "name" "migrations.image" "defaultTag" true) }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          command: ["/usr/local/bin/aidr-migrate"]
          {{- include "aidr.containerSecurityContext" (dict "root" .) | nindent 10 }}
          env:
            {{- include "aidr.postgresPasswordEnv" . | nindent 12 }}
            - name: PGPASSWORD
              value: $(POSTGRES_PASSWORD)
            - name: PGHOST
              value: {{ include "aidr.dbHost" . | quote }}
            - name: PGPORT
              value: {{ include "aidr.dbPort" . | quote }}
            - name: PGDATABASE
              value: {{ include "aidr.dbName" . | quote }}
            - name: PGUSER
              value: postgres
            - name: PGSSLMODE
              value: {{ include "aidr.dbSslMode" . | quote }}
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: AIDR_MIGRATION_STORAGE_WAIT_SECONDS
              value: {{ $values.storageWaitSeconds | quote }}
          {{- include "aidr.resources" (dict "root" . "component" "migrations" "override" $values.resources) | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
