{{- include "aidr.backup.validate" . }}
{{- if .Values.backup.enabled }}
{{- $component := "backup" -}}
{{- $name := include "aidr.component" (dict "root" . "component" $component) -}}
{{- $values := .Values.backup -}}
{{- if not $values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "aidr.labels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml $values.persistence.accessModes | nindent 4 }}
  {{- with .Values.global.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $values.persistence.size }}
---
{{- end }}
# Logical database backup (custom-format pg_dump) plus, with
# backup.storage.enabled, a tar.gz of the storage.backend=file volume; every
# artifact gets a SHA-256 sidecar. The pod spec is shared with the pre-upgrade
# hook (backup-pre-upgrade-job.yaml) through aidr.backup.podSpec (_backup.tpl).
# Replicate the backup volume off-host (snapshot or object-store copy) and run a
# restore drill; a copy on the same cluster is not a disaster-recovery copy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "aidr.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  schedule: {{ $values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "aidr.labels" (dict "root" . "component" $component) | nindent 12 }}
        spec:
          {{- include "aidr.backup.podSpec" (dict "root" . "suffix" "") | nindent 10 }}
{{- end }}
