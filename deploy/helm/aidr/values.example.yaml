# Singularity AIDR Helm chart: example values for a customer installation.
#
# Copy this file to my-values.yaml, replace every value marked CHANGE, and keep
# it under version control next to your change records (it holds no secret).
# Every key here exists in values.yaml, which documents the full set; anything
# you leave out keeps its secure default.
#
#   helm install aidr deploy/helm/aidr -n aidr -f my-values.yaml
#   helm upgrade aidr deploy/helm/aidr -n aidr -f my-values.yaml --wait --timeout 30m
#
# Upgrade in three commands: see README.md, "Upgrade in 3 commands".

# --- Images --------------------------------------------------------------------
global:
  # CHANGE: your internal registry. Every image (AIDR and upstream) is pulled
  # from here, which is what an air-gapped cluster needs.
  imageRegistry: registry.example.internal
  # Pull secret(s) for that registry, if it needs authentication.
  imagePullSecrets: []
  #  - name: registry-credentials
  # StorageClass for every volume ("" = the cluster default).
  storageClass: ""

# Size of every component without its own `resources`:
# small (evaluation, < 250 seats), medium (< 2,500 seats), large.
resourcesPreset: medium

# --- Addresses -------------------------------------------------------------------
publicUrls:
  # CHANGE: where people open the dashboard, and the API origin agents call.
  # Both must be https:// origins without a path.
  dashboard: https://aidr.example.com
  api: https://api.aidr.example.com

ingress:
  # CHANGE: your ingress controller class.
  className: nginx
  # Secret with the TLS certificate for both hosts. Either create it yourself
  # (bring your own certificate) or let cert-manager create it (below).
  tlsSecretName: aidr-tls
  certManager:
    enabled: false
    clusterIssuer: ""          # e.g. letsencrypt-prod or your internal CA issuer

# --- Credentials -----------------------------------------------------------------
# The chart never creates a password or key. Generate both Secrets once with
#   node deploy/helm/generate-secrets.mjs --output ~/aidr-credentials --namespace aidr ...
# apply them, and keep the credential directory in your vault.
secrets:
  existingSecret: aidr-platform
  functionsExistingSecret: aidr-functions

# --- Database --------------------------------------------------------------------
# The in-cluster Postgres is fine for evaluation and small installs. For
# production, use a managed or operator-run Postgres with point-in-time recovery:
# set postgresql.enabled=false and fill externalDatabase (the password is the
# postgres-password key of secrets.existingSecret).
postgresql:
  enabled: true
externalDatabase:
  host: ""                     # e.g. aidr-db.internal.example.com
  port: 5432
  database: postgres
  sslMode: verify-full         # require, verify-ca or verify-full
  # Needed when postgresql.enabled=false: where the database lives, so the
  # NetworkPolicy lets the AIDR pods reach it.
  networkPolicyCIDRs: []       # e.g. ["10.20.0.0/24"]

# --- Uploaded files ----------------------------------------------------------------
# "file" keeps objects on one volume (one storage replica). For more replicas
# use "s3" with an S3-compatible bucket (and storageEgressCIDRs below).
storage:
  backend: file
  persistence:
    size: 50Gi

# --- E-mail (invitations and password recovery) -----------------------------------
auth:
  smtp:
    host: smtp.example.com     # CHANGE
    port: 587
    user: aidr
    # Key in secrets.existingSecret that holds the SMTP password.
    passwordKey: smtp-password
    adminEmail: security@example.com
    senderName: Singularity AIDR

# --- Backups ---------------------------------------------------------------------
# With backups on, every `helm upgrade` first runs an encrypted backup Job; a
# failed backup stops the upgrade before the database changes.
backup:
  enabled: true
  schedule: "17 2 * * *"
  retentionDays: 14
  preUpgrade:
    # Leave on. On the FIRST upgrade that turns backup.enabled on, the backup
    # volume does not exist yet: pass --set backup.preUpgrade.enabled=false
    # --set migrations.allowWithoutBackup=true once (README, "Upgrade").
    enabled: true
  storage:
    # Also archive the uploaded-files volume (storage.backend=file).
    enabled: true
  encryption:
    # CHANGE: your age public key(s) ("age1..."; create one with
    # `age-keygen -o backup-identity.txt`). Keep the private identity OFF the
    # cluster. Two recipients split custody. This value is a placeholder.
    ageRecipients:
      - age10sncrgwzlg4tsr6y7k9tn5qgqc6je72f9u3vdnwfspjtfreueheshljgj2
  offsite:
    # Recommended: also copy every encrypted backup to a bucket outside the
    # cluster (Secret keys access-key-id and secret-access-key).
    enabled: false
    endpoint: ""               # e.g. https://s3.eu-central-1.amazonaws.com
    bucket: ""
    region: ""
    existingSecret: ""
    egressCIDRs: []            # the object store's CIDRs (TCP 443)
  persistence:
    size: 50Gi

# --- Network ---------------------------------------------------------------------
# Every AIDR pod is default-deny. Open only what you use, as CIDRs.
networkPolicy:
  enabled: true
  # Namespace of your ingress controller.
  ingressControllerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # SMTP relay (auth.smtp.port).
  smtpEgressCIDRs: ["10.30.0.10/32"]                 # CHANGE
  # npm mirror, identity provider, alert webhooks (TCP 443).
  functionsEgressCIDRs: []
  # Public ingress address for the dashboard's certificate check (TCP 443).
  dashboardEgressCIDRs: []
  # S3-compatible storage endpoint when storage.backend=s3 (TCP 443).
  storageEgressCIDRs: []

# Air-gapped clusters: the edge functions download npm packages on first use.
# Point them at your internal npm mirror and allow it in functionsEgressCIDRs.
functions:
  npmRegistry: ""              # e.g. https://npm.internal.example.com/

# --- Optional ----------------------------------------------------------------------
# Alert notifications (Slack, Teams, webhooks, e-mail). Turn on after the
# notification keys exist in the functions Secret.
notifications:
  dispatcher:
    enabled: false

# Retention maintenance: keep on, or data is kept forever.
maintenance:
  enabled: true
