# Singularity AIDR Helm chart values.
#
# Secure defaults: no secret is ever generated by the chart. Every credential is
# read from a Secret you create beforehand (see README.md, "Secrets"), and the
# chart refuses to render without the names of those Secrets and the public
# HTTPS origins of the installation.

global:
  # Registry prefix applied to EVERY image (upstream Supabase images included).
  # Set this to your internal mirror for air-gapped installs.
  imageRegistry: ""
  imagePullSecrets: []
  # StorageClass for all PersistentVolumeClaims ("" = cluster default).
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# Resource preset applied to every component that has no explicit `resources`.
# One of: small (evaluation / <250 seats), medium (<2,500 seats), large.
resourcesPreset: small

# Public HTTPS origins (scheme + host, no path). Both are required.
publicUrls:
  # Where users open the dashboard, e.g. https://aidr.example.com
  dashboard: ""
  # Supabase-compatible API origin agents and the dashboard call, e.g. https://api.aidr.example.com
  api: ""

secrets:
  # REQUIRED. Name of a Secret with the platform credentials. Keys:
  #   postgres-password  jwt-secret  anon-key  service-role-key  metrics-token
  # Generate them with: node deploy/helm/generate-secrets.mjs (see README.md).
  existingSecret: ""
  # REQUIRED. Name of a Secret whose keys are exported verbatim into the edge
  # functions runtime (AIDR_ENTITLEMENT_SIGNING_*, AIDR_REVOCATION_SIGNING_*,
  # AIDR_DELEGATION_SIGNING_*, AIDR_PACK_MASTER_KEY_B64,
  # AIDR_PACK_DOWNLOAD_GRANT_SECRET, AIDR_DEVICE_START_INGRESS_SECRET,
  # AIDR_NOTIFICATION_ENCRYPTION_KEYS, AIDR_NOTIFICATION_DISPATCH_TOKEN; optional
  # AIDR_SHARED_PACK_KEYS for shared/vendor premium intel packs).
  functionsExistingSecret: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # No AIDR component calls the Kubernetes API.
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

commonLabels: {}
commonAnnotations: {}

# ---------------------------------------------------------------------------
# Dashboard (AIDR web console, deploy/dashboard/server.mjs)
# ---------------------------------------------------------------------------
dashboard:
  image:
    registry: ""
    repository: aidr/dashboard
    tag: ""            # defaults to the chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources: {}
  runAsUser: 1000      # "node" user of node:24-alpine
  authMethods: password
  # Show the work-email OIDC single sign-on form on the sign-in page
  # (tenant owners configure the provider in the dashboard; docs/operations/onprem-sso.md).
  oidcSso: false
  saml:
    providers: ""
    providerId: ""
    domain: ""
  sentry:
    dsn: ""
    environment: production
    tracesSampleRate: "0"
  # Kubernetes routes traffic on /livez. /readyz aggregates the seven operator
  # checks (database, storage, functions, signing, backup, queue, certificate)
  # and needs the readiness evidence worker; point external monitoring at it.
  readinessProbePath: /livez
  # Optional PVC holding readiness evidence (signing.json, backup.json,
  # queue.json) written by the readiness evidence worker. Empty = emptyDir.
  healthEvidence:
    existingClaim: ""
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# API gateway (Envoy; routes /auth/v1, /rest/v1, /storage/v1, /functions/v1)
# ---------------------------------------------------------------------------
apiGateway:
  image:
    registry: docker.io
    repository: envoyproxy/envoy
    tag: v1.39.2
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources: {}
  runAsUser: 101       # "envoy" user of the upstream image
  maxDownstreamConnections: 30000
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}

# ---------------------------------------------------------------------------
# Auth (Supabase GoTrue)
# ---------------------------------------------------------------------------
auth:
  image:
    registry: docker.io
    repository: supabase/gotrue
    tag: v2.197.0
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources: {}
  runAsUser: 1000      # "supabase" user of the upstream image
  jwtExpirySeconds: 3600
  # Self-hosted AIDR is invite-only: public sign-up stays disabled.
  disableSignup: true
  smtp:
    host: ""
    port: 587
    user: ""
    # Key in secrets.existingSecret holding the SMTP password ("" = no password).
    passwordKey: ""
    adminEmail: ""
    senderName: AIDR
  # SAML 2.0 single sign-on in GoTrue (docs/operations/onprem-sso.md). The
  # signing key (RSA-2048, PKCS#1 DER, base64) lives in secrets.existingSecret
  # under privateKeyKey; generate it on an administrator host, never in values.
  saml:
    enabled: false
    privateKeyKey: ""
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# REST (PostgREST)
# ---------------------------------------------------------------------------
rest:
  image:
    registry: docker.io
    repository: postgrest/postgrest
    tag: v14.17
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources: {}
  runAsUser: 1000      # image USER of postgrest/postgrest
  dbSchemas: public,graphql_public
  maxRows: 1000
  # libpq parameters appended to PGRST_DB_URI so pooled connections on a dead
  # network path are detected instead of waiting out TCP retransmission backoff
  # (docs/production-readiness/load-soak-drill-2026-10-11.md, O2 addendum).
  # Keepalives probe idle connections (first probe after 30 s idle, then every
  # 10 s, dropped after 3 misses); tcp_user_timeout drops a connection whose sent
  # data stays unacknowledged for 20 s. Neither limits query or request
  # duration. Set to "" to use libpq/kernel defaults.
  dbConnectionParams: keepalives=1&keepalives_idle=30&keepalives_interval=10&keepalives_count=3&tcp_user_timeout=20000
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ---------------------------------------------------------------------------
# Storage (Supabase storage-api; pack and audit-export objects)
# ---------------------------------------------------------------------------
storage:
  image:
    registry: docker.io
    repository: supabase/storage-api
    tag: v1.80.2
    digest: ""
    pullPolicy: IfNotPresent
  resources: {}
  runAsUser: 1000      # "node" user of the image (upstream runs it as root)
  fileSizeLimit: 52428800
  # "file" keeps objects on a PVC (single replica). "s3" uses an S3-compatible
  # bucket and allows several replicas. backup.* covers the "file" volume only
  # with backup.storage.enabled; an S3 bucket is never backed up by this chart.
  backend: file
  replicaCount: 1
  persistence:
    size: 20Gi
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""
  s3:
    bucket: ""
    endpoint: ""
    region: ""
    forcePathStyle: true
    # Secret with keys access-key-id and secret-access-key.
    existingSecret: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ---------------------------------------------------------------------------
# Edge functions runtime (image built by deploy/helm/build-images.mjs)
# ---------------------------------------------------------------------------
functions:
  image:
    registry: ""
    repository: aidr/edge-functions
    tag: ""            # defaults to the chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources: {}
  runAsUser: 1000      # set by images/edge-functions.Dockerfile (upstream runs as root)
  # npm registry mirror for the functions' npm: imports (air-gapped installs).
  npmRegistry: ""
  # On-prem identity provider (Keycloak, ADFS) for tenant OIDC SSO
  # (docs/operations/onprem-sso.md).
  identityProvider:
    # Internal CA that signed the IdP's TLS certificate: a ConfigMap holding PEM
    # CA certificates. It is ADDED to the public roots (DENO_TLS_CA_STORE=
    # mozilla,system with SSL_CERT_FILE), never substituted for them.
    caBundle:
      existingConfigMap: ""
      key: ca.crt
    # Exact host[:port] names the oidc-sso function may reach on private
    # (RFC 1918 / CGNAT / ULA) addresses, e.g. ["keycloak.corp.example:8443"].
    # Empty keeps the public-only egress policy. Also allow the traffic in
    # networkPolicy.identityProviderEgress.
    internalHosts: []
  billingProvider: ""
  # Outbound AIDR mail (alert channels, invitations, governance digest).
  # With auth.smtp.host set, the functions reuse that relay (SMTP provider).
  mail:
    provider: ""          # "" (automatic) | smtp | resend | none
    smtpSecurity: ""      # "" (465 => tls, else starttls) | starttls | tls | none
    # Key in secrets.existingSecret holding base64 of the relay's internal CA
    # PEM bundle ("" = system roots).
    smtpCaSecretKey: ""
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# In-cluster single-instance Postgres (supabase/postgres). Suitable for
# evaluation and small installs. For production use externalDatabase with a
# managed or operator-run HA cluster (see docs/operations/kubernetes.md).
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: supabase/postgres
    tag: 17.11.0.004
    digest: ""
    pullPolicy: IfNotPresent
  resources: {}
  runAsUser: 100       # "postgres" user of supabase/postgres 17.11.0.004
  fsGroup: 101
  persistence:
    size: 20Gi
    accessModes: ["ReadWriteOnce"]
  configPersistence:
    size: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# A Supabase-compatible Postgres 15+ (roles authenticator, supabase_auth_admin,
# supabase_storage_admin and schemas auth/storage) reached over TLS.
externalDatabase:
  host: ""
  port: 5432
  database: postgres
  sslMode: require
  # CIDRs the NetworkPolicy lets components reach on `port` (required when
  # networkPolicy.enabled and postgresql.enabled=false).
  networkPolicyCIDRs: []

# ---------------------------------------------------------------------------
# Migrations Job (Helm hook; ordered, checksum-verified, idempotent)
# ---------------------------------------------------------------------------
migrations:
  enabled: true
  image:
    registry: ""
    repository: aidr/migrations
    tag: ""            # defaults to the chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  resources: {}
  runAsUser: 70        # "postgres" user of postgres:*-alpine
  # Seconds to wait for Storage to create storage.buckets on first boot.
  storageWaitSeconds: 600
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  # `helm upgrade` refuses to render while the pre-upgrade migration would run
  # without a fresh backup (backup.enabled + backup.preUpgrade.enabled). Set
  # true ONLY after taking your own backup (e.g. a managed-database snapshot).
  # Fresh installs are unaffected: the post-install run has nothing to lose.
  allowWithoutBackup: false

# ---------------------------------------------------------------------------
# Optional backups: pg_dump (+ file storage archive) CronJob and pre-upgrade hook
# ---------------------------------------------------------------------------
# Backed up: the database (custom-format pg_dump) and, with storage.enabled,
# the storage.backend=file object volume (tar.gz), each sealed with age to
# backup.encryption.ageRecipients and optionally copied off-cluster
# (backup.offsite). NOT backed up: an S3 bucket (use bucket versioning/
# replication), the Secrets the chart consumes (keep the credential directory
# from generate-secrets.mjs), the in-cluster Postgres pgsodium root key (export
# it once, README "Key material") and the age identity (keep it off-cluster).
# Every artifact has a .sha256 sidecar.
#
# Off by default because it needs an operator decision the chart cannot make
# (where the decryption identity lives, which bucket holds the off-cluster
# copy). With externalDatabase, the provider's PITR is the primary backup.
backup:
  enabled: false
  schedule: "17 2 * * *"
  retentionDays: 14
  # Deadline for one backup run (CronJob run and pre-upgrade hook).
  activeDeadlineSeconds: 3600
  preUpgrade:
    # Pre-upgrade hook Job (hook-weight -10, before the migrations Job at 0):
    # a failed backup aborts `helm upgrade` before the schema changes. The
    # backup volume must already exist: on the upgrade that FIRST enables
    # backup.enabled, set preUpgrade.enabled=false and
    # migrations.allowWithoutBackup=true once (or point persistence.existingClaim
    # at a pre-created claim).
    enabled: true
  storage:
    # Archive the storage.backend=file volume (mounted read-only) next to the
    # dump. A ReadWriteOnce volume can only be mounted on the node that runs the
    # storage pod, so the backup pod gets a required podAffinity to it (the
    # backup volume must be attachable on that node/zone too); ReadWriteMany
    # needs no affinity; ReadWriteOncePod is refused. Only GNU tar keeps the
    # objects' user.* xattrs (content-type/cache-control); the default
    # aidr/migrations image has busybox tar, which the .manifest records.
    enabled: false
    # With backup.enabled and storage.backend=file, rendering fails unless
    # storage.enabled or this acknowledgement is set (dev/evaluation only:
    # a restore then loses every stored object).
    acknowledgeNotBackedUp: false
  encryption:
    # REQUIRED with backup.enabled: age X25519 recipients (public keys,
    # "age1..."; `age-keygen -o backup-identity.txt` prints one). Every dump
    # and archive is streamed through age, so no plaintext reaches the volume.
    # Keep the identity (private key) OFF the cluster, e.g. in your password
    # vault or HSM-backed escrow; list two recipients to split custody.
    ageRecipients: []
    # Dev/evaluation only: write plaintext dumps when no recipient is set.
    allowPlaintext: false
  offsite:
    # Copy every finished artifact to an S3-compatible bucket outside the
    # cluster (HTTPS PUT, SigV4, path-style). Requires encryption. Use a bucket
    # with object lock/versioning and a lifecycle rule for retention; the
    # backup.retentionDays pruning applies to the in-cluster volume only.
    enabled: false
    endpoint: ""        # https://s3.eu-central-1.amazonaws.com
    bucket: ""
    region: ""
    prefix: "aidr/"
    # Secret with keys access-key-id and secret-access-key (write-only
    # credentials: PutObject on the prefix is enough).
    existingSecret: ""
    # CIDRs (TCP 443) of the object store, required when networkPolicy.enabled.
    egressCIDRs: []
  image:
    registry: ""
    repository: aidr/migrations   # ships pg_dump matching the server major version
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources: {}
  runAsUser: 70
  persistence:
    size: 50Gi
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""

# ---------------------------------------------------------------------------
# Retention maintenance CronJob (docs/control-plane.md, "Retention maintenance")
# ---------------------------------------------------------------------------
# Hourly run of scripts/deployment-maintenance.mjs (shipped in a ConfigMap):
# deletes data past each tenant's retention (telemetry, approval requests,
# expired invitations, billing webhooks, AI governance records), GA trial
# subjects, public waitlist sign-ups after 365 days, expired temporary audit
# exports and rate-limit counters, honouring legal holds, then dispatches due
# governance digests. It reaches only the in-cluster API gateway, with the
# service-role key from secrets.existingSecret. Keep it on: without it data is
# kept indefinitely regardless of the retention owners configure.
maintenance:
  enabled: true
  schedule: "11 * * * *"
  # false = dry run (counts only, deletes nothing).
  apply: true
  activeDeadlineSeconds: 1800
  image:
    registry: ""
    repository: aidr/dashboard   # ships Node.js 24
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources: {}
  runAsUser: 1000

# ---------------------------------------------------------------------------
# Alert notifications (Settings -> Notifications; docs/control-plane.md)
# ---------------------------------------------------------------------------
# Channels are encrypted with AIDR_NOTIFICATION_ENCRYPTION_KEYS and the
# dispatcher authenticates with AIDR_NOTIFICATION_DISPATCH_TOKEN; both keys
# must exist in secrets.functionsExistingSecret (generate-secrets.mjs writes
# them). Deliveries leave from the functions pods: allow Slack, Teams, your
# webhook receivers and mail provider (or an egress proxy) in
# networkPolicy.functionsEgressCIDRs.
notifications:
  dispatcher:
    # Off by default so an upgrade whose functions Secret predates alert
    # integrations does not start failing jobs. Enable after adding the keys.
    enabled: false
    schedule: "* * * * *"
    image:
      registry: ""
      repository: aidr/dashboard   # ships Node.js; runs a one-shot fetch
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    resources: {}
    runAsUser: 1000

# ---------------------------------------------------------------------------
# Central SIEM forwarding (docs/contracts/siem-forwarding.md)
# ---------------------------------------------------------------------------
siem:
  # Let destinations opt in to RFC 1918 / ULA collectors (typical on-prem
  # QRadar, Wazuh, Splunk). Loopback and link-local stay refused.
  allowPrivateNetworks: false
  forwarder:
    # Off by default for the same reason as the alert dispatcher: it needs
    # AIDR_NOTIFICATION_DISPATCH_TOKEN and AIDR_NOTIFICATION_ENCRYPTION_KEYS in
    # the functions Secret. Collector egress: networkPolicy.siemEgress.
    enabled: false
    schedule: "* * * * *"
    image:
      registry: ""
      repository: aidr/dashboard   # ships Node.js; runs a one-shot fetch
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    resources: {}
    runAsUser: 1000

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: ""
  annotations: {}
  # Secret holding the TLS certificate for both hosts. With certManager.enabled
  # cert-manager creates it; otherwise create it yourself (BYO certificate).
  tlsSecretName: ""
  certManager:
    enabled: false
    clusterIssuer: ""
    issuer: ""

# ---------------------------------------------------------------------------
# NetworkPolicy: default-deny for every AIDR pod plus the minimum allows.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Namespace(s) of the ingress controller allowed to reach dashboard/gateway.
  ingressControllerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  ingressControllerPodSelector: {}
  # DNS resolver pods (kube-dns / CoreDNS).
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    matchLabels:
      k8s-app: kube-dns
  # Extra egress CIDRs (port 443) for the functions runtime, e.g. an npm mirror,
  # identity provider or billing provider. Empty = no Internet egress.
  functionsEgressCIDRs: []
  # Internal identity provider endpoints for the functions runtime on any port,
  # e.g. [{cidr: 10.20.30.40/32, port: 8443}] for Keycloak.
  identityProviderEgress: []
  # Egress CIDRs (auth.smtp.port) for the SMTP relay used by auth e-mails and,
  # when auth.smtp.host is set, by the functions' alert and invitation mail.
  smtpEgressCIDRs: []
  # SIEM collectors the functions forward to: [{ cidr: 10.20.0.0/24, port: 6514 }].
  # Syslog UDP needs protocol: UDP. Empty = no collector reachable.
  siemEgress: []
  # CIDRs (port 443) the dashboard may reach for the public certificate probe
  # and Sentry. Empty = none (the certificate check then reports failed).
  dashboardEgressCIDRs: []
  # CIDRs (port 443) for an S3-compatible storage endpoint when storage.backend=s3.
  storageEgressCIDRs: []

# ---------------------------------------------------------------------------
# Optional AI Security Posture scanner (docker-compose.posture-scanner.yml
# equivalent). The pre-rename `aig` key is refused with a pointer here.
# ---------------------------------------------------------------------------
postureScanner:
  enabled: false
  sourceVersion: v4.6.1-aidr.2
  timezone: UTC
  # REQUIRED when enabled. Secret keys: agent-shared-secret, bridge-jwt-secret,
  # task-postgres-dsn.
  existingSecret: ""
  # REQUIRED when enabled. Secret with key signing-public.pem (Ed25519 SPKI PEM).
  signingPublicKeySecret: ""
  # REQUIRED when enabled. ConfigMap built from packages/core/src/generated/.
  dataConfigMap: ""
  trustedSigningKeyId: ""
  trustedSigningPublicKeySha256: ""
  expectedDataBundleId: ""
  expectedSourceCommit: ""
  # REQUIRED when enabled. Reviewed egress proxy for remote scan traffic.
  egressProxy:
    url: ""
    cidrs: []
    port: 3128
  server:
    image:
      registry: ""
      repository: aidr/posture-scanner-server
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    resources: {}
    persistence:
      dbSize: 5Gi
      logsSize: 2Gi
  agent:
    image:
      registry: ""
      repository: aidr/posture-scanner-agent
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    # The pinned source cannot prove distinct worker identities; keep one.
    replicaCount: 1
    resources: {}
    checkerDataSize: 2Gi
  bridge:
    image:
      registry: ""
      repository: aidr/posture-scanner-bridge
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    resources: {}
    # Only "broker" (tenant-bound, scoped JWTs). The bridge's api_key mode takes
    # the tenant from a caller header, so the chart refuses it.
    authMode: broker
    jwtIssuer: ""
    jwtAudience: ""
    corsOrigins: ""
    minWorkers: 1
    # Pods with this label (any namespace in clientNamespaceSelector) may call the bridge.
    clientPodLabel:
      aidr.singularity/posture-scanner-client: "true"
    clientNamespaceSelector: {}
    stateSize: 1Gi
  # Shared upload volume (bridge writes, server writes, agent reads). Needs
  # ReadWriteMany unless all posture scanner pods are scheduled on one node.
  uploads:
    size: 10Gi
    accessModes: ["ReadWriteMany"]
    existingClaim: ""

# ---------------------------------------------------------------------------
# Privacy gateway (optional; packages/privacy aidr-privacy-service)
#
# An EXPLICIT egress API: clients send POST /v1/egress over mutual TLS and the
# gateway applies the privacy policy before it calls ONE approved provider with a
# credential only the gateway holds. It is not a transparent proxy and inspects
# nothing that is not addressed to it: configure clients to use it and remove
# their direct provider access with NetworkPolicy, an egress firewall or MDM.
# The chart refuses to render it without mutual TLS, its Secrets, an approved
# model volume and an egress allow-list. See deploy/privacy-gateway/README.md.
# ---------------------------------------------------------------------------
privacyGateway:
  enabled: false
  image:
    registry: ""
    repository: aidr/privacy-gateway
    tag: ""            # defaults to the chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  resources: {}
  mtls:
    # Must stay true. The service only serves mutually authenticated TLS; the
    # chart fails rather than render a gateway without it.
    enabled: true
    # REQUIRED. Secret with keys tls.crt (server leaf), tls.key and ca.crt (the
    # CA that issues enrolled client certificates).
    existingSecret: ""
  # REQUIRED. Secret whose keys are the *Ref names used in serviceConfig
  # (provider API key, OIDC client secret, broker key, encryption/audit keys).
  # Mounted read-only as files; never exported as environment variables.
  existingSecret: ""
  # REQUIRED. ConfigMap holding the public trust files that serviceConfig paths
  # reference under /etc/aidr-privacy/trust (IdP/broker CAs, broker client
  # certificate, signed policy and policy verification keys). Keys are file names.
  trustConfigMap: ""
  models:
    # REQUIRED. PVC holding the independently approved NER model and manifest,
    # mounted read-only at /opt/aidr-models.
    existingClaim: ""
  persistence:
    # Durable SQLite control state (dispatch ledger, audit): one replica only.
    size: 5Gi
    existingClaim: ""
  service:
    # ClusterIP for in-cluster clients. LoadBalancer/NodePort expose the mTLS
    # port directly (TLS passthrough); list the client ranges in clientCIDRs.
    type: ClusterIP
    port: 8443
    annotations: {}
  # In-cluster callers: pods with this label in namespaces matched by
  # clientNamespaceSelector ({} = this release's namespace only).
  clientPodLabel:
    aidr.singularity/privacy-gateway-client: "true"
  clientNamespaceSelector: {}
  # Out-of-cluster callers (workstation ranges) allowed to reach port 8443.
  clientCIDRs: []
  egress:
    # REQUIRED. CIDRs (TCP 443) of the provider, identity provider and session
    # broker. Default routes and prefixes shorter than /8 are refused.
    # NetworkPolicy is IP-based and provider addresses change: pair it with an
    # FQDN-aware CNI policy or an SNI-filtering egress firewall.
    cidrs: []
  # The administrator service JSON (packages/privacy/examples/platform/
  # service-config.example.json) WITHOUT tls, host, port, secretStore,
  # databasePath and documents: the chart owns those. Paths must sit under
  # /etc/aidr-privacy/trust (trustConfigMap) and /opt/aidr-models (models PVC).
  serviceConfig: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
