# On-prem / air-gapped reference ingress: dashboard + API vhosts on one host.
#
# Include this file in the nginx `http` context (for example
# /etc/nginx/conf.d/aidr.conf). Before use replace:
#   - aidr.customer.example / api.aidr.customer.example with the dashboard and API
#     hostnames given to deployment-prepare (--dashboard-url / --supabase-url);
#   - REPLACE_WITH_PRIVATE_32_BYTE_MINIMUM_TOKEN with the device-start proxy token
#     from the generated .env.ingress (see deploy/ingress/README.md).
# Protect this file from non-administrators: it carries the proxy token.
#
# Certificates are customer supplied (BYO / internal CA). Install and rotate them
# with the static mode of the renewal script, which validates chain, hostname,
# validity and key match, installs into the paths below and reloads nginx only
# after `nginx -t` succeeds:
#   node scripts/deployment-tls-renew.mjs --mode static --hostname aidr.customer.example \
#     --cert-file /secure-delivery/aidr-fullchain.pem --key-file /secure-delivery/aidr-key.pem
#   node scripts/deployment-tls-renew.mjs --mode static --hostname api.aidr.customer.example \
#     --cert-file /secure-delivery/api-fullchain.pem --key-file /secure-delivery/api-key.pem
# (default --tls-dir /etc/aidr/tls). The dashboard (127.0.0.1:8080), API gateway
# (127.0.0.1:8000), Studio admin listener (127.0.0.1:8001, never proxied here) and
# device-start signer (127.0.0.1:8191) listen on loopback only, as generated by
# deployment-prepare. Requires nginx 1.19.4 or newer
# (ssl_reject_handshake).

map $http_upgrade $aidr_connection_upgrade {
    default upgrade;
    ""      close;
}

server_tokens off;

# Unknown hostnames are dropped on both ports; no certificate is presented.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# Plain HTTP only redirects to HTTPS for the two known hosts.
server {
    listen 80;
    server_name aidr.customer.example api.aidr.customer.example;
    location / {
        return 308 https://$host$request_uri;
    }
}

# ── Dashboard ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name aidr.customer.example;
    if ($host != "aidr.customer.example") { return 444; }

    ssl_certificate /etc/aidr/tls/live/aidr.customer.example/fullchain.pem;
    ssl_certificate_key /etc/aidr/tls/live/aidr.customer.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AIDRTLS:10m;
    ssl_session_tickets off;

    # Security headers are set at server level only: an add_header inside a
    # location would silently drop these. The dashboard server sets its own
    # Content-Security-Policy, X-Frame-Options and Cache-Control.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 1m;

    # Metrics are scraped on loopback with their bearer token, never through
    # the public ingress.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}

# ── API (Supabase gateway + Edge Functions) ────────────────────────────────
server {
    listen 443 ssl;
    server_name api.aidr.customer.example;
    if ($host != "api.aidr.customer.example") { return 444; }

    ssl_certificate /etc/aidr/tls/live/api.aidr.customer.example/fullchain.pem;
    ssl_certificate_key /etc/aidr/tls/live/api.aidr.customer.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AIDRTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Signed pack bundles and audit exports stream through the API.
    client_max_body_size 64m;

    # No real_ip/X-Forwarded-For trust is enabled in this reference. $remote_addr
    # is the actual TLS peer. If a load balancer fronts nginx, configure and
    # validate its exact source ranges before treating a forwarded address as a
    # user IP.
    location ^~ /functions/v1/device-start {
        client_max_body_size 4k;
        proxy_request_buffering on;
        proxy_read_timeout 6s;
        proxy_pass http://127.0.0.1:8191;

        # Send a fresh allowlist of headers to the signer; client-supplied
        # x-aidr-client-*, x-forwarded-for and proxy credentials are dropped.
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection close;
        proxy_set_header X-AIDR-Proxy-Token "REPLACE_WITH_PRIVATE_32_BYTE_MINIMUM_TOKEN";
        proxy_set_header X-AIDR-Proxy-Request-ID $request_id;
        proxy_set_header X-AIDR-Proxy-Client-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
    }

    # Only the Supabase API prefixes reach the gateway. Supabase Studio is never
    # proxied from this host: the gateway serves it on a separate listener
    # published on 127.0.0.1:8001 only, reached by operators over an SSH tunnel
    # (deploy/onprem/README.md, "Supabase Studio (operator-only)").
    location ~ ^/((auth|rest|storage|functions|realtime|graphql)/v1(/|$)|pg/|\.well-known/oauth-authorization-server$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Realtime uses WebSocket upgrades on /realtime/v1/.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aidr_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
