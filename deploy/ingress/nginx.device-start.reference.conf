# Reference server block. Replace the hostname, certificate paths and the
# private proxy token before use; protect this file from non-administrators.
# This example terminates TLS on the same host as the loopback signer and API.
server {
    listen 80 default_server;
    server_name api.aidr.customer.example;
    if ($host != "api.aidr.customer.example") { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aidr-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://api.aidr.customer.example$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name api.aidr.customer.example;
    if ($host != "api.aidr.customer.example") { return 444; }
    ssl_certificate /etc/letsencrypt/live/api.aidr.customer.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aidr.customer.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # No real_ip/X-Forwarded-For trust is enabled in this reference. $remote_addr
    # is the actual TLS peer. If a CDN/LB fronts Nginx, configure and validate
    # its exact source ranges before treating its forwarded address as a user IP.
    location ^~ /functions/v1/device-start {
        client_max_body_size 4k;
        proxy_request_buffering on;
        proxy_read_timeout 6s;
        proxy_pass http://127.0.0.1:8191;

        # Send a fresh allowlist of headers to the signer. In particular, all
        # client-supplied x-aidr-client-*, x-forwarded-for and proxy credentials
        # are removed instead of forwarded. The signer repeats this boundary.
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection close;
        proxy_set_header X-AIDR-Proxy-Token "REPLACE_WITH_PRIVATE_32_BYTE_MINIMUM_TOKEN";
        # Nginx generates this value; the signer rejects a duplicate for 60 s.
        proxy_set_header X-AIDR-Proxy-Request-ID $request_id;
        proxy_set_header X-AIDR-Proxy-Client-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
    }

    # Other API routes still go to the local control plane. The Edge Function
    # independently rejects any unsigned device-start request that bypasses
    # this routing rule.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
