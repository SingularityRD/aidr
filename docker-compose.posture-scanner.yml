# =============================================================================
# AI Security Posture scanner sidecar stack
# =============================================================================
# Runs the posture scanner alongside AIDR. Four services (their Compose names
# and volume names are kept stable so existing installations keep their data):
#   aig-server  — Go backend (CVE scans, MCP scans, task management)
#   aig-agent   — Go agent (WebSocket worker for scan execution)
#   aig-bridge  — Python/FastAPI (clean REST API consumed by AIDR core)
#   aig-egress  — pinned deny-by-default forward proxy for remote scan traffic
#
# Single-host defaults: SQLite task registry, HA not required, and the shipped
# egress gateway (deploy/onprem/egress). See .env.posture-scanner.example for
# the PostgreSQL HA switch. `scripts/deployment-prepare.mjs
# --with-posture-scanner` merges this stack into a prepared on-prem
# installation.
#
# Operator settings use POSTURE_SCANNER_* names. Each one falls back to its
# legacy AIG_* name so an existing .env keeps working; the containers still
# receive the AIG_* variables the scanner services read.
#
# Attribution: AI-Infra-Guard by Tencent Zhuque Lab (Apache 2.0).
# See vendor/ai-infra-guard/NOTICE for requirements.
# =============================================================================

services:
  # ── AIG Go Backend Server ────────────────────────────────────────────────
  aig-server:
    image: aidr-aig-server:${POSTURE_SCANNER_SOURCE_VERSION:-${AIG_SOURCE_VERSION:-v4.6.1-aidr.1}}
    build:
      context: ./vendor/ai-infra-guard
      dockerfile: Dockerfile
    container_name: aidr-aig-server
    # The pinned checkout contains a CRLF start.sh and uses a legacy
    # /ai-infra-guard volume path. Start the binary directly against AIDR's
    # mounted /app paths so the Windows checkout and Linux image agree.
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /app/db /app/uploads /app/logs &&
        touch /app/logs/trpc.log &&
        exec /app/ai-infra-guard webserver --server 0.0.0.0:8088
    # Never publish the unauthenticated upstream API/worker WebSocket. Only the
    # authenticated bridge is reachable from the host.
    expose:
      - "8088"
    environment:
      - APP_ENV=production
      - UPLOAD_DIR=/app/uploads
      - DB_PATH=/app/db/tasks.db
      - TZ=${POSTURE_SCANNER_TZ:-${AIG_TZ:-Asia/Shanghai}}
      - AIG_AGENT_SHARED_SECRET=${POSTURE_SCANNER_AGENT_SHARED_SECRET:-${AIG_AGENT_SHARED_SECRET:?set POSTURE_SCANNER_AGENT_SHARED_SECRET}}
      - AIG_DATA_ROOT=/app/data
      - AIG_DATA_MANIFEST_PATH=/app/aig-manifest/aig-data-manifest.json
      - AIG_SIGNING_PUBLIC_KEY_PATH=/run/secrets/aig-signing-public.pem
      - AIG_TRUSTED_SIGNING_KEY_ID=${POSTURE_SCANNER_TRUSTED_SIGNING_KEY_ID:-${AIG_TRUSTED_SIGNING_KEY_ID:?set POSTURE_SCANNER_TRUSTED_SIGNING_KEY_ID}}
      - AIG_TRUSTED_SIGNING_PUBLIC_KEY_SHA256=${POSTURE_SCANNER_TRUSTED_SIGNING_PUBLIC_KEY_SHA256:-${AIG_TRUSTED_SIGNING_PUBLIC_KEY_SHA256:?set POSTURE_SCANNER_TRUSTED_SIGNING_PUBLIC_KEY_SHA256}}
      - AIG_EXPECTED_DATA_BUNDLE_ID=${POSTURE_SCANNER_EXPECTED_DATA_BUNDLE_ID:-${AIG_EXPECTED_DATA_BUNDLE_ID:?set POSTURE_SCANNER_EXPECTED_DATA_BUNDLE_ID}}
      - AIG_EXPECTED_SOURCE_COMMIT=${POSTURE_SCANNER_EXPECTED_SOURCE_COMMIT:-${AIG_EXPECTED_SOURCE_COMMIT:?set POSTURE_SCANNER_EXPECTED_SOURCE_COMMIT}}
    volumes:
      - aig-db:/app/db
      - aig-logs:/app/logs
      - aig-uploads:/app/uploads
      - type: bind
        source: ./packages/core/src/generated
        target: /app/aig-manifest
        read_only: true
      - type: bind
        source: ${POSTURE_SCANNER_SIGNING_PUBLIC_KEY_HOST_PATH:-${AIG_SIGNING_PUBLIC_KEY_HOST_PATH:?set POSTURE_SCANNER_SIGNING_PUBLIC_KEY_HOST_PATH}}
        target: /run/secrets/aig-signing-public.pem
        read_only: true
    networks:
      - aidr-aig-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    healthcheck:
      # The static UI can be served while the signed runtime dataset is
      # unusable. Probe the authenticated runtime-evidence endpoint instead.
      # Worker liveness remains part of the bridge /readyz check so this probe
      # does not deadlock the worker's service_healthy dependency.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "X-AIG-Agent-Token: $${AIG_AGENT_SHARED_SECRET}"
          http://localhost:8088/api/v1/internal/readiness
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Resource limits for production deployments
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
          pids: 256
        reservations:
          cpus: "0.5"
          memory: "512M"

  # ── AIG Agent Worker ─────────────────────────────────────────────────────
  aig-agent:
    image: aidr-aig-agent:${POSTURE_SCANNER_SOURCE_VERSION:-${AIG_SOURCE_VERSION:-v4.6.1-aidr.1}}
    build:
      context: ./vendor/ai-infra-guard
      dockerfile: Dockerfile_Agent
    environment:
      - TZ=${POSTURE_SCANNER_TZ:-${AIG_TZ:-Asia/Shanghai}}
      - AIG_SERVER=aig-server:8088
      - AIG_AGENT_VERSION=${POSTURE_SCANNER_SOURCE_VERSION:-${AIG_SOURCE_VERSION:-v4.6.1-aidr.1}}
      - AIG_AGENT_SHARED_SECRET=${POSTURE_SCANNER_AGENT_SHARED_SECRET:-${AIG_AGENT_SHARED_SECRET:?set POSTURE_SCANNER_AGENT_SHARED_SECRET}}
      - AIG_UPLOAD_ROOT=/app/uploads
      - AIG_WORK_DIR=/work
      # Remote scan traffic must traverse the egress gateway (the shipped
      # aig-egress proxy by default). Keep AIG control-plane traffic on the
      # private compose network.
      - HTTP_PROXY=${BRIDGE_EGRESS_PROXY_URL:-http://aig-egress:3128}
      - HTTPS_PROXY=${BRIDGE_EGRESS_PROXY_URL:-http://aig-egress:3128}
      - NO_PROXY=${POSTURE_SCANNER_NO_PROXY:-${AIG_NO_PROXY:-aig-server,localhost,127.0.0.1}}
      # The pinned AIG worker imports a pre-rename MCP SDK symbol. The tracked shim is
      # loaded via PYTHONPATH until the upstream import is fixed.
      - PYTHONPATH=/app/aig-compat
    volumes:
      # Source-scan uploads are created by aig-server and consumed by the
      # worker.  Keep the worker read-only so a scan cannot mutate the upload
      # store or escape the configured source root.
      - aig-uploads:/app/uploads:ro
      - aig-checker-data:/api-checker-data
      # The pinned AIG worker imports a pre-rename MCP SDK symbol. The tracked shim is
      # loaded via PYTHONPATH until the upstream import is fixed.
      - ./services/aig-bridge/aig_compat:/app/aig-compat:ro
    # The upstream image historically requested SYS_ADMIN/unconfined for its
    # browser helper.  Those privileges are not acceptable for customer data;
    # scans must run in a separately attested VM/gVisor/Kata worker if the
    # restricted profile cannot execute a given capability.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g
      - /run:rw,noexec,nosuid,nodev,size=64m
      - /work:rw,noexec,nosuid,nodev,size=2g,uid=1000,gid=1000,mode=0700
    shm_size: "2gb"
    networks:
      - aidr-aig-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      aig-server:
        condition: service_healthy
      aig-egress:
        condition: service_healthy
    deploy:
      # The pinned source does not expose unique live worker identities. Keep one
      # worker until registration and readiness can prove distinct workers.
      replicas: ${POSTURE_SCANNER_AGENT_COUNT:-${AIG_AGENT_COUNT:-1}}
      resources:
        limits:
          cpus: "4"
          memory: "4G"
          pids: 1024
        reservations:
          cpus: "1"
          memory: "1G"

  # ── AIG Bridge (Python/FastAPI) ──────────────────────────────────────────
  aig-bridge:
    image: aidr-aig-bridge:${POSTURE_SCANNER_BRIDGE_IMAGE_TAG:-${AIG_BRIDGE_IMAGE_TAG:-local}}
    build:
      context: ./services/aig-bridge
      dockerfile: Dockerfile
    container_name: aidr-aig-bridge
    ports:
      - "${POSTURE_SCANNER_BIND_ADDRESS:-${AIG_BIND_ADDRESS:-127.0.0.1}}:${POSTURE_SCANNER_BRIDGE_PORT:-${AIG_BRIDGE_PORT:-8099}}:8099"
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8099
      - BRIDGE_LOG_LEVEL=${BRIDGE_LOG_LEVEL:-INFO}
      - TZ=${POSTURE_SCANNER_TZ:-${AIG_TZ:-Asia/Shanghai}}
      - BRIDGE_AIG_URL=http://aig-server:8088
      - AIG_SOURCE_VERSION=${POSTURE_SCANNER_SOURCE_VERSION:-${AIG_SOURCE_VERSION:-v4.6.1-aidr.1}}
      - AIG_AGENT_SHARED_SECRET=${POSTURE_SCANNER_AGENT_SHARED_SECRET:-${AIG_AGENT_SHARED_SECRET:?set POSTURE_SCANNER_AGENT_SHARED_SECRET}}
      - AIG_MIN_WORKERS=${POSTURE_SCANNER_MIN_WORKERS:-${AIG_MIN_WORKERS:-1}}
      - AIG_DATA_MANIFEST_PATH=/app/aig-data/aig-data-manifest.json
      - AIG_SIGNING_PUBLIC_KEY_PATH=/run/secrets/aig-signing-public.pem
      - AIG_TRUSTED_SIGNING_KEY_ID=${POSTURE_SCANNER_TRUSTED_SIGNING_KEY_ID:-${AIG_TRUSTED_SIGNING_KEY_ID:?set POSTURE_SCANNER_TRUSTED_SIGNING_KEY_ID}}
      - AIG_TRUSTED_SIGNING_PUBLIC_KEY_SHA256=${POSTURE_SCANNER_TRUSTED_SIGNING_PUBLIC_KEY_SHA256:-${AIG_TRUSTED_SIGNING_PUBLIC_KEY_SHA256:?set POSTURE_SCANNER_TRUSTED_SIGNING_PUBLIC_KEY_SHA256}}
      - AIG_EXPECTED_DATA_BUNDLE_ID=${POSTURE_SCANNER_EXPECTED_DATA_BUNDLE_ID:-${AIG_EXPECTED_DATA_BUNDLE_ID:?set POSTURE_SCANNER_EXPECTED_DATA_BUNDLE_ID}}
      - AIG_EXPECTED_SOURCE_COMMIT=${POSTURE_SCANNER_EXPECTED_SOURCE_COMMIT:-${AIG_EXPECTED_SOURCE_COMMIT:?set POSTURE_SCANNER_EXPECTED_SOURCE_COMMIT}}
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
      - BRIDGE_AUTH_MODE=${BRIDGE_AUTH_MODE:-broker}
      - BRIDGE_AUTH_REQUIRED=${BRIDGE_AUTH_REQUIRED:-true}
      # Broker mode rejects requests and readiness until all three are set;
      # leaving interpolation optional keeps the explicit local api_key mode usable.
      - BRIDGE_JWT_SECRET=${BRIDGE_JWT_SECRET:-}
      - BRIDGE_JWT_ISSUER=${BRIDGE_JWT_ISSUER:-}
      - BRIDGE_JWT_AUDIENCE=${BRIDGE_JWT_AUDIENCE:-}
      - BRIDGE_JWT_REPLAY_DB=${BRIDGE_JWT_REPLAY_DB:-/app/state/jwt-replay.db}
      - BRIDGE_TENANT_REQUIRED=${BRIDGE_TENANT_REQUIRED:-true}
      # Single-host default: the durable SQLite registry on the bridge state
      # volume. Multi-replica HA sets BRIDGE_HA_REQUIRED=true,
      # BRIDGE_TASK_BACKEND=postgres and BRIDGE_TASK_POSTGRES_DSN; readiness then
      # refuses SQLite and probes the migrated PostgreSQL registry instead.
      - BRIDGE_HA_REQUIRED=${BRIDGE_HA_REQUIRED:-false}
      - BRIDGE_TASK_BACKEND=${BRIDGE_TASK_BACKEND:-sqlite}
      - BRIDGE_TASK_POSTGRES_DSN=${BRIDGE_TASK_POSTGRES_DSN:-}
      - BRIDGE_REQUIRE_IDEMPOTENCY=${BRIDGE_REQUIRE_IDEMPOTENCY:-true}
      - BRIDGE_RUNTIME_EGRESS_REQUIRED=${BRIDGE_RUNTIME_EGRESS_REQUIRED:-true}
      - BRIDGE_EGRESS_PROXY_URL=${BRIDGE_EGRESS_PROXY_URL:-http://aig-egress:3128}
      - BRIDGE_UPLOAD_ENABLED=${BRIDGE_UPLOAD_ENABLED:-true}
      - BRIDGE_UPLOAD_ROOT=${BRIDGE_UPLOAD_ROOT:-/app/uploads}
      - BRIDGE_CORS_ORIGINS=${BRIDGE_CORS_ORIGINS:-}
      - BRIDGE_DOCS_ENABLED=${BRIDGE_DOCS_ENABLED:-false}
      - BRIDGE_MAX_BODY_BYTES=${BRIDGE_MAX_BODY_BYTES:-52428800}
      # Monitoring-only bearer token; empty keeps GET /metrics disabled (404).
      - BRIDGE_METRICS_TOKEN=${BRIDGE_METRICS_TOKEN:-}
      - BRIDGE_ALLOW_PRIVATE_TARGETS=${BRIDGE_ALLOW_PRIVATE_TARGETS:-false}
      - BRIDGE_VALIDATE_DNS=${BRIDGE_VALIDATE_DNS:-true}
      - BRIDGE_SOURCE_ROOT=${BRIDGE_SOURCE_ROOT:-/app/uploads}
      - BRIDGE_TASK_DB=${BRIDGE_TASK_DB:-/app/state/tasks.db}
    volumes:
      # The authenticated upload endpoint writes content-addressed objects;
      # workers consume the same volume read-only.
      - aig-uploads:/app/uploads
      - aig-bridge-state:/app/state
      - type: bind
        source: ./packages/core/src/generated
        target: /app/aig-data
        read_only: true
      - type: bind
        source: ${POSTURE_SCANNER_SIGNING_PUBLIC_KEY_HOST_PATH:-${AIG_SIGNING_PUBLIC_KEY_HOST_PATH:?set POSTURE_SCANNER_SIGNING_PUBLIC_KEY_HOST_PATH}}
        target: /run/secrets/aig-signing-public.pem
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Starlette spools bounded multipart uploads here before atomically moving
    # them into the tenant upload volume. Keep that scratch space ephemeral and
    # inaccessible to other container users.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    networks:
      - aidr-aig-network
      # Docker does not publish ports of a container attached only to an
      # internal network. The edge network carries the published bridge port
      # but has IP masquerading disabled, so it is not an Internet route.
      - aidr-aig-edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      aig-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open(sys.argv[1], timeout=3).close()", "http://localhost:8099/api/v1/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
          pids: 256
        reservations:
          cpus: "0.25"
          memory: "128M"

  # ── AIG Egress Gateway ───────────────────────────────────────────────────
  # Pinned Ubuntu-maintained Squid, deny by default: only operator-listed
  # domains that resolve to public addresses are reachable
  # (deploy/onprem/egress). It is the only AIG service with an Internet route.
  aig-egress:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    entrypoint: ["/usr/sbin/squid"]
    command: ["-f", "/etc/squid/squid.conf", "-NYC"]
    expose:
      - "3128"
    volumes:
      - type: bind
        source: ./deploy/onprem/egress/squid.conf
        target: /etc/squid/squid.conf
        read_only: true
      - type: bind
        source: ${POSTURE_SCANNER_EGRESS_ALLOWLIST_PATH:-${AIG_EGRESS_ALLOWLIST_PATH:-./deploy/onprem/egress/allowlist.txt}}
        target: /etc/squid/aidr-allowlist.txt
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    # Squid starts as root only to drop to its unprivileged `proxy` user.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=8m
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=64m
      - /var/log/squid:rw,noexec,nosuid,nodev,size=8m
    networks:
      - aidr-aig-network
      - aidr-aig-egress
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
          pids: 256
        reservations:
          memory: "64M"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  aig-db:
    name: aidr-aig-db
  aig-logs:
    name: aidr-aig-logs
  aig-uploads:
    name: aidr-aig-uploads
  aig-checker-data:
    name: aidr-aig-checker-data
  aig-bridge-state:
    name: aidr-aig-bridge-state

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  aidr-aig-network:
    name: aidr-aig-network
    driver: bridge
    # No container has a direct Internet route on the control network. Only
    # aig-egress is also attached to the external egress network.
    internal: true
  aidr-aig-edge:
    name: aidr-aig-edge
    driver: bridge
    # Carries only the bridge's published port. Without masquerading, a
    # container on this network cannot originate Internet connections.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  aidr-aig-egress:
    name: aidr-aig-egress
    driver: bridge
