<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font set for the print renderers (scripts/render-brochure.mjs, render-catalog.mjs,
  render-feature-guide.mjs), passed to Chromium as FONTCONFIG_FILE on Linux by
  scripts/lib/render-browser.mjs.

  The brochure and catalog are fixed A4 pages fitted to Liberation Sans / Liberation Mono
  metrics (metric-compatible with Arial / Courier New), which is what the CSS stacks resolve
  to on a Linux machine without Inter or Segoe UI. A machine that has Inter installed, or a
  fontconfig rule that aliases Segoe UI / Helvetica Neue / sans-serif to Inter, renders wider
  text and the unchanged pages overflow. Only the fonts below are visible to the renderer, so
  the layout check sees the same metrics on every Linux machine.

  The system configuration is still loaded for directories, hinting and the metric aliases
  (Arial and Helvetica -> Liberation Sans); every font file except the accepted families is
  rejected. The selectfont block must come before the include (fontconfig applies it to the
  font directories only when it is parsed first), and the reject globs name font file
  extensions rather than "/*" because fontconfig filters directories with the same globs.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/*.ttf</glob>
      <glob>/*.otf</glob>
      <glob>/*.ttc</glob>
      <glob>/*.otc</glob>
      <glob>/*.TTF</glob>
      <glob>/*.OTF</glob>
      <glob>/*.TTC</glob>
      <glob>/*.pfa</glob>
      <glob>/*.pfb</glob>
      <glob>/*.pcf</glob>
      <glob>/*.pcf.gz</glob>
      <glob>/*.bdf</glob>
      <glob>/*.woff</glob>
      <glob>/*.woff2</glob>
      <glob>/*.dfont</glob>
    </rejectfont>
    <acceptfont>
      <glob>/*/Liberation*</glob>
      <glob>/*/DejaVu*</glob>
      <glob>/*/NotoColorEmoji*</glob>
    </acceptfont>
  </selectfont>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
