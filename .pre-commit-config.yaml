repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-added-large-files
        args: ["--maxkb=500"]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks-todo-comments
    rev: v1.2.0
    hooks:
      - id: todo-comments
        name: Tech Debt Scanner
        args: ["--strict"]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: lint
        name: Lint (Biome)
        entry: pnpm lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: typecheck
        name: Type check
        entry: pnpm check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: test
        name: Test
        entry: pnpm test
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: knip
        name: Dead Code Detection (knip)
        entry: pnpm knip
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: jscpd
        name: Duplicate Code Detection (jscpd)
        entry: pnpm duplicates
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: build
        name: Build
        entry: pnpm build
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: changeset-check
        name: Check for changeset
        entry: bash scripts/check-changeset.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
