# =============================================================================
# AIG (AI-Infra-Guard) Sidecar Stack
# =============================================================================
# Runs AIG's scanning platform alongside AIDR. Three services:
#   aig-server  — Go backend (CVE scans, MCP scans, task management)
#   aig-agent   — Go agent (WebSocket worker for scan execution)
#   aig-bridge  — Python/FastAPI (clean REST API consumed by AIDR core)
#
# Attribution: AI-Infra-Guard by Tencent Zhuque Lab (Apache 2.0).
# See vendor/ai-infra-guard/NOTICE for requirements.
# =============================================================================

services:
  # ── AIG Go Backend Server ────────────────────────────────────────────────
  aig-server:
    build:
      context: ./vendor/ai-infra-guard
      dockerfile: Dockerfile
    container_name: aidr-aig-server
    # Tencent's v4.5.1 checkout contains a CRLF start.sh and uses a legacy
    # /ai-infra-guard volume path. Start the binary directly against AIDR's
    # mounted /app paths so the Windows checkout and Linux image agree.
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /app/db /app/uploads /app/logs &&
        touch /app/logs/trpc.log &&
        exec /app/ai-infra-guard webserver --server 0.0.0.0:8088
    ports:
      # AIG upstream v4.5.1 has no authentication. Bind the optional demo
      # UI/API to loopback by default; expose it through an authenticated
      # private ingress only after an explicit AIG_BIND_ADDRESS override.
      - "${AIG_BIND_ADDRESS:-127.0.0.1}:${AIG_SERVER_PORT:-8088}:8088"
    environment:
      - APP_ENV=production
      - UPLOAD_DIR=/app/uploads
      - DB_PATH=/app/db/tasks.db
      - TZ=${AIG_TZ:-Asia/Shanghai}
    volumes:
      - aig-data:/app/data
      - aig-db:/app/db
      - aig-logs:/app/logs
      - aig-uploads:/app/uploads
    networks:
      - aidr-aig-network
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Resource limits for production deployments
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # ── AIG Agent Worker ─────────────────────────────────────────────────────
  aig-agent:
    build:
      context: ./vendor/ai-infra-guard
      dockerfile: Dockerfile_Agent
    environment:
      - TZ=${AIG_TZ:-Asia/Shanghai}
      - AIG_SERVER=aig-server:8088
      - AIG_AGENT_SHARED_SECRET=${AIG_AGENT_SHARED_SECRET:-}
      - AIG_AGENT_VERSION=${AIG_SOURCE_VERSION:-v4.5.1}
      # AIG v4.5.1 imports a pre-rename MCP SDK symbol. The tracked shim is
      # loaded via PYTHONPATH until the upstream import is fixed.
      - PYTHONPATH=/app/aig-compat
    volumes:
      # Source-scan uploads are created by aig-server and consumed by the
      # worker.  Keep the worker read-only so a scan cannot mutate the upload
      # store or escape the configured source root.
      - aig-uploads:/app/uploads:ro
      # AIG v4.5.1 imports a pre-rename MCP SDK symbol. The tracked shim is
      # loaded via PYTHONPATH until the upstream import is fixed.
      - ./services/aig-bridge/aig_compat:/app/aig-compat:ro
    # The upstream image historically requested SYS_ADMIN/unconfined for its
    # browser helper.  Those privileges are not acceptable for customer data;
    # scans must run in a separately attested VM/gVisor/Kata worker if the
    # restricted profile cannot execute a given capability.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g
      - /run:rw,noexec,nosuid,nodev,size=64m
    shm_size: "2gb"
    networks:
      - aidr-aig-network
    restart: unless-stopped
    depends_on:
      aig-server:
        condition: service_healthy
    deploy:
      replicas: ${AIG_AGENT_COUNT:-2}
      resources:
        limits:
          cpus: "4"
          memory: "4G"
        reservations:
          cpus: "1"
          memory: "1G"

  # ── AIG Bridge (Python/FastAPI) ──────────────────────────────────────────
  aig-bridge:
    build:
      context: ./services/aig-bridge
      dockerfile: Dockerfile
    container_name: aidr-aig-bridge
    ports:
      - "${AIG_BIND_ADDRESS:-127.0.0.1}:${AIG_BRIDGE_PORT:-8099}:8099"
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8099
      - BRIDGE_LOG_LEVEL=${BRIDGE_LOG_LEVEL:-INFO}
      - TZ=${AIG_TZ:-Asia/Shanghai}
      - BRIDGE_AIG_URL=http://aig-server:8088
      - AIG_SOURCE_VERSION=${AIG_SOURCE_VERSION:-v4.5.1}
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
      - BRIDGE_AUTH_MODE=${BRIDGE_AUTH_MODE:-broker}
      - BRIDGE_AUTH_REQUIRED=${BRIDGE_AUTH_REQUIRED:-true}
      - BRIDGE_JWT_SECRET=${BRIDGE_JWT_SECRET:-}
      - BRIDGE_JWT_ISSUER=${BRIDGE_JWT_ISSUER:-}
      - BRIDGE_JWT_AUDIENCE=${BRIDGE_JWT_AUDIENCE:-aidr-aig-bridge}
      - BRIDGE_JWT_REPLAY_DB=${BRIDGE_JWT_REPLAY_DB:-/app/state/jwt-replay.db}
      - BRIDGE_TENANT_REQUIRED=${BRIDGE_TENANT_REQUIRED:-true}
      - BRIDGE_HA_REQUIRED=${BRIDGE_HA_REQUIRED:-true}
      - BRIDGE_TASK_BACKEND=${BRIDGE_TASK_BACKEND:-sqlite}
      - BRIDGE_TASK_BACKEND_READY=${BRIDGE_TASK_BACKEND_READY:-false}
      - BRIDGE_REQUIRE_IDEMPOTENCY=${BRIDGE_REQUIRE_IDEMPOTENCY:-true}
      - BRIDGE_RUNTIME_EGRESS_REQUIRED=${BRIDGE_RUNTIME_EGRESS_REQUIRED:-true}
      - BRIDGE_EGRESS_PROXY_URL=${BRIDGE_EGRESS_PROXY_URL:-}
      - BRIDGE_WORKER_HEALTH_REQUIRED=${BRIDGE_WORKER_HEALTH_REQUIRED:-true}
      - AIG_WORKER_READY=${AIG_WORKER_READY:-false}
      - AIG_MIN_WORKERS=${AIG_MIN_WORKERS:-2}
      - AIG_DATASET_READINESS_REQUIRED=${AIG_DATASET_READINESS_REQUIRED:-true}
      - AIG_DATASET_MANIFEST_SHA256=${AIG_DATASET_MANIFEST_SHA256:-}
      - AIG_DATASET_LOADED_SHA256=${AIG_DATASET_LOADED_SHA256:-}
      - BRIDGE_UPLOAD_ENABLED=${BRIDGE_UPLOAD_ENABLED:-true}
      - BRIDGE_UPLOAD_ROOT=${BRIDGE_UPLOAD_ROOT:-/app/uploads}
      - BRIDGE_CORS_ORIGINS=${BRIDGE_CORS_ORIGINS:-}
      - BRIDGE_ALLOW_PRIVATE_TARGETS=${BRIDGE_ALLOW_PRIVATE_TARGETS:-false}
      - BRIDGE_VALIDATE_DNS=${BRIDGE_VALIDATE_DNS:-true}
      - BRIDGE_SOURCE_ROOT=${BRIDGE_SOURCE_ROOT:-/app/uploads}
      - BRIDGE_TASK_DB=${BRIDGE_TASK_DB:-/app/state/tasks.db}
    volumes:
      # The bridge only validates/forwards source paths, but sharing the same
      # read-only root makes the source-scan contract explicit and lets it
      # reject symlink escapes against the actual mounted tree.
      - aig-uploads:/app/uploads:ro
      - aig-bridge-state:/app/state
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - aidr-aig-network
    restart: unless-stopped
    depends_on:
      aig-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8099/api/v1/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  aig-data:
    name: aidr-aig-data
  aig-db:
    name: aidr-aig-db
  aig-logs:
    name: aidr-aig-logs
  aig-uploads:
    name: aidr-aig-uploads
  aig-bridge-state:
    name: aidr-aig-bridge-state

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  aidr-aig-network:
    name: aidr-aig-network
    driver: bridge
