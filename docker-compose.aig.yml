version: "3.9"

# =============================================================================
# AIG (AI-Infra-Guard) Sidecar Stack
# =============================================================================
# Runs AIG's scanning platform alongside AIDR. Three services:
#   aig-server  — Go backend (CVE scans, MCP scans, task management)
#   aig-agent   — Go agent (WebSocket worker for scan execution)
#   aig-bridge  — Python/FastAPI (clean REST API consumed by AIDR core)
#
# Attribution: AI-Infra-Guard by Tencent Zhuque Lab (Apache 2.0).
# See vendor/ai-infra-guard/NOTICE for requirements.
# =============================================================================

services:
  # ── AIG Go Backend Server ────────────────────────────────────────────────
  aig-server:
    build:
      context: ./vendor/ai-infra-guard
      dockerfile: Dockerfile
    container_name: aidr-aig-server
    ports:
      - "${AIG_SERVER_PORT:-8088}:8088"
    environment:
      - APP_ENV=production
      - UPLOAD_DIR=/app/uploads
      - DB_PATH=/app/db/tasks.db
      - TZ=${AIG_TZ:-Asia/Shanghai}
    volumes:
      - aig-data:/app/data
      - aig-db:/app/db
      - aig-logs:/app/logs
      - aig-uploads:/app/uploads
    networks:
      - aidr-aig-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Resource limits for production deployments
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # ── AIG Agent Worker ─────────────────────────────────────────────────────
  aig-agent:
    build:
      context: ./vendor/ai-infra-guard
      dockerfile: Dockerfile_Agent
    container_name: aidr-aig-agent
    environment:
      - TZ=${AIG_TZ:-Asia/Shanghai}
      - AIG_SERVER=aig-server:8088
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    networks:
      - aidr-aig-network
    restart: unless-stopped
    depends_on:
      aig-server:
        condition: service_healthy
    deploy:
      replicas: ${AIG_AGENT_COUNT:-2}
      resources:
        limits:
          cpus: "4"
          memory: "4G"
        reservations:
          cpus: "1"
          memory: "1G"

  # ── AIG Bridge (Python/FastAPI) ──────────────────────────────────────────
  aig-bridge:
    build:
      context: ./services/aig-bridge
      dockerfile: Dockerfile
    container_name: aidr-aig-bridge
    ports:
      - "${AIG_BRIDGE_PORT:-8099}:8099"
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8099
      - BRIDGE_LOG_LEVEL=${BRIDGE_LOG_LEVEL:-INFO}
      - BRIDGE_AIG_URL=http://aig-server:8088
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
      - TZ=${AIG_TZ:-Asia/Shanghai}
    networks:
      - aidr-aig-network
    restart: unless-stopped
    depends_on:
      aig-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8099/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  aig-data:
    name: aidr-aig-data
  aig-db:
    name: aidr-aig-db
  aig-logs:
    name: aidr-aig-logs
  aig-uploads:
    name: aidr-aig-uploads

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  aidr-aig-network:
    name: aidr-aig-network
    driver: bridge
