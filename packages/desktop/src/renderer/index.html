<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Singularity AIDR</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="shell">
			<aside class="sidebar">
				<div class="brand">
					<span class="mark" aria-hidden="true"></span>
					<div class="brand-text">
						<strong>Singularity AIDR</strong>
						<span id="brand-tagline"></span>
					</div>
				</div>
				<nav id="nav" aria-label="Main"></nav>
				<div class="sidebar-foot">
					<div id="protection-badge" class="badge-pill" role="status"></div>
					<div id="app-version" class="muted small"></div>
				</div>
			</aside>
			<main id="main" tabindex="-1"></main>
		</div>
		<div id="modal-root"></div>
		<div id="toast-root" aria-live="polite"></div>
		<script src="app.js"></script>
	</body>
</html>
