<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generic chat (E2E fixture)</title>
<style>
	body { font-family: sans-serif; margin: 0; }
	#log { min-height: 200px; padding: 16px; }
	form { display: flex; gap: 8px; padding: 16px; }
	textarea { flex: 1; min-height: 40px; }
</style>
</head>
<body>
<div id="log"></div>
<form id="ask">
	<textarea name="q" aria-label="Message"></textarea>
	<button type="submit">Send</button>
	<input type="file" id="generic-upload">
</form>
<script src="/__fixture__/kit.js"></script>
<script>
	FixtureChat.init({
		site: "other",
		kind: "textarea",
		editor: "#ask textarea",
		send: '#ask button[type="submit"]',
		form: "#ask",
		thread: "#log",
		endpoint: "/api/chat",
		fileInput: "#generic-upload",
		renderUser(text) {
			const p = document.createElement("p");
			p.className = "user-line";
			p.textContent = text;
			return p;
		},
		renderAssistant() {
			const root = document.createElement("article");
			const body = document.createElement("div");
			root.appendChild(body);
			return { root, body };
		},
	});
</script>
</body>
</html>
