<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Le Chat - Mistral AI (E2E fixture)</title>
<style>
	body { font-family: sans-serif; margin: 0; }
	#conversation { min-height: 200px; padding: 16px; }
	form { display: flex; gap: 8px; margin: 16px; }
	.ProseMirror { flex: 1; min-height: 40px; border: 1px solid #999; padding: 8px; }
	.ProseMirror p { margin: 0; }
</style>
</head>
<body>
<!-- Mirrors src/sites/mistral.ts: a ProseMirror composer inside a form, submit button
     "Send question", turns marked with data-message-author-role. -->
<div id="conversation"></div>
<form id="le-chat-composer">
	<div contenteditable="true" class="ProseMirror" role="textbox" translate="no"
		aria-label="Ask Le Chat anything"><p><br class="ProseMirror-trailingBreak"></p></div>
	<button type="submit" aria-label="Send question">Send</button>
	<input type="file" id="mistral-upload">
</form>
<script src="/__fixture__/kit.js"></script>
<script>
	FixtureChat.init({
		site: "mistral",
		kind: "prosemirror",
		editor: 'form div.ProseMirror[contenteditable="true"]',
		send: 'button[aria-label="Send question"]',
		form: "#le-chat-composer",
		thread: "#conversation",
		endpoint: "/api/chat",
		fileInput: "#mistral-upload",
		renderUser(text) {
			const msg = document.createElement("div");
			msg.setAttribute("data-message-author-role", "user");
			msg.textContent = text;
			return msg;
		},
		renderAssistant() {
			const root = document.createElement("div");
			root.setAttribute("data-message-author-role", "assistant");
			const body = document.createElement("div");
			body.setAttribute("data-message-part-type", "answer");
			root.appendChild(body);
			return { root, body };
		},
	});
</script>
</body>
</html>
