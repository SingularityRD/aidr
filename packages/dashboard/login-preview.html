<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDR - Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .dark body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .dark .card {
            background: #1e293b;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .dark h1 { color: #f1f5f9; }
        .subtitle {
            color: #64748b;
            font-size: 15px;
        }
        .dark .subtitle { color: #94a3b8; }
        .google-btn {
            width: 100%;
            padding: 14px 24px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s;
        }
        .google-btn:hover {
            border-color: #d1d5db;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #94a3b8;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .divider span { padding: 0 16px; }
        .input-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .dark label { color: #f1f5f9; }
        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s;
        }
        .dark input {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }
        input:focus { border-color: #4f46e5; }
        .submit-btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .back-link {
            display: block;
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
            text-decoration: none;
        }
        .dark .back-link { color: #94a3b8; }
        .back-link:hover { color: #0f172a; }
        .security-note {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }
        .dark .security-note { 
            color: #64748b; 
            border-color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="logo">🛡️</div>
            <h1>Welcome to AIDR</h1>
            <p class="subtitle">Sign in to protect your AI agents</p>
        </div>

        <button class="google-btn" onclick="signInWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div class="divider"><span>or continue with email</span></div>

        <div class="input-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
        </div>

        <button class="submit-btn" onclick="sendMagicLink()" id="magicBtn">
            Send magic link
        </button>

        <div id="status" style="margin-top: 16px; padding: 12px; border-radius: 8px; display: none;"></div>

        <a href="#" class="back-link" onclick="goBack()">← Back to home</a>

        <div class="security-note">
            🔒 Secure authentication powered by Supabase
        </div>
    </div>

    <script>
        // Check for dark mode
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark');
        }

        function signInWithGoogle() {
            showStatus('Redirecting to Google...', 'info');
            // In real app: redirect to Supabase OAuth
            setTimeout(() => {
                showStatus('✓ Google sign-in would start here', 'success');
            }, 1000);
        }

        function sendMagicLink() {
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('magicBtn');
            
            if (!email) {
                showStatus('Please enter your email address', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            // Simulate API call
            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = 'Send magic link';
                showStatus('✓ Magic link sent! Check your inbox.', 'success');
            }, 1500);
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
            
            if (type === 'success') {
                status.style.background = 'rgba(34, 197, 94, 0.1)';
                status.style.color = '#16a34a';
                status.style.border = '1px solid rgba(34, 197, 94, 0.2)';
            } else if (type === 'error') {
                status.style.background = 'rgba(239, 68, 68, 0.1)';
                status.style.color = '#dc2626';
                status.style.border = '1px solid rgba(239, 68, 68, 0.2)';
            } else {
                status.style.background = 'rgba(59, 130, 246, 0.1)';
                status.style.color = '#2563eb';
                status.style.border = '1px solid rgba(59, 130, 246, 0.2)';
            }
        }

        function goBack() {
            showStatus('This would go back to landing page', 'info');
        }

        // Enter key support
        document.getElementById('email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMagicLink();
        });
    </script>
</body>
</html>
