# --- osascript Remote Code Execution ---

# osascript -e 'do shell script' (AppleScript shell execution)
# Perf (linear-time rewrite): two unbounded `.*` spans, rescanned from every
# `osascript` occurrence. On 20KB of `osascript -e 'x';` this single rule took
# 23s — a hook-killing ReDoS. Both gaps are bounded to 300 characters;
# `osascript -e 'do shell script "id"'` needs 5 and 1.
- id: "CLT-MAC-CMD-001"
  category: tool
  severity: critical
  confidence: 0.95
  action: block
  pattern: "\\bosascript\\b.{0,300}-e.{0,300}do shell script"
  case_insensitive: true
  match_on: command
  title: "AppleScript shell execution via osascript -e"
  expires_at: null
  revoked: false

# osascript -l JavaScript (JXA execution)
