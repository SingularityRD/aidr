# osascript loading script file from remote download
# Perf (linear-time rewrite): the two unbounded `.*` spans made the engine
# rescan the tail of the command from every `curl|wget` occurrence — ~9.2s for
# a 20KB command that repeats `curl ... | sh;`, i.e. a hook-killing ReDoS.
# Fix: the gaps are "tempered" so they cannot step over the rule's own anchor
# (`(?!(?:curl|wget))[^\n]`). That matches exactly the same inputs as `.*` — a
# match can always be re-anchored at the LAST `curl|wget` before `osascript` —
# but a scan can never run past the next anchor, so the rule is linear. No gap
# limit is imposed, so a long real command still matches.
#   measured on 64KB of repeated `curl -fsSL <url>` with no `| osascript`:
#     `.*` (original) 237ms | `[^|]{0,600}` 5.1ms | tempered 0.8ms
- id: "CLT-MAC-CMD-004"
  category: tool
  severity: critical
  confidence: 0.90
  action: block
  pattern: "(curl|wget)(?:(?!(?:curl|wget))[^\\n])*\\|(?:(?!(?:curl|wget))[^\\n])*osascript|osascript(?:(?!osascript)[^\\n])*(curl|wget)"
  case_insensitive: true
  match_on: command
  title: "Remote script download piped to osascript"
  expires_at: null
  revoked: false

