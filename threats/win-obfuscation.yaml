# Dotdotdot hidden folder (ex CLT-TECH-003)
# Perf (linear-time rewrite): the second alternative used to start with a bare
# `[a-zA-Z]+`. The regex engine retried it at *every* offset, rescanned the rest
# of a long letter run and then backtracked — O(n^2): ~0.85s for a 20KB command,
# ~27s for 100KB, which killed the 15s hook before it could emit a verdict.
# `(?<![a-zA-Z])` restricts the attempt to the start of a word run. A match that
# used to be found mid-run (e.g. inside `abcdmkdir ...`) can still be found at
# the run start, so the match set for this character-class-led alternative is
# unchanged; the rule is now linear in the input length.
- id: "CLT-WIN-OBFUS-012"
  category: tool
  severity: high
  confidence: 0.80
  action: require_approval
  pattern: "(mkdir\\s+\\.{3,}|(?<![a-zA-Z])[a-zA-Z]+\\s+[a-z0-9]+\\s+>\\s+\\.{3,})"
  case_insensitive: true
  match_on: command
  title: "Hidden file/folder via ... directory trick"
  expires_at: null
  revoked: false

