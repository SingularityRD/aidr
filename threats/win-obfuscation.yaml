# Bypass + NoProfile combo
#
# Gap sizing: this rule must not have a gap limit — an attacker pads a real
# command with extra arguments, and any bound N is evadable by padding past N
# (a 300-char bound missed a 1239-char real-form command). Instead of a bound the
# gap is written as a "tempered" scan that cannot step over the rule's own anchor:
#     (?:(?!-[Ee]xecution[Pp]olicy)[^\n])*
# It matches exactly the same inputs as the original `.*`: if `A ... B` matches at
# all, it also matches starting from the LAST `A` before `B`, and that gap
# contains no `A` by construction. The difference is that a scan can never run
# past the next occurrence of the anchor, which makes the rule linear where the
# original was quadratic (anchor repeated, target absent).
#   measured on 64KB of `-ExecutionPolicy Bypass` with no `-NoProfile`:
#     `.*` (original)   441ms
#     `.{0,2000}`        38ms   (and it misses any gap longer than 2000)
#     `.{0,64000}`      350ms
#     tempered scan     0.4ms   (no gap limit at all)
# A 1.2KB real command and a 50KB-padded variant both still match.
- id: "CLT-WIN-OBFUS-004"
  category: tool
  severity: high
  confidence: 0.90
  action: block
  pattern: "-[Ee]xecution[Pp]olicy\\s+[Bb]ypass(?:(?!-[Ee]xecution[Pp]olicy)[^\\n])*-[Nn]o[Pp]rofile"
  match_on: command
  title: "PowerShell -ExecutionPolicy Bypass -NoProfile (malware pattern)"
  expires_at: null
  revoked: false

