# --- Install scripts piped to shell ---
# Perf (linear-time rewrite): both unbounded `.*` spans were rescanned from
# every `curl|wget` occurrence (~88ms per 20KB of `curl ...;` text, ~1.0s at
# the 64KB match cap). Bounded to 300 characters each, which still covers
# `curl -fsSL https://<long-url>/install.sh | bash`.
- id: "CLT-SUPPLY-001"
  category: supply_chain
  severity: high
  confidence: 0.85
  action: block
  pattern: "(curl|wget)\\s+.{0,300}install.{0,300}\\|\\s*(bash|sh|zsh|sudo\\s+bash|sudo\\s+sh)"
  match_on: command
  title: "Install script piped to shell (supply chain risk)"
  title_tr: "Kurulum betiği doğrudan kabuğa aktarılıyor (tedarik zinciri riski)"
  expires_at: null
  revoked: false


# --- Package manifest install-hook that fetches and runs remote code ---
# A package.json / pyproject / setup script whose (pre|post)install hook pipes a
# download into a shell. Matched on written file CONTENT (CLT-CMD-001 only sees a
# live shell command, not a manifest an agent writes).
- id: "CLT-SUPPLY-002"
  category: supply_chain
  severity: critical
  confidence: 0.90
  action: block
  pattern: "\"(?:pre|post)?install\"\\s*:\\s*\"[^\"]{0,300}\\b(curl|wget|fetch)\\b[^\"]{0,300}\\|\\s*(bash|sh|zsh|ksh|dash)\\b"
  match_on: content
  title: "Package manifest install hook fetches and executes remote code"
  title_tr: "Paket bildirimindeki kurulum kancası uzaktan kod indirip çalıştırıyor"
  expires_at: null
  revoked: false
