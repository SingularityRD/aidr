# --- PowerShell Download-Execute ---

# Pipe to IEX: irm url | iex, iwr url | iex, curl url | iex, Invoke-WebRequest url | Invoke-Expression
# Perf (linear-time rewrite): the unbounded `.*` before the pipe was rescanned
# from every download verb (~88ms per 20KB of `curl ...;`, ~1.4s at the 64KB
# match cap). Bounded to 300 characters, far beyond `curl -fsSL <url>`.
- id: "CLT-WIN-CMD-001"
  category: tool
  severity: critical
  confidence: 0.95
  action: block
  pattern: "\\b([Ii][Rr][Mm]|[Ii][Ww][Rr]|curl|wget|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod)\\b.{0,300}\\|\\s*([Ii][Ee][Xx]|[Ii]nvoke-[Ee]xpression)\\b"
  match_on: command
  title: "PowerShell download piped to Invoke-Expression"
  expires_at: null
  revoked: false

# IEX wrapping download: iex(irm url), IEX((New-Object Net.WebClient).DownloadString(url))
- id: "CLT-WIN-CMD-002"
  category: tool
  severity: critical
  confidence: 0.95
  action: block
  pattern: "\\b([Ii][Ee][Xx]|[Ii]nvoke-[Ee]xpression)\\s*\\(?\\s*\\(?\\s*(\\b([Ii][Rr][Mm]|[Ii][Ww][Rr])\\b|[Nn]ew-[Oo]bject|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod)"
  match_on: command
  title: "Invoke-Expression wrapping remote download"
  expires_at: null
  revoked: false

# Start-Process with executable
