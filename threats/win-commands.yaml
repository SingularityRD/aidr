# Download to file then chain-execute: curl -o install.cmd url && install.cmd
# Perf (linear-time rewrite): `[^|]*` and the trailing `.*` were both rescanned
# from every download verb — ~360ms per 20KB and ~2.8s at the 64KB match cap.
# Both gaps are bounded to 300 characters, several times a realistic
# `curl -o <path> <url>` invocation.
- id: "CLT-WIN-CMD-004"
  category: tool
  severity: critical
  confidence: 0.90
  action: block
  pattern: "\\b(curl|wget|[Ii][Rr][Mm]|[Ii][Ww][Rr]|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod)\\b[^|]{0,300}(-[Oo]\\w{0,300}\\s+|-[Oo]ut[Ff]ile\\s+)\\S{1,300}\\.(cmd|bat|ps1|exe|msi).{0,300}(&&|;)"
  match_on: command
  title: "Download file then chain-execute"
  expires_at: null
  revoked: false

