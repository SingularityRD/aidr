# --- Download-Execute Chain (single & separator) ---

# curl/wget download to file then start (single & in cmd.exe)
# Perf (linear-time rewrite): two unbounded `[^&]*` spans. On a command that
# repeats `curl -o x;` without any `&` the engine retried the whole tail from
# every occurrence — measured 55.9s for a single 20KB command, a hook-killing
# ReDoS. Bounded to 300 characters each; a real `curl -o file <url> & start
# <file>` chain uses ~40.
- id: "CLT-WIN-CMD-046"
  category: tool
  severity: critical
  confidence: 0.90
  action: block
  pattern: "\\b(curl|wget)\\b[^&]{0,300}(--(output|o\\b)|-o\\b)[^&]{0,300}&\\s*(start\\b|cmd)"
  case_insensitive: true
  match_on: command
  title: "Download file then execute via cmd start (download-execute chain)"
  expires_at: null
  revoked: false

