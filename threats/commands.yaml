  confidence: 0.90
  action: block
  pattern: "(?:\\bsocat\\b.{0,200}\\bTCP(?:4|6)?:[^\\s]{1,120}.{0,120}\\bEXEC:/bin/(?:ba)?sh\\b|\\bncat\\b.{0,200}(?:\\s-e\\s|\\s--exec(?:=|\\s))\\s*/bin/(?:ba)?sh\\b|\\bopenssl\\s+s_client\\b.{0,200}\\|\\s*(?:/bin/)?(?:ba)?sh\\b)"
  case_insensitive: true
  match_on: command
  title: "Outbound socket attached to an interactive shell"
  expires_at: null
  revoked: false
