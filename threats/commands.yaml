# --- Deletion of .git directory ---
# Perf (linear-time rewrite): the unbounded `.*` between the verb and the target
# was rescanned from every occurrence of `rm|del|rd|...`, i.e. O(n^2) on a
# command that repeats those verbs (~80ms for 20KB of `rm -rf build/`, and
# minutes for megabytes). The gap is now bounded to 300 characters â€” several
# times any realistic argument list (`rm -rf --preserve-root
# `$HOME/projects/<name>/.git` is ~55) â€” which makes the rule linear while
# still matching every real invocation.
- id: "CLT-CMD-029"
  category: tool
  severity: high
  confidence: 0.90
  action: require_approval
  pattern: "\\b(rm|del|rmdir|rd|Remove-Item|unlink)\\b.{0,300}(\\s|[\\\\/])\\.git(\\s|[\\\\/]|$)"
  case_insensitive: true
  match_on: command
  title: "Deletion of .git directory"
  expires_at: null
  revoked: false

# Shells attached to outbound sockets through common Unix networking clients.
- id: "CLT-CMD-030"
  category: network_egress
