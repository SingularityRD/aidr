# --- Data exfiltration ---
# Perf (linear-time rewrite): unbounded `[^|;]*` was rescanned from every
# `curl` occurrence when the command contains neither `|` nor `;` (~69ms per
# 20KB, ~770ms at the 64KB match cap). Bounded to 300 characters, far beyond a
# real `curl -d @file https://...` invocation.
- id: "CLT-CMD-013"
  category: network_egress
  severity: high
  confidence: 0.80
  action: require_approval
  pattern: "curl\\s[^|;]{0,300}(-d|--data|--data-binary)\\s\\S{0,300}(/etc/passwd|/etc/shadow|\\.ssh/|id_rsa|credentials|secrets)"
  match_on: command
  title: "Possible data exfiltration of sensitive files"
  expires_at: null
  revoked: false

