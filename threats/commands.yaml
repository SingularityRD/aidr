# --- Download + execute chains ---
# Perf (linear-time rewrite): unbounded `[^&]*` was rescanned from every
# `curl|wget` occurrence, so a command repeating those verbs without a `&`
# cost O(n^2) (~88ms per 20KB, ~770ms at the 64KB match cap). Bounded to 300
# characters, far beyond `curl -fsSL <url>` plus flags.
- id: "CLT-CMD-010"
  category: tool
  severity: critical
  confidence: 0.90
  action: block
  pattern: "(curl|wget)\\s[^&]{0,300}&&\\s*chmod\\s+\\+x"
  match_on: command
  title: "Download and execute chain"
  expires_at: null
  revoked: false

