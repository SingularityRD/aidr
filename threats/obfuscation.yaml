# --- Base64 decode piped to shell ---
- id: "CLT-OBFUS-001"
  category: tool
  severity: critical
  confidence: 0.95
  action: block
  pattern: "base64\\s+(-d|--decode|-D)\\b[^|]{0,300}\\|\\s*(bash|sh|zsh|ksh|dash)\\b"
  match_on: command
  title: "Base64 decode piped to shell execution"
  expires_at: null
  revoked: false

