# --- Download piped to a shell, seen through the shell-normalized view ---
# Variable indirection (`a=cu;b=rl;$a$b … | sh`) and `$IFS` word-splitting hide
# the literal `curl`/`wget` from the raw-command rules; the shell-normalized view
# (packages/core/src/shell-normalize.ts, which substitutes same-command variables
# and rewrites `$IFS` to a space) restores it. See CLT-CMD-001/002 for the literal
# forms.
- id: "CLT-OBFUS-011"
  category: tool
  severity: critical
  confidence: 0.90
  action: block
  pattern: "\\b(curl|wget|fetch)\\b[^|]{0,300}\\|\\s*(?:(?:sudo|timeout|xargs|env|command|nohup|stdbuf|nice|setsid|doas)\\b[^|]{0,60}\\s+){0,3}(?:/[^\\s|]{1,80}/)?(bash|sh|zsh|ksh|dash)\\b"
  match_on: command_normalized
  title: "Remote code execution via download piped to shell (obfuscated/normalized)"
  expires_at: null
  revoked: false

# base64 decoded inside a command substitution and executed: bash -c "$(... | base64 -d)"
- id: "CLT-OBFUS-012"
  category: tool
  severity: critical
  confidence: 0.90
  action: block
  pattern: "(\\b(bash|sh|zsh|ksh|dash)\\s+(-[a-z]*c[a-z]*)\\s+|\\beval\\s+)[\"']?(\\$\\(|`).{0,300}\\bbase(64|32)\\s+(-d|--decode|-D)\\b"
  match_on:
    - command
    - command_normalized
  title: "Encoded payload decoded and executed through command substitution"
  expires_at: null
  revoked: false

