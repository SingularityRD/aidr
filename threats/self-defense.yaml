# Self-defense patterns â€” protect Singularity AIDR and Claude Code configuration
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
# These flag when the AI agent may be manipulated into disabling its own guardrails.
# CLT-SELF-002, -003, -005 and -006 use require_approval (not block) to allow
# legitimate plugin development and config changes. CLT-SELF-001 (removing AIDR's
# own installation) and CLT-SELF-004 (switching AIDR or its hooks off by config)
# are hard blocks, like their CLI equivalents in CLT-SELF-007. CLT-SELF-007..009
# guard the operator approval channel itself and are hard blocks: an ask there
# would let the agent ask the operator to approve the agent's own access to the
# approval machinery.

# Remove, move or overwrite Singularity AIDR's own installation.
# Two forms: the original command form (`rm -rf ~/.singularity-aidr`), and the
# `modified_path` view (packages/core/src/self-defense-paths.ts): the canonical
# paths a call removes, moves, overwrites, truncates, links over or
# re-permissions, from a shell command (literal and shell-normalized, globs
# resolved, `cd` followed, interpreter fs calls such as `os.remove`/`fs.rmSync`)
# or a file tool (Write, Edit, Delete, apply_patch). The protected paths are the
# state directory, the `aidr-codex-hook` binary, globally installed
# `@singularityrd/aidr-*` packages, the OpenClaw extension, the Cursor/VS Code
# extension and the Claude Code plugin checkout. Reads produce no path.
# A hard block: removing AIDR is what `aidr uninstall` does, and CLT-SELF-007
# denies that to the agent too.
# Perf (linear-time rewrite): the command form's gap is bounded to 300
# characters; the path form only runs on bounded canonical paths.
- id: "CLT-SELF-001"
  category: self_defense
  severity: critical
  confidence: 0.95
  action: block
  pattern: "(rm|del|rmdir|rd|Remove-Item|unlink)\\s.{0,300}\\.singularity-aidr(\\s|[\\\\/]|$)|^(?=~|/|[A-Za-z]:/)(?:\\S{0,600}/)?(?:\\.singularity-aidr|aidr-codex-hook(?:\\.cmd|\\.ps1)?|(?:lib|npm|global(?:/\\d{1,4})?)/node_modules/@singularityrd/aidr-[\\w.-]{1,64}|\\.openclaw/extensions/aidr[\\w.-]{0,64}|\\.(?:vscode|vscode-insiders|vscode-oss|cursor|windsurf)(?:-server)?/extensions/singularityrd\\.[\\w.-]{1,128}|\\.claude/plugins/(?:marketplaces|cache)/aidr)(?:/\\S{0,600})?$"
  case_insensitive: true
  match_on:
    - command
    - modified_path
  title: "Attempt to remove or overwrite the Singularity AIDR installation"
  title_tr: "Singularity AIDR kurulumunu silme ya da üzerine yazma girişimi"
  expires_at: null
  revoked: false

# Access Singularity AIDR config files, the operator approval store or its key
- id: "CLT-SELF-002"
  category: self_defense
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\.singularity-aidr[\\\\/]((allowlist|config|approvals|operator-approval-key)\\.json|operator-approval\\.key)"
  match_on: file_path
  title: "Access Singularity AIDR configuration files"
  title_tr: "Singularity AIDR yapılandırma dosyalarına erişim"
  expires_at: null
  revoked: false

# Remove, move or overwrite the host configuration that loads AIDR's hooks:
# Claude Code (`~/.claude/settings*.json`, `~/.claude/plugins`), Codex
# (`~/.codex/hooks.json`, `~/.codex/config.toml`), Cursor (`~/.cursor/hooks.json`,
# its hooks directory and extensions), VS Code/Cursor/Windsurf user settings and
# extension directories, OpenClaw (`~/.openclaw/openclaw.json`, its extensions)
# and OpenCode (`~/.config/opencode`). Matched on the original command form and on
# the `modified_path` view (see CLT-SELF-001), so `mv`, `cp` onto, `truncate`,
# `sed -i`, `tee`, `>`, `chmod`, globs (`~/.codex/hook*`), `cd` then a relative
# name, interpreter fs calls and Write/Edit/Delete all count; `cat` does not.
# require_approval, not block: these files hold the user's other settings too,
# and editing them is legitimate work the user can approve out of band. The
# AIDR-specific toggles inside them (`disableAllHooks`, `"aidr@aidr": false`) are
# hard blocks in CLT-SELF-004.
# Perf (linear-time rewrite): every gap is bounded (300 characters in the
# command form, 600 in the path form).
- id: "CLT-SELF-003"
  category: self_defense
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "(rm|del|Remove-Item|unlink)\\s.{0,300}\\.claude[\\\\/].{0,300}(hooks\\.json|installed_plugins)|^(?=~|/|[A-Za-z]:/)(?:[^\\n]{0,600}/)?\\.claude/(?:[^\\n]{0,600}/)?(?:hooks\\.json|installed_plugins\\.json)$|^~/(?:\\.claude(?:/(?:settings(?:\\.local)?\\.json|hooks(?:/[^\\n]{1,600})?|plugins(?:/(?:known_marketplaces\\.json|config\\.json|marketplaces|cache))?))?|\\.claude\\.json|\\.codex(?:/(?:hooks\\.json|config\\.toml|hooks(?:/[^\\n]{1,600})?))?|\\.cursor(?:/(?:hooks\\.json|hooks(?:/[^\\n]{1,600})?|extensions))?|\\.(?:vscode|vscode-insiders|vscode-oss|windsurf)(?:/extensions)?|\\.openclaw(?:/(?:openclaw\\.json|extensions))?|\\.config(?:/opencode(?:/[^\\n]{1,600})?)?|(?:\\.config|Library/Application Support|AppData/Roaming)/(?:Code(?: - Insiders)?|Cursor|VSCodium|Windsurf)(?:/User(?:/settings\\.json)?)?)$"
  case_insensitive: true
  match_on:
    - command
    - modified_path
  title: "Attempt to remove or rewrite an agent host's hook or plugin configuration"
  title_tr: "Bir yapay zekâ aracının kanca ya da eklenti yapılandırmasını silme veya değiştirme girişimi"
  expires_at: null
  revoked: false

# Disable Singularity AIDR via configuration written by the agent: its own
# detection switches, a replacement rule or allowlist directory
# (`AIDR_THREATS_DIR`/`AIDR_ALLOWLISTS_DIR` in a settings `env` block, a shell
# start-up file or an env file), or the host switch that turns its hooks off
# (Claude Code `disableAllHooks` / `"aidr@aidr": false` in `enabledPlugins`,
# OpenClaw `plugins.entries.aidr-openclaw.enabled: false`, Codex
# `codex_hooks = false`). A hard block: the CLI equivalent
# (`aidr config --set`) is denied to the agent by CLT-SELF-007.
- id: "CLT-SELF-004"
  category: self_defense
  severity: critical
  confidence: 0.95
  action: block
  pattern: "\"heuristics_enabled\"\\s*:\\s*false|\"url_check\"\\s*:\\s*\\{[^}]{0,300}\"enabled\"\\s*:\\s*false|\"AIDR_(?:THREATS|ALLOWLISTS)_DIR\"\\s{0,10}:|(?:^|\\n|[{,])[ \\t]{0,20}(?:(?:export|set|declare[ \\t]{1,4}-x)[ \\t]{1,10})?AIDR_(?:THREATS|ALLOWLISTS)_DIR[ \\t]{0,10}=|(?:^|\\n)[ \\t]{0,20}setenv[ \\t]{1,10}AIDR_(?:THREATS|ALLOWLISTS)_DIR\\b|\"disableAllHooks\"\\s{0,10}:\\s{0,10}true|\"aidr@[\\w.-]{1,64}\"\\s{0,10}:\\s{0,10}false|\"aidr-openclaw\"\\s{0,10}:\\s{0,10}\\{[^}]{0,300}\"enabled\"\\s{0,10}:\\s{0,10}false|(?:^|\\n)[ \\t]{0,20}codex_hooks[ \\t]{0,10}=[ \\t]{0,10}false"
  match_on: content
  title: "Attempt to disable Singularity AIDR or its hooks via configuration"
  title_tr: "Singularity AIDR'yi ya da kancalarını yapılandırma yoluyla devre dışı bırakma girişimi"
  expires_at: null
  revoked: false

# Forge an approval by writing the agent-writable consumed-approvals store
- id: "CLT-SELF-005"
  category: self_defense
  severity: critical
  confidence: 0.95
  action: require_approval
  pattern: "(>|>>|tee|Set-Content|Out-File|writeFile(?:Sync)?|WriteAllText|cp|copy|mv|move)\\s.{0,300}consumed-approvals-[^\\s\\\"'<>|]{1,300}\\.json|consumed-approvals-[^\\s\\\"'<>|]{1,300}\\.json.{0,100}(>|>>)"
  case_insensitive: true
  match_on: command
  title: "Attempt to forge a Singularity AIDR approval record"
  title_tr: "Sahte bir Singularity AIDR onay kaydı oluşturma girişimi"
  expires_at: null
  revoked: false

