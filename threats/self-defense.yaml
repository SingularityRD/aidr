# Self-defense patterns — protect Singularity AIDR and Claude Code configuration
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
# These flag when the AI agent may be manipulated into disabling its own guardrails
# Using require_approval (not block) to allow legitimate plugin dev and config changes

# Delete .singularity-aidr directory
- id: "CLT-SELF-001"
  category: self_defense
  severity: critical
  confidence: 0.90
  action: require_approval
  pattern: "(rm|del|rmdir|rd|Remove-Item|unlink)\\s.*\\.singularity-aidr(\\s|[\\\\/]|$)"
  case_insensitive: true
  match_on: command
  title: "Attempt to delete Singularity AIDR configuration directory"
  expires_at: null
  revoked: false

# Access Singularity AIDR config files
- id: "CLT-SELF-002"
  category: self_defense
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\.singularity-aidr[\\\\/](allowlist|config)\\.json"
  match_on: file_path
  title: "Access Singularity AIDR configuration files"
  expires_at: null
  revoked: false

# Delete Claude Code hook or plugin config
- id: "CLT-SELF-003"
  category: self_defense
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "(rm|del|Remove-Item|unlink)\\s.*\\.claude[\\\\/].*(hooks\\.json|installed_plugins)"
  case_insensitive: true
  match_on: command
  title: "Attempt to delete Claude Code hook or plugin configuration"
  expires_at: null
  revoked: false

# Disable Singularity AIDR security features via config
- id: "CLT-SELF-004"
  category: self_defense
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\"heuristics_enabled\"\\s*:\\s*false|\"url_check\"\\s*:\\s*\\{[^}]*\"enabled\"\\s*:\\s*false"
  match_on: content
  title: "Attempt to disable Singularity AIDR security features via config"
  expires_at: null
  revoked: false

