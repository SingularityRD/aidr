# Self-approval: the agent invoking the operator-only approval CLI or forcing its
# non-interactive mode. `aidr approve`, `aidr pending`, `aidr allowlist add` and
# `aidr exception add` (a time-limited detection exception) are human-only,
# out-of-band actions, so this is a hard block (deny), never an
# ask: an ask would hand the agent an actionId the operator might approve.
# The protection-weakening CLI commands are operator-only for the same reason:
# `aidr config -s|--set` (heuristics off, disabled threats, lower sensitivity,
# checks or policies off), `aidr uninstall` (removes the hooks) and
# `aidr setup --force|-f` (replaces the configuration), `aidr setup --release-key`
# (replaces the trust anchor the installation verifies itself against). Short-flag clusters
# containing the flag (`-ls`, `-vf`) and `--set=key` are matched too.
# It matches the shell-normalized view (`command_normalized`, see
# packages/core/src/shell-normalize.ts), so quoting (`aidr 'approve'`,
# `"aidr" approve`, `aidr ap\prove`), executable lookups (`$(which aidr)`),
# variables, package runners (`npx @singularityrd/aidr-cli approve`), interpreter
# argv lists (`spawn('aidr', ['approve', id])`) and pty wrappers (`script -qc`,
# `expect`, `unbuffer`, which all carry the inner command) do not hide it.
# The commands that change files or evidence on the operator's behalf are
# matched the same way: `aidr quarantine release|delete` (puts a file classified
# as malicious back, or destroys the evidence), `aidr restore` (overwrites a
# protected path from a snapshot) and `aidr audit rotate-key` (replaces the
# verdict-log signing root).
# Read-only diagnostics (`aidr doctor`, `aidr status`, `aidr audit tail`,
# `aidr audit verify`, `aidr quarantine list|show`, `aidr allowlist list|remove`,
# `aidr config -g|--get|-l|--list`, `aidr setup` without --force) are not matched.
# The MCP gateway's operator toolset approval (`aidr-mcp-approve`, its package
# runner form and its approve.mjs script) is matched too: it accepts a
# quarantined (changed, "rug-pulled") MCP toolset, so an agent running it would
# approve the very tool descriptions the gateway refused.
# Disabling or removing AIDR through the host instead of `aidr uninstall` is
# the same weakening and is matched the same way: `claude plugin
# disable|uninstall|marketplace remove` of the aidr plugin (or `--all`),
# `code|cursor|windsurf --uninstall-extension|--disable-extension(s)` of the
# SingularityRD extension, `openclaw|opencode plugins disable|uninstall|remove`
# of aidr, `openclaw config set|unset plugins.entries.aidr-openclaw.*` or
# `plugins.enabled`, a global npm/pnpm/yarn/bun (un)install of any
# `@singularityrd/aidr-*` package and the removal of a connector package. So is
# pointing AIDR at another rule or allowlist directory through the environment
# (`AIDR_THREATS_DIR=...`, `export`, `setx`, `setenv`, `os.environ[...] =`, a
# JSON `env` entry written by `echo`); reading the variable
# (`echo $AIDR_THREATS_DIR`) is not matched. Globs in an executable path
# (`aidr-mcp-appr*.mjs`, `/usr/local/bin/ai?r`) are resolved by the normalized
# view.
- id: "CLT-SELF-007"
  category: self_defense
  severity: critical
  confidence: 0.99
  action: block
  pattern: "\\baidr(?:-cli|-setup)?(?:@[\\w.^~-]{1,40})?(?:/[\\w.@-]{1,100}){0,8}(?:\\.exe|\\.cmd|\\.ps1|\\.js|\\.mjs|\\.cjs)?[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}(?:=\\S{0,200})?[\\s,\\[\\]]{1,20}){0,6}(?:approve|approvals|pending|(?:allowlist|exceptions?)[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}[\\s,\\[\\]]{1,20}){0,4}add|uninstall|config[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}(?:=\\S{0,200})?[\\s,\\[\\]]{1,20}(?:[^\\s,\\[\\]-][^\\s,\\[\\]]{0,200}[\\s,\\[\\]]{1,20})?){0,4}(?:--set|-[A-Za-z]{0,6}s[A-Za-z]{0,6})|setup[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}(?:=\\S{0,200})?[\\s,\\[\\]]{1,20}(?:[^\\s,\\[\\]-][^\\s,\\[\\]]{0,200}[\\s,\\[\\]]{1,20})?){0,4}(?:--force|--release-key|-[A-Za-z]{0,6}f[A-Za-z]{0,6})|quarantine[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}[\\s,\\[\\]]{1,20}){0,4}(?:release|delete)|restore|audit[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}[\\s,\\[\\]]{1,20}){0,4}rotate-key)\\b|AIDR_OPERATOR_NONINTERACTIVE|\\baidr-mcp-approve\\b|aidr-mcp-gateway[\\\\/](?:[\\w.-]{1,100}[\\\\/]){0,4}(?:aidr-mcp-)?approve\\.[cm]?js\\b|mcp-gateway[\\\\/](?:src|dist)[\\\\/](?:aidr-mcp-)?approve\\.[cm]?js\\b|\\bclaude\\b[^\\n;&|]{0,60}\\bplugins?\\b[^\\n;&|]{0,80}\\b(?:disable|uninstall|remove|rm)\\b[^\\n;&|]{0,200}?(?:\\baidr\\b|--all\\b)|\\b(?:code|code-insiders|code-oss|codium|cursor|windsurf)(?:\\.cmd|\\.exe)?\\b[^\\n;&|]{0,200}?--(?:uninstall|disable)-extension(?:s\\b|[\\s=]{1,10}[^\\s;&|]{0,80}?(?:singularityrd|aidr))|\\bopen(?:claw|code)\\b[^\\n;&|]{0,60}\\bplugins?\\b[^\\n;&|]{0,80}\\b(?:disable|uninstall|remove|rm|delete)\\b[^\\n;&|]{0,200}?\\baidr|\\bopenclaw\\b[^\\n;&|]{0,60}\\bconfig\\b[^\\n;&|]{0,40}\\b(?:set|unset|delete|rm|remove)\\b[^\\n;&|]{0,40}?\\bplugins\\.(?:entries\\.aidr|enabled\\b)|\\b(?:npm|pnpm|yarn|bun|cnpm)\\b[^\\n;&|]{0,200}?(?:\\s(?:-g|--global|--location[= ]global)\\b|\\bglobal\\b)[^\\n;&|]{0,200}?@singularityrd/aidr-|\\b(?:npm|pnpm|yarn|bun|cnpm)\\b[^\\n;&|]{0,200}?@singularityrd/aidr-[^\\n;&|]{0,200}?\\s(?:-g|--global)\\b|\\b(?:npm|pnpm|yarn|bun|cnpm)\\b[^\\n;&|]{0,120}?\\b(?:uninstall|remove|rm|un|r|unlink|erase)\\b[^\\n;&|]{0,200}?@singularityrd/aidr-(?:codex|cli|claude-code|openclaw|opencode|mcp-gateway)\\b|\\bAIDR_(?:THREATS|ALLOWLISTS)_DIR\\s{0,10}\\]?\\s{0,10}(?:=|:\\s)|\\b(?:export|setenv|setx|SetEnvironmentVariable)\\b[\\s(,]{1,10}(?:-\\w{1,10}\\s{1,10})?AIDR_(?:THREATS|ALLOWLISTS)_DIR\\b"
  case_insensitive: true
  match_on: command_normalized
  title: "Attempt to self-approve a Singularity AIDR block, forge an operator approval or weaken its protection"
  title_tr: "Bir Singularity AIDR engelini kendi kendine onaylama, operatör onayını taklit etme ya da korumayı zayıflatma girişimi"
  expires_at: null
  revoked: false

# Any agent reference to the AIDR state directory. It holds the approval store,
# the allowlist, the config and — when the operator opted into file key storage —
# the approval key, so reading, copying, listing or rewriting anything in it is a
# hard block, whatever the tool: a shell command (`~`, `$HOME`, absolute,
# quoted, `cd` then relative access, globs such as `~/.singul*` or `~/.*`
# resolved by the normalized view), a file tool path, a Write/Edit body that
# would put the path into a script, or an MCP argument. The literal is matched
# after shell normalization, which also joins string concatenations in
# interpreter one-liners (`'/.singular' + 'ity-aidr'`).
# There is no agent-facing read-only exception: AIDR's diagnostics are CLI
# commands (`aidr doctor`, `aidr status`) that do not name the directory.
- id: "CLT-SELF-008"
  category: self_defense
  severity: critical
  confidence: 0.99
  action: block
  pattern: "\\.singularity-aidr"
  case_insensitive: true
  match_on:
    - command_normalized
    - file_path_normalized
    - content_normalized
  title: "Agent access to the Singularity AIDR state directory"
  title_tr: "Yapay zekâ aracının Singularity AIDR durum dizinine erişimi"
  expires_at: null
  revoked: false

# The approval key, the consumption ledger and the credential vault entries by
# name: `secret-tool lookup service singularity-aidr-cli id aidr-operator-approval-key`,
# `security find-generic-password -s singularity-aidr-cli`, or a file named after
# them, wherever it is.
# Agent code that imports `@singularityrd/aidr-mcp-gateway` or its
# `aidr-mcp-library.mjs` bundle (`import(...)`, `require(...)`, `from ...`,
# `node --import`) is a hard block in a command and in a file the agent writes,
# as defence in depth around the MCP gateway's operator approval. The gateway's
# attestation state directory as documented (`/var/lib/aidr/mcp-attestation`) is
# protected the same way. A specifier computed at run time is not visible to a
# rule; the gateway closes that case itself (MSC-2): the importable library has
# no approval writer (only `aidr-mcp-approve` signs approvals, with the
# operator's key) and the gateway honours only operator-signed approvals.
- id: "CLT-SELF-009"
  category: self_defense
  severity: critical
  confidence: 0.99
  action: block
  pattern: "singularity-aidr-cli\\b|aidr-operator-approval|aidr-audit-chain|operator-approval(?:-key|-ledger)?\\.(?:key|json)|(?:\\bimport\\b|\\brequire\\b|\\bfrom\\b|--import\\b|--require\\b|\\s-r\\b)[\\s(=]{0,10}[^\\s()]{0,300}?(?:@singularityrd/aidr-mcp-gateway\\b|\\baidr-mcp-library\\b)|\\baidr[\\\\/]{1,2}mcp-attestation\\b"
  case_insensitive: true
  match_on:
    - command_normalized
    - file_path_normalized
    - content_normalized
  title: "Agent access to the Singularity AIDR approval key, vault entries or MCP approval API"
  title_tr: "Yapay zekâ aracının Singularity AIDR onay anahtarına, kasa kayıtlarına ya da MCP onay API'sine erişimi"
  expires_at: null
  revoked: false
