# Self-defense patterns â€” protect Singularity AIDR and Claude Code configuration
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
# These flag when the AI agent may be manipulated into disabling its own guardrails.
# CLT-SELF-001..006 use require_approval (not block) to allow legitimate plugin dev
# and config changes. CLT-SELF-007..009 guard the operator approval channel itself
# and are hard blocks: an ask there would let the agent ask the operator to
# approve the agent's own access to the approval machinery.

# Delete .singularity-aidr directory
# Perf (linear-time rewrite): `\s.*` between the verb and the target was
# rescanned from every occurrence of `rm|del|rd|...` â€” O(n^2) on commands that
# repeat those verbs (~59ms per 20KB, unbounded beyond that). The gap is now
# bounded to 300 characters, several times any realistic argument list
# (`rm -rf $HOME/.singularity-aidr` needs 15).
- id: "CLT-SELF-001"
  category: self_defense
  severity: critical
  confidence: 0.90
  action: require_approval
  pattern: "(rm|del|rmdir|rd|Remove-Item|unlink)\\s.{0,300}\\.singularity-aidr(\\s|[\\\\/]|$)"
  case_insensitive: true
  match_on: command
  title: "Attempt to delete Singularity AIDR configuration directory"
  expires_at: null
  revoked: false

# Access Singularity AIDR config files, the operator approval store or its key
- id: "CLT-SELF-002"
  category: self_defense
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\.singularity-aidr[\\\\/]((allowlist|config|approvals|operator-approval-key)\\.json|operator-approval\\.key)"
  match_on: file_path
  title: "Access Singularity AIDR configuration files"
  expires_at: null
  revoked: false

# Delete Claude Code hook or plugin config
# Perf (linear-time rewrite): two unbounded `.*` spans, each rescanned from
# every occurrence of `rm|del|Remove-Item|unlink` â€” O(n^2) (~57ms per 20KB).
# Both gaps are now bounded to 300 characters, several times any realistic
# path/argument list (`rm ~/.claude/plugins/marketplaces/<repo>/hooks.json`
# needs 16 and 0).
- id: "CLT-SELF-003"
  category: self_defense
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "(rm|del|Remove-Item|unlink)\\s.{0,300}\\.claude[\\\\/].{0,300}(hooks\\.json|installed_plugins)"
  case_insensitive: true
  match_on: command
  title: "Attempt to delete Claude Code hook or plugin configuration"
  expires_at: null
  revoked: false

# Disable Singularity AIDR security features via config
- id: "CLT-SELF-004"
  category: self_defense
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\"heuristics_enabled\"\\s*:\\s*false|\"url_check\"\\s*:\\s*\\{[^}]{0,300}\"enabled\"\\s*:\\s*false"
  match_on: content
  title: "Attempt to disable Singularity AIDR security features via config"
  expires_at: null
  revoked: false

# Forge an approval by writing the agent-writable consumed-approvals store
- id: "CLT-SELF-005"
  category: self_defense
  severity: critical
  confidence: 0.95
  action: require_approval
  pattern: "(>|>>|tee|Set-Content|Out-File|writeFile(?:Sync)?|WriteAllText|cp|copy|mv|move)\\s.{0,300}consumed-approvals-[^\\s\\\"'<>|]{1,300}\\.json|consumed-approvals-[^\\s\\\"'<>|]{1,300}\\.json.{0,100}(>|>>)"
  case_insensitive: true
  match_on: command
  title: "Attempt to forge a Singularity AIDR approval record"
  expires_at: null
  revoked: false

# Disable the AIDR agent service on the host.
- id: "CLT-SELF-006"
  category: self_defense
  severity: high
  confidence: 0.90
  action: require_approval
  pattern: "\\bsystemctl\\b.{0,100}\\b(disable|stop|mask)\\b.{0,100}\\baidr-agent\\.service\\b"
  case_insensitive: true
  match_on: command
  title: "Attempt to disable the AIDR agent service"
  expires_at: null
  revoked: false

# Self-approval: the agent invoking the operator-only approval CLI or forcing its
# non-interactive mode. `aidr approve`, `aidr pending` and `aidr allowlist add`
# are human-only, out-of-band actions, so this is a hard block (deny), never an
# ask: an ask would hand the agent an actionId the operator might approve.
# The protection-weakening CLI commands are operator-only for the same reason:
# `aidr config -s|--set` (heuristics off, disabled threats, lower sensitivity,
# checks or policies off), `aidr uninstall` (removes the hooks) and
# `aidr setup --force|-f` (replaces the configuration). Short-flag clusters
# containing the flag (`-ls`, `-vf`) and `--set=key` are matched too.
# It matches the shell-normalized view (`command_normalized`, see
# packages/core/src/shell-normalize.ts), so quoting (`aidr 'approve'`,
# `"aidr" approve`, `aidr ap\prove`), executable lookups (`$(which aidr)`),
# variables, package runners (`npx @singularityrd/aidr-cli approve`), interpreter
# argv lists (`spawn('aidr', ['approve', id])`) and pty wrappers (`script -qc`,
# `expect`, `unbuffer`, which all carry the inner command) do not hide it.
# Read-only diagnostics (`aidr doctor`, `aidr status`, `aidr audit tail`,
# `aidr allowlist list|remove`, `aidr config -g|--get|-l|--list`, `aidr setup`
# without --force) are not matched.
# The MCP gateway's operator toolset approval (`aidr-mcp-approve`, its package
# runner form and its approve.mjs script) is matched too: it accepts a
# quarantined (changed, "rug-pulled") MCP toolset, so an agent running it would
# approve the very tool descriptions the gateway refused.
- id: "CLT-SELF-007"
  category: self_defense
  severity: critical
  confidence: 0.99
  action: block
  pattern: "\\baidr(?:-cli|-setup)?(?:@[\\w.^~-]{1,40})?(?:/[\\w.@-]{1,100}){0,8}(?:\\.exe|\\.cmd|\\.ps1|\\.js|\\.mjs|\\.cjs)?[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}(?:=\\S{0,200})?[\\s,\\[\\]]{1,20}){0,6}(?:approve|approvals|pending|allowlist[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}[\\s,\\[\\]]{1,20}){0,4}add|uninstall|config[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}(?:=\\S{0,200})?[\\s,\\[\\]]{1,20}(?:[^\\s,\\[\\]-][^\\s,\\[\\]]{0,200}[\\s,\\[\\]]{1,20})?){0,4}(?:--set|-[A-Za-z]{0,6}s[A-Za-z]{0,6})|setup[\\s,\\[\\]]{1,20}(?:-{1,2}[\\w-]{1,40}(?:=\\S{0,200})?[\\s,\\[\\]]{1,20}(?:[^\\s,\\[\\]-][^\\s,\\[\\]]{0,200}[\\s,\\[\\]]{1,20})?){0,4}(?:--force|-[A-Za-z]{0,6}f[A-Za-z]{0,6}))\\b|AIDR_OPERATOR_NONINTERACTIVE|\\baidr-mcp-approve\\b|aidr-mcp-gateway[\\\\/](?:[\\w.-]{1,100}[\\\\/]){0,4}(?:aidr-mcp-)?approve\\.[cm]?js\\b|mcp-gateway[\\\\/](?:src|dist)[\\\\/](?:aidr-mcp-)?approve\\.[cm]?js\\b"
  case_insensitive: true
  match_on: command_normalized
  title: "Attempt to self-approve a Singularity AIDR block, forge an operator approval or weaken its protection"
  expires_at: null
  revoked: false

# Any agent reference to the AIDR state directory. It holds the approval store,
# the allowlist, the config and — when the operator opted into file key storage —
# the approval key, so reading, copying, listing or rewriting anything in it is a
# hard block, whatever the tool: a shell command (`~`, `$HOME`, absolute,
# quoted, `cd` then relative access, globs such as `~/.singul*` or `~/.*`
# resolved by the normalized view), a file tool path, a Write/Edit body that
# would put the path into a script, or an MCP argument. The literal is matched
# after shell normalization, which also joins string concatenations in
# interpreter one-liners (`'/.singular' + 'ity-aidr'`).
# There is no agent-facing read-only exception: AIDR's diagnostics are CLI
# commands (`aidr doctor`, `aidr status`) that do not name the directory.
- id: "CLT-SELF-008"
  category: self_defense
  severity: critical
  confidence: 0.99
  action: block
  pattern: "\\.singularity-aidr"
  case_insensitive: true
  match_on:
    - command_normalized
    - file_path_normalized
    - content_normalized
  title: "Agent access to the Singularity AIDR state directory"
  expires_at: null
  revoked: false

# The approval key, the consumption ledger and the credential vault entries by
# name: `secret-tool lookup service singularity-aidr-cli id aidr-operator-approval-key`,
# `security find-generic-password -s singularity-aidr-cli`, or a file named after
# them, wherever it is.
- id: "CLT-SELF-009"
  category: self_defense
  severity: critical
  confidence: 0.99
  action: block
  pattern: "singularity-aidr-cli\\b|aidr-operator-approval|operator-approval(?:-key|-ledger)?\\.(?:key|json)"
  case_insensitive: true
  match_on:
    - command_normalized
    - file_path_normalized
    - content_normalized
  title: "Agent access to the Singularity AIDR approval key or vault entries"
  expires_at: null
  revoked: false
