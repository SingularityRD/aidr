# ── Permission widening in agent / IDE configuration ────────────────────────

- id: "CTX-CFG-001"
  category: context_poisoning_permission_widening
  severity: critical
  confidence: 0.95
  action: block
  pattern: "\"defaultMode\"\\s{0,4}:\\s{0,4}\"bypassPermissions\"|dangerously[-_]?skip[-_]?permissions|\"disableAllHooks\"\\s{0,4}:\\s{0,4}true|\"enableAllProjectMcpServers\"\\s{0,4}:\\s{0,4}true|\\bapproval_policy\\s{0,4}=\\s{0,4}[\"']never[\"']|\\bsandbox_mode\\s{0,4}=\\s{0,4}[\"']danger-full-access[\"']|dangerously-bypass-approvals-and-sandbox|\"approvalMode\"\\s{0,4}:\\s{0,4}\"yolo\"|\"autoAccept\"\\s{0,4}:\\s{0,4}true|\"chat\\.tools\\.(?:global\\.)?autoApprove\"\\s{0,4}:\\s{0,4}true|\"chat\\.tools\\.terminal\\.autoApprove\"\\s{0,4}:\\s{0,4}\\{[^}]{0,400}\"/\\.\\*/\"\\s{0,4}:\\s{0,4}true|\"task\\.allowAutomaticTasks\"\\s{0,4}:\\s{0,4}\"on\"|\"security\\.workspace\\.trust\\.enabled\"\\s{0,4}:\\s{0,4}false|\"runOn\"\\s{0,4}:\\s{0,4}\"folderOpen\"|\"allow\"\\s{0,4}:\\s{0,4}\\[[^\\]]{0,2000}?\"(?:Bash|Shell)(?:\\((?:\\*{1,2}|:\\*)\\))?\""
  match_on: agent_control_content
  title: "Agent or IDE configuration widened to auto-approve tools, skip permissions or auto-run tasks"
  expires_at: null
  revoked: false

