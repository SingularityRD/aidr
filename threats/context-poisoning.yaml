# Data and context poisoning rules for Singularity AIDR
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
#
# Protects what an agent reads as instructions and what it remembers: agent
# instruction and memory files, agent/IDE/MCP configuration, git hooks and
# shell start-up files, MCP tool metadata and memory/vector-store writes.
# Evaluated by packages/core/src/context-poisoning.ts, which knows the operation
# (write vs read, which file, which MCP tool) that a plain artifact does not.
#
# match_on values used only by the context-poisoning detector:
#   agent_control_path     - path a write/edit/patch/delete or a shell write
#                            (redirect, tee, sed -i, cp/mv target, ...) targets.
#                            Reads never match these rules.
#   agent_control_content  - the text written into a path that matched an
#                            agent_control_path rule (for a shell write, the
#                            whole command line)
#   mcp_tool_metadata      - an MCP tool's name, description and input-schema
#                            strings (MCP gateway tools/list, discovery manifests)
#   memory_write_content   - arguments of an MCP tool that writes to agent
#                            memory or a vector/RAG store
# The heuristics engine never produces these artifact types, so these rules do
# not change verdicts for any other tool call.
#
# Existing rules this file complements rather than duplicates:
#   CLT-FILE-004 / CLT-FILE-009 ask on any file-tool access to shell rc files
#   and .git/hooks; CLT-PERSIST-001/007 cover `>`/`>>` redirects to shell rc
#   files. CTX-PATH-006/007 extend that to every shell write form (tee, cp, mv,
#   sed -i, interpreters) and to hook managers, and let the content written
#   there be scanned.
#
# Every quantifier is bounded (no unbounded `.*` spans).

# ── Agent control paths (writes need out-of-band approval) ──────────────────

- id: "CTX-PATH-001"
  category: context_poisoning
  severity: high
  confidence: 0.90
  action: require_approval
  pattern: "(?:^|/)(?:(?:CLAUDE|AGENTS|GEMINI|CODEX|QWEN|WARP)(?:\\.local)?\\.md|\\.cursorrules|\\.windsurfrules|\\.clinerules|\\.roorules|\\.goosehints|\\.github/copilot-instructions\\.md)$|(?:^|/)\\.github/(?:instructions|prompts|chatmodes)/[^/]{1,200}\\.md$|(?:^|/)\\.(?:cursor|windsurf|roo|continue|kiro|trae|amazonq)/(?:rules|steering)(?:/|$)|(?:^|/)\\.clinerules/"
  case_insensitive: true
  match_on: agent_control_path
  title: "Agent instruction file modified (persistent instructions for every future session)"
  expires_at: null
  revoked: false

