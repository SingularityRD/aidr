# ── Hidden instructions (invisible Unicode) ────────────────────────────────

# Unicode tag characters (U+E0000-E007F) render as nothing but carry ASCII
# text a model reads. The lookbehind exempts emoji subdivision flags
# (U+1F3F4 followed by up to 7 tag characters, e.g. the flag of England).
- id: "CTX-HIDE-001"
  category: context_poisoning_hidden_unicode
  severity: critical
  confidence: 0.99
  action: block
  pattern: "(?<!\\uD83C\\uDFF4(?:\\uDB40[\\uDC20-\\uDC7E]){0,6})\\uDB40[\\uDC00-\\uDC7F]"
  match_on:
    - agent_control_content
    - mcp_tool_metadata
    - memory_write_content
  title: "Invisible Unicode tag characters smuggle hidden instructions"
  expires_at: null
  revoked: false

- id: "CTX-HIDE-002"
  category: context_poisoning_hidden_unicode
  severity: critical
  confidence: 0.95
  action: block
  pattern: "[\\u202A-\\u202E\\u2066-\\u2069]"
  match_on:
    - agent_control_content
    - mcp_tool_metadata
    - memory_write_content
  title: "Bidirectional control characters disguise what the text says (Trojan Source)"
  expires_at: null
  revoked: false

# Zero-width space, word joiner, invisible operators and Mongolian vowel
# separator anywhere; a byte-order mark anywhere but the first character;
# ZWJ/ZWNJ only next to ASCII, so emoji sequences and Persian/Indic text
# (which need them) are not flagged.
- id: "CTX-HIDE-003"
  category: context_poisoning_hidden_unicode
  severity: critical
  confidence: 0.95
  action: block
  pattern: "[\\u200B\\u2060-\\u2064\\u180E]|(?<=[\\s\\S])\\uFEFF|(?<=[\\x00-\\x7F])[\\u200C\\u200D]|[\\u200C\\u200D](?=[\\x00-\\x7F])"
  match_on:
    - agent_control_content
    - mcp_tool_metadata
    - memory_write_content
  title: "Zero-width characters hide text inside agent instructions or metadata"
  expires_at: null
  revoked: false

# ── Injected directives ────────────────────────────────────────────────────

- id: "CTX-INJ-001"
  category: context_poisoning
  severity: critical
  confidence: 0.95
  action: block
  pattern: "\\b(?:ignore|disregard|forget|override)\\s{1,4}(?:all\\s{1,4}|any\\s{1,4}|the\\s{1,4})?(?:previous|prior|above|earlier|preceding|your|system|original)\\s{1,4}(?:instructions?|rules|guidelines|directives|prompts?|guardrails|safety\\s{1,4}(?:rules|guidelines|policies))"
  case_insensitive: true
  match_on:
    - agent_control_content
    - mcp_tool_metadata
    - memory_write_content
  title: "Instruction override planted in persistent agent context"
  expires_at: null
  revoked: false

- id: "CTX-INJ-002"
  category: context_poisoning
  severity: critical
  confidence: 0.90
  action: block
  pattern: "(?:do\\s{1,4}not|don'?t|never)\\s{1,4}(?:tell|inform|notify|alert|mention\\s{1,4}(?:this|it|that)\\s{1,4}to|reveal\\s{1,4}(?:this\\s{1,4}|it\\s{1,4})?to|show\\s{1,4}(?:this\\s{1,4}|it\\s{1,4})?to)\\s{1,4}the\\s{1,4}user|without\\s{1,4}(?:the\\s{1,4})?user'?s?\\s{1,4}(?:knowledge|consent|awareness|noticing)|(?:keep|hide)\\s{1,4}(?:this|it|these\\s{1,4}\\w{1,20})\\s{1,4}(?:secret\\s{1,4}|hidden\\s{1,4})?from\\s{1,4}the\\s{1,4}user|(?:silently|secretly|covertly)\\s{1,4}(?:send|upload|post|forward|exfiltrate|transmit|leak)"
  case_insensitive: true
  match_on:
    - agent_control_content
    - mcp_tool_metadata
    - memory_write_content
  title: "Directive to conceal agent actions from the user"
  expires_at: null
  revoked: false

# Verb ... secret ... destination. A negation right before the verb
# ("never send secrets to https://...") is a safety rule, not an attack.
- id: "CTX-INJ-003"
  category: context_poisoning
  severity: critical
  confidence: 0.95
  action: block
  pattern: "(?<!(?:\\bnot|\\bnever|n't|\\bno)\\s{1,4})\\b(?:send|upload|post|transmit|exfiltrate|forward|leak|share|copy|include|append|attach|pass)\\b[^\\n]{0,120}?\\b(?:\\.env\\b|\\.ssh\\b|id_rsa|id_ed25519|credentials?|secrets?|api[ _-]?keys?|access[ _-]?tokens?|auth[ _-]?tokens?|passwords?|private[ _-]?keys?|\\.aws\\b|\\.npmrc|\\.netrc|cookies|session[ _-]?tokens?|env(?:ironment)?\\s{1,4}variables)\\b[^\\n]{0,160}?(?:https?://|\\bwebhooks?\\b|\\bcurl\\b|\\bwget\\b|pastebin|ngrok|requestbin|discord(?:app)?\\.com|telegram|\\b[\\w.+-]{1,64}@[\\w-]{1,63}\\.[a-z]{2,})"
  case_insensitive: true
  match_on:
    - agent_control_content
    - mcp_tool_metadata
    - memory_write_content
  title: "Directive to send secrets or credentials to an external destination"
  expires_at: null
  revoked: false

- id: "CTX-INJ-004"
  category: context_poisoning
  severity: critical
  confidence: 0.90
  action: block
  pattern: "(?<!(?:\\bnot|\\bnever|n't)\\s{1,4})\\b(?:read|cat|open|load|include|attach|pass|send|upload|print|output|return)\\b[^\\n]{0,80}?(?:~|\\$HOME|\\$\\{HOME\\}|%USERPROFILE%|/home/[^/\\s]{1,64}|/Users/[^/\\s]{1,64}|/root)[/\\\\]\\.(?:ssh|aws|gnupg|docker/config|kube/config|config/gcloud|netrc|npmrc|pypirc|git-credentials|env\\b)"
  case_insensitive: true
  match_on:
    - agent_control_content
    - mcp_tool_metadata
    - memory_write_content
  title: "Directive to read private keys or credential files from the home directory"
  expires_at: null
  revoked: false

- id: "CTX-INJ-005"
  category: context_poisoning
  severity: critical
  confidence: 0.90
  action: block
  pattern: "<\\|(?:im_start|im_end|system|endoftext)\\|>|\\[/?INST\\]|<</?SYS>>|</?(?:system|assistant)_?(?:prompt|message)?\\s{0,4}>"
