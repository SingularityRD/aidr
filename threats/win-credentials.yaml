# cmdkey stored credentials
- id: "CLT-WIN-CRED-001"
  category: secrets
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\b[Cc]mdkey\\s+/add:"
  match_on: command
  title: "Stored credential creation via cmdkey"
  expires_at: null
  revoked: false

# ConvertTo-SecureString with plaintext
- id: "CLT-WIN-CRED-002"
  category: secrets
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "[Cc]onvert[Tt]o-[Ss]ecure[Ss]tring.{0,300}-[Aa]s[Pp]lain[Tt]ext"
  match_on: command
  title: "ConvertTo-SecureString with plaintext password"
  expires_at: null
  revoked: false

# Reading credential files on Windows (type, more, Get-Content)
- id: "CLT-WIN-CRED-003"
  category: secrets
  severity: high
  confidence: 0.80
  action: require_approval
  # SSH private keys also through the cat / gc aliases, with either separator.
  pattern: "\\b(type|more|[Gg]et-[Cc]ontent)\\b.{0,300}\\.(env|credentials|pgpass|netrc)|\\b(type|more|cat|gc|[Gg]et-[Cc]ontent)\\b.{0,300}\\.ssh[\\\\/](?:id_rsa|id_ed25519|id_ecdsa|id_dsa)(?![\\w.])"
  match_on: command
  title: "Reading credential file via type/more/Get-Content"
  expires_at: null
  revoked: false

