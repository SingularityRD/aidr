  pattern: "netsh.{0,300}wlan.{0,300}show.{0,300}profiles.{0,300}key=clear"
  case_insensitive: true
  match_on: command
  title: "WLAN password extraction via netsh"
  expires_at: null
  revoked: false

# --- Windows copy/move/link of secret files ---
- id: "CLT-WIN-CRED-010"
  category: secrets
  severity: high
  confidence: 0.80
  action: require_approval
  # Protected files: .env*, .aws\credentials, .ssh\(id_rsa|id_ed25519|id_ecdsa|id_dsa),
  # .netrc, .pgpass, .npmrc, .pypirc, key.properties, .docker\config.json,
  # kubeconfig, .kube\config, master.key, credentials.yml
  pattern: "\\b(copy|xcopy|robocopy|Copy-Item|Move-Item|mklink)\\b.{0,300}(?<=[\\\\/\\s])(\\.env(?!\\S{0,300}\\.(example|sample|template|dist)\\b)(\\.\\w{1,300})?(?=[\\s\\\\/]|$)|\\.aws[\\\\/]credentials|\\.ssh[\\\\/](id_rsa|id_ed25519|id_ecdsa|id_dsa)|\\.netrc|\\.pgpass|\\.npmrc|\\.pypirc|key\\.properties|\\.docker[\\\\/]config\\.json|kubeconfig|\\.kube[\\\\/]config|master\\.key|credentials\\.yml)"
  case_insensitive: true
  match_on: command
  title: "Windows copy/move of credential or secret file"
  expires_at: null
  revoked: false

