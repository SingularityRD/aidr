# macOS persistence mechanism threat patterns for Singularity AIDR
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
# Covers: LaunchAgents, Login Items, Authorization plugins, periodic scripts, emond, dylib hijack

# LaunchAgent/LaunchDaemon plist (migrated from persistence.yaml CLT-PERSIST-004)
- id: "CLT-MAC-PERSIST-001"
  category: tool
  severity: high
  confidence: 0.90
  action: block
  pattern: "(LaunchAgents|LaunchDaemons)/.{0,300}\\.plist"
  match_on: command
  title: "macOS LaunchAgent/LaunchDaemon persistence"
  expires_at: null
  revoked: false

# Login Items via osascript
# Perf (linear-time rewrite): unbounded `.*` rescanned from every `osascript`
# occurrence (~68ms per 20KB, ~460ms at the 64KB match cap). Bounded to 300
# characters, far beyond a real `osascript -e '... make login item ...'` call.
- id: "CLT-MAC-PERSIST-002"
  category: tool
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\bosascript\\b.{0,300}login item"
  case_insensitive: true
  match_on: command
  title: "Add login item via osascript"
  expires_at: null
  revoked: false

# Login window manipulation via defaults
- id: "CLT-MAC-PERSIST-003"
  category: tool
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\bdefaults\\b.{0,300}\\bwrite\\b.{0,300}loginwindow.{0,300}(AutoLaunch|LoginHook|LogoutHook)"
  case_insensitive: true
  match_on: command
  title: "Login window hook manipulation via defaults write"
  expires_at: null
  revoked: false

