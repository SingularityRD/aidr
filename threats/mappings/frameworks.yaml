# Security framework mapping for the shipped detection rules.
#
# This file is DATA, like the rules themselves, but it is deliberately kept out
# of the top level of threats/: the threat loader only reads threats/*.yaml, so
# nothing here can be mistaken for a rule. Every connector copies threats/
# recursively, so the mapping ships next to the rules it describes and the
# runtime attaches it to verdicts and audit entries (`frameworks`).
#
# Identifiers (validated against packages/core/src/framework-catalog.ts):
#   LLM01..LLM10  OWASP Top 10 for LLM Applications 2025
#   ASI01..ASI10  OWASP Top 10 for Agentic Applications 2026
#   AML.Txxxx     MITRE ATLAS technique or sub-technique (content release 2026.09)
#
# A rule's effective mapping is the union of its file default, its category
# default and its own entry. EVERY rule id in threats/*.yaml must have an entry
# under `rules` (use [] when the defaults already say everything); the test
# suite fails for an unmapped rule, so a newly added rule cannot ship unmapped.
#
# A mapping says "this rule detects behaviour that is an instance of that risk
# or technique at the point AIDR sees it: an agent's tool call, a tool input or
# a skill/plugin file". It does not claim the rule prevents every variant of
# the risk. The per-item `assessments` state how far the rules actually go.
#
# After editing, regenerate docs/framework-coverage.md and the dashboard
# artifact with `pnpm coverage:frameworks -- --write`; `pnpm coverage:frameworks`
# alone is the drift check.

schema_version: 1

assessments:
  owasp_llm:
    LLM01:
      status: partial
      rationale: >-
        Pattern rules catch known direct and indirect injection phrasing, chat-template
        special tokens, jailbreak personas and instruction-hijack text inside skill files.
        They are regular expressions over tool inputs and plugin content: paraphrased,
        translated or novel injections are not reliably detected, and model-side input is
        not inspected by these rules.
    LLM02:
      status: covered
      rationale: >-
        For an agent's tool calls the rules cover the main disclosure paths: reading
        credential, key, cloud, keychain and browser stores, known API-key formats in
        commands or content, and exfiltration over HTTP, DNS, archives and cloud or code
        repositories. Personal data inside model responses is out of scope for these rules
        and is handled by the separate DLP/privacy engine.
    LLM03:
      status: partial
      rationale: >-
        Rules flag install-script piping, unpinned or unsigned package installs, miner
        packages, insecure dependency sources and malicious skill/plugin content. For models,
        downloads from Hugging Face organisations or hosts outside the trusted model sources,
        weight downloads over plain HTTP, trust_remote_code and unsafe model deserialization
        are held or denied. Model files are not verified by hash or signature, dataset
        provenance is not checked, and package reputation needs the separately deployed
        package-check endpoint (inert when none is configured).
    LLM04:
      status: partial
      rationale: >-
        AIDR sits at the agent's tool-call boundary and never sees training or fine-tuning
        data, so poisoned training data and backdoored weights are not detected. Two steps
        are covered. The loading step through which a tampered model file runs code:
        torch.load without weights_only, pickle/joblib/dill on downloads, Keras
        safe_mode=False and numpy allow_pickle=True in code the agent writes or runs; a
        poisoned model in a data-only format (for example .safetensors) passes. And what an
        agent writes into memory and vector/RAG stores through MCP tools, which is scanned
        for hidden or injected instructions and standing orders before it is stored; records
        without those signals, and stores written outside the agent, are not detected.
        Runtime memory and context poisoning of an agent is tracked under ASI06.
    LLM05:
      status: covered
      rationale: >-
        Model-generated commands and code are validated before they execute: pipe-to-shell,
        reverse shells, eval of decoded payloads, LOLBin and script-host execution and
        obfuscated command lines are denied or held for approval at the tool boundary. Code
        the agent writes is also checked by the secure-code guardrails (eval or shell
        commands built from input, SQL built by string formatting, TLS verification off,
        permissive CORS, exposed debuggers, CSRF off, weak crypto); those are
        language-gated patterns over added lines and warn by default rather than block.
        Output rendered in a UI (XSS, markdown links) is not covered by these rules.
    LLM06:
      status: covered
      rationale: >-
        The rule set is primarily an excessive-agency control: destructive deletion,
        persistence, privilege changes, security-control tampering, credential access and
        discovery performed through the agent's tools are denied or require out-of-band
        human approval.
    LLM07:
      status: partial
      rationale: >-
        Three rules flag system-prompt extraction requests (direct, repetition and
        translation tricks) in tool inputs. Leakage through model output and indirect
        extraction phrasing outside those patterns are not detected.
    LLM08:
      status: not_applicable
      rationale: >-
        AIDR does not operate a retrieval pipeline, vector store or embedding service, so
        there is nothing for a tool-call rule to inspect for this risk.
    LLM09:
      status: not_applicable
      rationale: >-
        Detection rules judge what an agent does, not whether model output is true.
        Hallucinated-package risk is partly addressed by the separate package-reputation
        check, not by these rules.
    LLM10:
      status: partial
      rationale: >-
        Cryptominer binaries, pools, wallets and miner flags launched through an agent are
        blocked (compute hijacking). Token, request-rate and cost exhaustion of the model
        API itself are outside what these rules observe.
  owasp_agentic:
    ASI01:
      status: partial
      rationale: >-
        Injection, triggered-instruction and hidden-instruction patterns in tool inputs and
        skill files are detected. Goal hijack that uses ordinary wording, or that only shows
        up as a changed plan, is not visible to pattern rules; the resulting harmful tool
        calls are still caught by the ASI02/ASI05 rules.
    ASI02:
      status: covered
      rationale: >-
        This is the enforcement point of the product: every rule evaluates a tool call
        (shell command, file path, URL or tool input) before it runs, and dangerous uses of
        legitimate tools are denied or held for out-of-band approval.
    ASI03:
      status: covered
      rationale: >-
        Credential dumping, credential-store and key access, alternate-credential execution,
        sudo/UAC abuse, account creation and group changes, and access to AIDR's own
        approval key are detected. Delegated agent identity (tokens issued to the agent) is
        verified by the delegated-credential feature, not by these rules.
    ASI04:
      status: partial
      rationale: >-
        Skill and plugin packages are scanned for injected instructions, remote payloads,
        embedded code, credential exfiltration and insecure dependencies, and risky install
        commands are flagged. Models from untrusted Hugging Face organisations or hosts,
        plain-HTTP weight downloads, trust_remote_code and unsafe model loading are held or
        denied. MCP server identity and signed manifests are enforced by the MCP gateway
        rather than these rules; model integrity (hash or signature) and dataset provenance
        are not covered.
    ASI05:
      status: covered
      rationale: >-
        Download-and-execute chains, pipe-to-shell, reverse shells, encoded or obfuscated
        execution, script hosts and LOLBins on Linux, macOS and Windows are denied before
        the command runs. Loading model files through code-executing deserializers and
        trust_remote_code are held or denied, and eval, shell commands built from input and
        network-exposed debuggers in code the agent writes are flagged by the (advisory)
        secure-code guardrails.
    ASI06:
      status: partial
      rationale: >-
        Content that asks the agent to persist instructions in memory, and skill files that
        write into agent memory or instruction files, are flagged. Every agent write to an
        instruction, memory, configuration or MCP file needs out-of-band approval, and the
        written text, memory-store writes and MCP tool descriptions are scanned for hidden
        Unicode and injected directives. Poisoning through ordinary-looking stored content
        or retrieval data is not detected.
    ASI07:
      status: not_covered
      rationale: >-
        No rule inspects agent-to-agent messages or protocols (A2A, shared task queues).
        MCP traffic is inspected by the MCP gateway, which is a separate component.
    ASI08:
      status: not_covered
      rationale: >-
        Rules act on single tool calls on one host; they do not model failure propagation
        across agents or workflows. Blocking a harmful call limits blast radius but is not
        claimed as coverage of this risk.
    ASI09:
      status: partial
      rationale: >-
        Rules flag skills that tell the agent to hide actions from the user and agent
        attempts to forge or self-issue the human approval AIDR requires. Persuasive or
        misleading agent output shown to a human is not analysed.
    ASI10:
      status: partial
      rationale: >-
        Behaviour typical of a compromised or rogue agent is detected: tampering with or
        disabling AIDR itself, reading or changing AIDR's canary credentials, disabling OS
        security controls, clearing logs and hiding artifacts. Slow behavioural drift within allowed actions is not something a
        per-call rule can see (the behavioural analyzer is a separate, optional detector).
  mitre_atlas:
    AML.T0010.003:
      status: partial
      rationale: >-
        The routes by which a compromised model reaches the agent's host are flagged:
        downloads from Hugging Face organisations or hosts outside the trusted model
        sources, weight downloads over plain HTTP, remote model code and code-executing
        model formats. A compromised model from a trusted publisher, or tampered weights in
        a data-only format, are not detected; files are not verified by hash or signature.
    AML.T0011:
      status: partial
      rationale: >-
        Enabling trust_remote_code (in code or on a serving command line), which runs Python
        shipped in a model repository, is held for approval and denied for publishers
        outside the trusted model sources.
    AML.T0011.000:
      status: partial
      rationale: >-
        Loading unsafe AI artifacts is held or denied: torch.load without weights_only,
        pickle/joblib/dill on downloaded files or network responses, Keras safe_mode=False,
        numpy allow_pickle=True and unsafe YAML loaders. The Python patterns apply to code
        the agent writes or runs; a loader reached through a library wrapper the patterns
        do not name is missed.
    AML.T0010.005:
      status: partial
      rationale: >-
        Skill and plugin packages are scanned before use against the T01-T09 skill risk taxonomy.
        Compromise of a remotely hosted tool that changes after the scan is not visible.
    AML.T0011.001:
      status: partial
      rationale: Installs of known miner packages and unsigned remote installer packages are flagged.
    AML.T0012:
      status: partial
      rationale: Running commands under alternate user credentials (runas) is held for approval.
    AML.T0025:
      status: covered
      rationale: >-
        Sensitive-file upload, DNS-label exfiltration, alternative protocols, automated
        exfiltration tooling and transfers to code repositories or cloud storage are detected.
    AML.T0048.000:
      status: partial
      rationale: >-
        Cryptomining through an agent (a direct financial harm to the victim) is blocked;
        other financial harms are out of scope.
    AML.T0050:
      status: covered
      rationale: >-
        Shell, PowerShell, AppleScript/JXA, Python and script-host execution patterns used for
        remote payloads, obfuscation and proxy execution are detected across all three OSes.
    AML.T0051:
      status: partial
      rationale: Known injection and jailbreak phrasing only; see OWASP LLM01.
    AML.T0051.001:
      status: partial
      rationale: >-
        Indirect-injection phrasing in tool content and instruction-hijack text in skills is
        detected; unseen wording is not.
    AML.T0053:
      status: covered
      rationale: >-
        Every tool call the agent makes is evaluated against the rules before it executes; a
        hijacked agent's tool invocations are the input AIDR inspects.
    AML.T0054:
      status: partial
      rationale: Known jailbreak personas and tokens (DAN, developer mode) are detected.
    AML.T0055:
      status: covered
      rationale: >-
        Reads, copies and archives of credential files, SSH and cloud keys, keychains, browser
        stores, registry credentials, cloud metadata credentials and plaintext secrets are
        detected.
    AML.T0056:
      status: partial
      rationale: Three system-prompt extraction patterns; see OWASP LLM07.
    AML.T0068:
      status: partial
      rationale: >-
        Hidden or encoded instructions, zero-width and Unicode tag characters, bidi controls
        and hidden HTML comments are detected.
    AML.T0070:
      status: partial
      rationale: >-
        Agent writes to vector/RAG stores through MCP tools are scanned for hidden or injected
        instructions before they are stored. Documents ingested outside the agent are not seen.
    AML.T0072:
      status: covered
      rationale: >-
        Reverse shells over /dev/tcp, netcat, Python, Ruby, zsh and .NET sockets and C2-style
        paste-site or raw-IP URLs are detected.
    AML.T0074:
      status: partial
      rationale: Shadowing security-relevant commands with aliases, functions or PATH prefixes is flagged.
    AML.T0075:
      status: partial
      rationale: >-
        Account, group, peripheral, software and network-service enumeration commands are
        held for approval.
    AML.T0079:
      status: partial
      rationale: Fetching payloads from known staging locations (raw GitHub malware paths, paste sites, executable URLs) is flagged.
    AML.T0080:
      status: partial
      rationale: Requests to persist instructions in agent memory are detected; see OWASP ASI06.
    AML.T0080.000:
      status: partial
      rationale: Memory-persistence instructions in content and in skill files are detected.
    AML.T0081:
      status: covered
      rationale: >-
        Edits that remove agent hooks, disable AIDR, rewrite hook/MCP/permission configuration
        or disable permission prompts are held or denied, and AIDR's own state is protected.
    AML.T0086:
      status: partial
      rationale: Tool inputs that send data to webhooks or external collection services are held for approval.
    AML.T0089:
      status: partial
      rationale: Password-policy, domain-trust, security-software and host-configuration discovery commands are held for approval.
    AML.T0090:
      status: covered
      rationale: >-
        LSASS, SAM, NTDS, LSA secrets, cached credentials, DCSync, /etc/shadow and Mimikatz
        dumping are denied.
    AML.T0094:
      status: partial
      rationale: Content that defers instructions until a later user request ("when the user asks ... ignore") is detected.
    AML.T0101:
      status: covered
      rationale: >-
        Recursive root/home/system deletion, disk formatting and wiping, backup and shadow-copy
        deletion and deletion of .env, database and .git data are denied or held.
    AML.T0110.000:
      status: partial
      rationale: Instruction-hijack and hidden-instruction text in skill instruction files is flagged before use.
    AML.T0110.001:
      status: partial
      rationale: >-
        Skill code with remote payloads, encoded execution, reverse shells, credential
        exfiltration, persistence or privilege escalation is flagged.
    AML.T0113:
      status: partial
      rationale: Access to Safari and Windows browser cookie/credential stores is detected.
    AML.T0123:
      status: covered
      rationale: >-
        Base64/hex/char-code/XOR payloads, caret and backtick obfuscation, encoded PowerShell,
        steganography tooling and unreviewable bytecode are detected.
    AML.T0125:
      status: partial
      rationale: Local and domain account creation commands are held for approval.
    AML.T0127:
      status: partial
      rationale: Archiving of credential files, password-protected archives and bulk document archiving are held for approval.

