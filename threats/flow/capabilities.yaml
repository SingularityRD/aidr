# Credential stores, key material and data dumps, matched against a normalized
# path (home spellings collapsed to `~`, backslashes to `/`). The first match wins.
# kind: sensitive_file | database_dump. secret: credential-grade material.
sensitive_paths:
  - label: 'SSH private key'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.ssh[\\/](?:id_[a-z0-9_-]+|identity)(?!\.pub)$'
    flags: i
  - label: 'cloud credentials'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.aws[\\/](?:credentials|config|sso[\\/]cache[\\/].+)$'
    flags: i
  - label: 'cloud credentials'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.config[\\/]gcloud[\\/].*(?:credential|token|\.json$|\.db$)'
    flags: i
  - label: 'cloud credentials'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.azure[\\/](?:accessTokens\.json|msal_token_cache.*|azureProfile\.json)$'
    flags: i
  - label: 'environment secrets file'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.env(?:\.(?!example$|sample$|template$|dist$|defaults?$)[\w-]{1,40})?$'
    flags: i
  - label: 'credential file'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.(?:netrc|pgpass|npmrc|pypirc|git-credentials|my\.cnf|vault-token|boto)$'
    flags: i
  - label: 'registry credentials'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.docker[\\/]config\.json$'
    flags: i
  - label: 'cluster credentials'
    kind: sensitive_file
    secret: true
    pattern: '(?:(?:^|[\\/])\.kube[\\/]config|(?:^|[\\/])kubeconfig(?:\.ya?ml)?)$'
    flags: i
  - label: 'GitHub CLI token'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.config[\\/]gh[\\/]hosts\.ya?ml$'
    flags: i
  - label: 'private keyring'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])\.gnupg[\\/](?:private-keys-v1\.d|secring\.gpg)'
    flags: i
  - label: 'key material'
    kind: sensitive_file
    secret: true
    pattern: '\.(?:pem|key|p12|pfx|jks|keystore|ppk|kdbx|ovpn)$'
    flags: i
  - label: 'credential file'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])(?:credentials|secrets?|service[-_]?account(?:[-_][\w-]{0,40})?)\.(?:json|ya?ml|toml|ini|txt)$'
    flags: i
  - label: 'secret store'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])(?:master\.key|credentials\.yml\.enc|terraform\.tfstate(?:\.backup)?)$'
    flags: i
  - label: 'system password store'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])etc[\\/](?:shadow|gshadow|sudoers|master\.passwd)$'
    flags: i
  - label: 'browser credential store'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])(?:Login Data|Cookies|Local State|key[34]\.db|logins\.json|cookies\.sqlite)$'
    flags: i
  - label: 'OS keychain'
    kind: sensitive_file
    secret: true
    pattern: '(?:^|[\\/])(?:Library[\\/]Keychains|\.local[\\/]share[\\/]keyrings)(?:[\\/]|$)'
    flags: i
  - label: 'crypto wallet'
    kind: sensitive_file
    secret: true
    pattern: '(?:(?:^|[\\/])wallet\.dat|(?:^|[\\/])\.(?:bitcoin|ethereum)[\\/]keystore)'
    flags: i
  - label: 'shell history'
    kind: sensitive_file
    secret: false
    pattern: '(?:^|[\\/])\.(?:bash|zsh|sh|psql|mysql|python)_history$'
    flags: i
  - label: 'database dump'
    kind: database_dump
    secret: true
    pattern: '(?:^|[\\/])[^\\/]*(?:dump|backup)[^\\/]*\.(?:sql|dump|bak|gz|tar|zip)$|\.dump$'
    flags: i

# Commands that print credentials or dump a database (matched on the command text).
# kind: credential_command | database_dump.
credential_commands:
  - label: 'environment dump'
    kind: credential_command
    pattern: '(?:^|[;&|(]\s*)(?:printenv|env|set)\s*(?:$|[;&|>)])'
  - label: 'process environment'
    kind: credential_command
    pattern: '\/proc\/(?:self|\d+)\/environ\b'
  - label: 'keychain read'
    kind: credential_command
    pattern: '\bsecurity\s+(?:find-(?:generic|internet)-password|dump-keychain)\b'
  - label: 'private key export'
    kind: credential_command
    pattern: '\bgpg2?\b[^\n]{0,200}--export-secret-(?:sub)?keys\b'
  - label: 'cloud secret read'
    kind: credential_command
    pattern: '\baws\s+(?:configure\s+(?:get|export-credentials)|sts\s+get-session-token|secretsmanager\s+get-secret-value|ssm\s+get-parameters?\b[^\n]{0,200}--with-decryption)'
  - label: 'cloud token read'
    kind: credential_command
    pattern: '\bgcloud\s+auth\s+(?:application-default\s+)?print-(?:access|identity)-token\b'
  - label: 'cloud token read'
    kind: credential_command
    pattern: '\baz\s+account\s+get-access-token\b'
  - label: 'GitHub token read'
    kind: credential_command
    pattern: '\bgh\s+auth\s+(?:token|status\s+[^\n]{0,40}--show-token)\b'
  - label: 'git credential read'
    kind: credential_command
    pattern: '\bgit\s+credential\s+fill\b'
  - label: 'cluster secret read'
    kind: credential_command
    pattern: '\bkubectl\s+get\s+secrets?\b'
  - label: 'vault secret read'
    kind: credential_command
    pattern: '\bvault\s+(?:kv\s+get|read)\b'
  - label: 'password manager read'
    kind: credential_command
    pattern: '\bop\s+(?:read|item\s+get)\b'
  - label: 'database dump'
    kind: database_dump
    pattern: '\b(?:pg_dump|pg_dumpall|mysqldump|mariadb-dump|mongodump|mongoexport)\b|\bsqlite3\b[^\n]{0,200}\.dump\b'

# Destructive commands for the injection_to_action chain. `rm -r` of a broad
# target is matched separately (broad_delete_targets / broad_delete_patterns).
destructive_commands:
  - label: 'git force push'
    pattern: '\bgit\s+(?:-[Cc]\s+\S+\s+)*push\b[^\n;&|]{0,300}?(?:\s--force(?:-with-lease)?\b|\s-f\b|\s--mirror\b|\s\+\S)'
  - label: 'git reset --hard'
    pattern: '\bgit\s+reset\s+[^\n;&|]{0,100}--hard\b'
  - label: 'git clean -f'
    pattern: '\bgit\s+clean\s+-[a-zA-Z]*f'
  - label: 'find -delete'
    pattern: '\bfind\b[^\n;&|]{0,300}\s(?:-delete\b|-exec\s+rm\b)'
  - label: 'disk/file wipe'
    pattern: '\b(?:mkfs(?:\.\w+)?|wipefs|shred)\b'
  - label: 'raw device write'
    pattern: '\bdd\b[^\n;&|]{0,200}\bof=\/dev\/'
  - label: 'recursive permission change on home or root'
    pattern: '\bch(?:mod|own)\s+-R\b[^\n;&|]{0,200}\s(?:\/|~|\$HOME|\$\{HOME\})(?:\s|$)'
  - label: 'SQL drop/truncate'
    pattern: '\b(?:drop\s+(?:table|database|schema)|truncate\s+table)\b'
    flags: i
  - label: 'SQL delete without WHERE'
    pattern: '\bdelete\s+from\s+[\w."`]+\s*(?:;|$|["''])'
    flags: i
  - label: 'terraform destroy'
    pattern: '\bterraform\s+(?:destroy\b|apply\b[^\n;&|]{0,200}-destroy\b)'
  - label: 'pulumi destroy'
    pattern: '\bpulumi\s+destroy\b'
  - label: 'kubectl delete'
    pattern: '\bkubectl\s+delete\b'
  - label: 'helm uninstall'
    pattern: '\bhelm\s+(?:uninstall|delete)\b'
  - label: 'S3 recursive delete'
    pattern: '\baws\s+s3\s+(?:rm\b[^\n;&|]{0,300}--recursive|rb\b)'
  - label: 'bucket recursive delete'
    pattern: '\bgsutil\s+(?:-m\s+)?rm\s+-r\b'
  - label: 'docker prune'
    pattern: '\bdocker\s+(?:system\s+prune\b|volume\s+(?:rm|prune)\b)'
  - label: 'crontab removal'
    pattern: '\bcrontab\s+-r\b'
  - label: 'recursive delete'
    pattern: '\bRemove-Item\b[^\n;&|]{0,300}-Recurse\b'
    flags: i
  - label: 'recursive delete'
    pattern: '\b(?:rd|rmdir)\s+\/s\b'
    flags: i

# `rm -r` targets that count as a broad delete (exact match, quotes stripped).
broad_delete_targets:
  - '/'
  - '/*'
  - '~'
  - '~/'
  - '~/*'
  - '$HOME'
  - '${HOME}'
  - '$HOME/'
  - '$HOME/*'
  - '*'
  - '.'
  - './'
  - './*'
  - '..'
  - '../'
  - '.*'
  - '.git'
  - './.git'
broad_delete_patterns:
  - '^\/[^/]+\/?\*?$'
  - '^\/(?:home|Users)\/[^/]+\/?\*?$'
  - '^(?:~|\$HOME|\$\{HOME\})\/[^/]+\/?\*?$'
  - '^[A-Za-z]:[\\/]?$'

# Words skipped before the executable of a shell stage (`sudo`, `env A=B`, `timeout 5`).
command_prefixes:
  - 'sudo'
  - 'doas'
  - 'command'
  - 'exec'
  - 'time'
  - 'nohup'
  - 'nice'
  - 'ionice'
  - 'stdbuf'
  - 'timeout'
  - 'env'
  - 'builtin'

# Executables by role, matched on the lower-cased basename (`.exe` stripped).
executables:
  http_clients:
    - 'curl'
    - 'wget'
    - 'http'
    - 'https'
    - 'xh'
    - 'xhs'
    - 'httpie'
    - 'aria2c'
    - 'invoke-webrequest'
    - 'iwr'
    - 'invoke-restmethod'
    - 'irm'
    - 'lwp-request'
    - 'fetch'
  raw_socket_clients:
    - 'nc'
    - 'ncat'
    - 'netcat'
    - 'socat'
    - 'telnet'
  copy_clients:
    - 'scp'
    - 'rsync'
    - 'sftp'
  mail_clients:
    - 'sendmail'
    - 'mail'
    - 'mailx'
    - 'mutt'
    - 'swaks'
    - 'msmtp'
    - 's-nail'
  dns_clients:
    - 'dig'
    - 'nslookup'
    - 'host'
    - 'drill'
  interpreters:
    - 'python'
    - 'python3'
    - 'python2'
    - 'node'
    - 'nodejs'
    - 'ruby'
    - 'perl'
    - 'php'
    - 'deno'
    - 'bun'
  shells:
    - 'sh'
    - 'bash'
    - 'zsh'
    - 'dash'
    - 'ksh'
    - 'fish'

# Interpreter one-liners (`python -c`, `node -e`): code that uses a network API,
# and the hint that it sends a payload rather than only fetching.
interpreter_network_api:
  pattern: '(?:requests\.|urllib|http\.client|urlopen|fetch\(|axios|XMLHttpRequest|net\.connect|socket\.|Net::HTTP|LWP|HTTP::Tiny|curl_exec|file_get_contents\(\s*[''"]https?)'
interpreter_payload_hint:
  pattern: '(?:post|put|patch|body|data=|json=|send|write|sendall)'
  flags: i

# Tool-name patterns, matched on the tool name (for MCP tools, the tool part of
# `mcp__<server>__<tool>`).
tool_names:
  # Tools that send data out (messages, issues, uploads, webhooks).
  send:
    pattern: '(?:^|[_\-.])(?:send|post|publish|upload|e?mail|message|notify|tweet|webhook|share|reply|comment|dm|chat_?post|create_(?:issue|comment|gist|pull_request|pr|message|post|note|page|message))(?:$|[_\-.])'
    flags: i
  # Browser, scraper and fetch tools: their output is untrusted web content.
  web_read:
    pattern: '(?:browser|browse|navigate|playwright|puppeteer|scrape|crawl|firecrawl|web_?search|search_?web|web_?fetch|fetch_?url|http_?get|read_?url|open_?url|google_?search|brave_?search|tavily|exa_?search)'
    flags: i
  # Search tools (the whole tool name).
  web_search:
    pattern: '^(?:web_?search|search_?web|google_?search|brave_?search|tavily_?search|exa_?search)$'
    flags: i
  # Tools that read a file; writes are not reads.
  file_read:
    pattern: '(?:^|_)(?:read|get|cat|view|open|download|load|show|head|tail)(?:_|$)'
    flags: i
