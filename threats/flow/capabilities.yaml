# Toxic-flow capability patterns (docs/toxic-flow.md).
#
# Which tool calls contribute each session capability: private data access,
# untrusted content exposure and external communication. These are not
# single-call threat rules (they never block a call on their own), so they live
# under threats/flow/ and are not counted with the threats/*.yaml rule files.
#
# Loaded by packages/core/src/toxic-flow-capabilities.ts. Connectors read this
# file from their bundled threats directory; the core also embeds a byte-for-byte
# copy (toxic-flow-capabilities.data.ts, regenerated by
# `node packages/core/scripts/embed-flow-capabilities.mjs`) that is used when a
# threats directory has no flow/capabilities.yaml, for example the MCP gateway's
# embedded rule set. A drift test fails when the two differ.
#
# Patterns are JavaScript regular expressions. `flags` accepts i, m, s and u.
# An invalid file is rejected as a whole and the embedded copy is used instead.

schema_version: 1

# Package registries, language docs and source hosts. A plain request to one of
# them is not external communication; a request that carries a payload still is.
# Extended per install by `toxic_flow.trusted_domains`.
trusted_domains:
  - 'registry.npmjs.org'
  - 'npmjs.com'
  - 'registry.yarnpkg.com'
  - 'yarnpkg.com'
  - 'pypi.org'
  - 'files.pythonhosted.org'
  - 'pythonhosted.org'
  - 'crates.io'
  - 'docs.rs'
  - 'rust-lang.org'
  - 'proxy.golang.org'
  - 'sum.golang.org'
  - 'pkg.go.dev'
  - 'go.dev'
  - 'golang.org'
  - 'rubygems.org'
  - 'repo.maven.apache.org'
  - 'repo1.maven.org'
  - 'plugins.gradle.org'
  - 'services.gradle.org'
  - 'nuget.org'
  - 'packagist.org'
  - 'jsr.io'
  - 'deno.land'
  - 'nodejs.org'
  - 'python.org'
  - 'developer.mozilla.org'
  - 'conda.anaconda.org'
  - 'repo.anaconda.com'
  - 'deb.debian.org'
  - 'archive.ubuntu.com'
  - 'security.ubuntu.com'
  - 'dl-cdn.alpinelinux.org'
  - 'registry-1.docker.io'
  - 'registry.hub.docker.com'
  - 'ghcr.io'
