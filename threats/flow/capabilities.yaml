  - 'termbin.com'
  - '0x0.st'
  - 'transfer.sh'
  - 'file.io'
  - 'tmpfiles.org'
  - 'catbox.moe'
  - 'gofile.io'
  - 'anonfiles.com'
  - 'rentry.co'
  - 'privatebin.net'
  - 'justpaste.it'
  - 'controlc.com'
  - 'gist.github.com'
  - 'gist.githubusercontent.com'
  - 'webhook.site'
  - 'requestbin.net'
  - 'requestcatcher.com'
  - 'pipedream.net'
  - 'beeceptor.com'
  - 'hookbin.com'
  - 'ngrok.io'
  - 'ngrok-free.app'
