# osascript 'do shell script' wrapping (shell via AppleScript)
# Perf (linear-time rewrite): the unbounded `.*` was rescanned from every
# `osascript` occurrence (~40ms per 20KB, ~520ms at the 64KB match cap and
# unbounded growth beyond). Bounded to 300 characters, far beyond
# `osascript -e 'do shell script "..."'`.
- id: "CLT-MAC-OBFUS-001"
  category: tool
  severity: critical
  confidence: 0.90
  action: block
  pattern: "\\bosascript\\b.{0,300}do shell script"
  case_insensitive: true
  match_on: command
  title: "Shell command obfuscated via AppleScript do shell script"
  expires_at: null
  revoked: false

# JXA (JavaScript for Automation) execution
# Perf: both unbounded `.*` gaps bounded to 300 characters (see CLT-MAC-OBFUS-001).
- id: "CLT-MAC-OBFUS-002"
  category: tool
  severity: critical
  confidence: 0.90
  action: block
  pattern: "\\bosascript\\b.{0,300}-l\\s+JavaScript.{0,300}-e"
  case_insensitive: true
  match_on: command
  title: "JXA inline execution (JavaScript for Automation obfuscation)"
  expires_at: null
  revoked: false

# Base64 decode piped to osascript
- id: "CLT-MAC-OBFUS-003"
  category: tool
  severity: critical
  confidence: 0.95
  action: block
  # Gap sizing: the decoded payload is produced inline
  # (`echo <base64> | base64 -d | osascript ...`), so the span before the pipe can
  # be long — no bound is imposed. The gaps are "tempered" so they cannot step
  # over the rule's own anchor (`(?!(?:base64))[^\n]`): same match set as `.*`
  # (a match can be re-anchored at the last `base64`), but a scan stops at the
  # next anchor instead of rescanning the tail, which is what made the original
  # quadratic. Measured on 64KB of repeated `base64 -d`: `.*` 843ms,
  # `[^|]{0,600}` 15ms, tempered 0.5ms.
  pattern: "base64\\s+(-d|-D|--decode)(?:(?!base64)[^\\n])*\\|(?:(?!base64)[^\\n])*osascript"
  match_on: command
  title: "Base64 decode piped to osascript (encoded payload execution)"
  expires_at: null
  revoked: false

