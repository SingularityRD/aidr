# Agent-safety guardrails for autonomous coding agents
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
# Schema: id, category, severity, confidence, action, pattern, match_on, title,
#         expires_at, revoked; file-edit view rules add diff and min_matches.
# Runaway guardrails (loops, rate spikes, budgets) are session-level and live in
# packages/core/src/agent-safety/runaway-guard.ts (ids CLT-AGENT-RUN-001..008).
# Every gap is bounded (see regex-performance.test.ts).

# ── 2a. Reward hacking / sabotage — shell commands ─────────────────────
# An agent weakening the checks it is graded by (skipping git hooks,
# deleting tests) or destroying the record of what it did (history, logs,
# force-pushed branches). Always `ask`: a human decides.

- id: "CLT-AGENT-RH-001"
  category: reward_hacking
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\bgit\\s(?:[^\\n;&|]{0,200}?\\s)?(?:commit|push|merge|rebase|cherry-pick|am|revert|pull)\\s(?:[^\\n;&|]{0,300}?\\s)?--no-verify\\b|\\bgit\\s(?:-[Cc]\\s{1,4}\\S{1,200}\\s{1,4}){0,4}commit\\s(?:[^\\n;&|]{0,300}?\\s)?-[aqsSvez]{0,4}n[aqsSvezm]{0,4}(?=\\s|$)|\\bgit\\s(?:[^\\n;&|]{0,200}?\\s)?(?:-c\\s{1,4}|config\\s{1,4}(?:--[\\w-]{1,20}\\s{1,4}){0,2})core\\.hooksPath(?:=|\\s{1,4})[\"']?(?:/dev/null|NUL\\b|[\"']{2})"
  match_on:
    - command
    - command_normalized
  title: "Agent bypasses git pre-commit / pre-push checks (--no-verify, commit -n, hooksPath=/dev/null)"
  expires_at: null
  revoked: false

