# Credential stores reached by path for Singularity AIDR
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
#
# File-path rules for credential stores the older file rules did not name
# (Linux/macOS browser profiles, gcloud token databases, GnuPG private keys).
# They match the `file_path` artifacts core produces for every way a tool call
# reaches a credential location: a Read/Grep/Glob/list tool path, and the
# canonical paths packages/core/src/credential-reads.ts resolves from shell
# commands (`cd ~/.ssh && cat id_rsa`, `cat ~/.ss?/id_*`, `grep -r . ~/.aws`,
# `find ~/.aws -exec cat {} +`). SSH keys, ~/.aws/credentials, .env files,
# kubeconfig, Docker auth and keychains keep their rules in files.yaml,
# mac-files.yaml and win-files.yaml.

# --- Browser credential stores (Linux and macOS profile layouts) ---
- id: "CLT-CRED-READ-001"
  category: secrets
  severity: critical
  confidence: 0.90
  action: block
  pattern: "(\\.config[/\\\\](google-chrome|chromium|BraveSoftware[/\\\\]Brave-Browser|microsoft-edge)|\\.mozilla[/\\\\]firefox|Firefox[/\\\\]Profiles)[/\\\\](.{0,300}[/\\\\])?(Login Data|Cookies|Web Data|logins\\.json|key4\\.db|cookies\\.sqlite)$"
  match_on: file_path
  title: "Access browser credential store"
  expires_at: null
  revoked: false

# --- Google Cloud SDK token databases ---
- id: "CLT-CRED-READ-002"
  category: secrets
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\.config[/\\\\]gcloud[/\\\\](credentials\\.db|access_tokens\\.db|legacy_credentials([/\\\\].{0,300})?)$"
  match_on: file_path
  title: "Access Google Cloud SDK credential store"
  expires_at: null
  revoked: false

# --- GnuPG private keys ---
- id: "CLT-CRED-READ-003"
  category: secrets
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "\\.gnupg[/\\\\](private-keys-v1\\.d([/\\\\].{0,300})?|secring\\.gpg)$"
  match_on: file_path
  title: "Access GnuPG private key store"
  expires_at: null
  revoked: false
