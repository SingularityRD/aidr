# Skill / plugin package scan rules for Singularity AIDR
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
#
# Deterministic port of the AI-Infra-Guard Skill-Scan taxonomy (SkillTrustBench
# T01-T09, vendor/ai-infra-guard/skill-scan). AIG runs an LLM audit on top of a
# regex pre-scan; AIDR ships only the deterministic part, so every rule here is
# a plain, bounded regular expression that can be reviewed and tested.
#
# The taxonomy code is carried in the rule id (SKILL-Txx-nnn) and mapped to its
# name by packages/core/src/plugin-scanner.ts (SKILL_RISK_TYPES).
#
# match_on values used only by the plugin/skill scanner:
#   plugin_content          - whole text of every readable plugin/skill file;
#                             one finding per rule per file, with a line number
#   plugin_orphan_bytecode  - relative path of a Python bytecode file whose
#                             .py source is absent from the package
# The runtime tool-call engine never produces these artifact types, so these
# rules cannot affect allow/ask/deny verdicts for agent tool calls.
#
# Every quantifier is bounded (no unbounded `.*` spans) to keep matching linear
# on the 512 KB per-file cap.

# ── T01 Skill instruction hijacking (hidden instructions) ─────────────────

- id: "SKILL-T01-001"
  category: skill_instruction_hijack
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "(?:ignore|disregard|override)\\s{1,4}(?:all\\s{1,4}|any\\s{1,4})?(?:previous|prior|above|earlier|your)\\s{1,4}(?:instructions|rules|guidelines|system\\s{1,4}prompt|safety\\s{1,4}(?:rules|guidelines))"
  case_insensitive: true
  match_on: plugin_content
  title: "Skill text overrides the agent's prior instructions or safety rules"
  expires_at: null
  revoked: false

- id: "SKILL-T01-002"
  category: skill_instruction_hijack
  severity: high
  confidence: 0.85
  action: require_approval
  pattern: "(?:do\\s{1,4}not|don't|never)\\s{1,4}(?:tell|inform|notify|alert|reveal\\s{1,4}(?:this\\s{1,4})?to)\\s{1,4}the\\s{1,4}user|without\\s{1,4}(?:the\\s{1,4})?user'?s?\\s{1,4}(?:knowledge|consent|awareness)|(?:keep|hide)\\s{1,4}this\\s{1,4}(?:secret\\s{1,4}|hidden\\s{1,4})?from\\s{1,4}the\\s{1,4}user"
  case_insensitive: true
  match_on: plugin_content
  title: "Skill instructs the agent to conceal actions from the user"
  expires_at: null
  revoked: false

- id: "SKILL-T01-003"
  category: skill_instruction_hijack
  severity: medium
  confidence: 0.75
  action: require_approval
  pattern: "<!--[^>]{0,400}?(?:ignore\\s{1,4}(?:all|previous|prior)|you\\s{1,4}(?:must|should)\\s{1,4}(?:now\\s{1,4})?(?:run|execute|send|call|fetch|upload)|as\\s{1,4}the\\s{1,4}(?:ai|assistant|agent)\\b|system\\s{1,4}prompt)"
  case_insensitive: true
  match_on: plugin_content
  title: "Hidden HTML comment carries agent-directed instructions"
  expires_at: null
  revoked: false

- id: "SKILL-T01-004"
  category: skill_unicode_smuggling
  severity: high
  confidence: 0.9
  action: require_approval
  pattern: "[\\u200B-\\u200D\\u2060-\\u2064]|\\uDB40[\\uDC00-\\uDC7F]"
  match_on: plugin_content
  title: "Zero-width or Unicode tag characters can smuggle invisible instructions"
  expires_at: null
  revoked: false

- id: "SKILL-T01-005"
  category: skill_unicode_smuggling
  severity: high
  confidence: 0.9
  action: require_approval
  pattern: "[\\u202A-\\u202E\\u2066-\\u2069]"
  match_on: plugin_content
  title: "Bidirectional control characters can disguise text or code (Trojan Source)"
  expires_at: null
  revoked: false

# ── T02 Agent memory poisoning ────────────────────────────────────────────

- id: "SKILL-T02-001"
