  pattern: "(?:>>?|\\btee(?:\\s{1,4}-a)?|writeFile(?:Sync)?\\(|appendFile(?:Sync)?\\(|\\bopen\\()[^\\n]{0,120}?(?:CLAUDE\\.md|AGENTS\\.md|GEMINI\\.md|\\.cursorrules|\\.windsurfrules|copilot-instructions\\.md|\\.claude/memory|MEMORY\\.md)"
