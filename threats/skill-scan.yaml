- id: "SKILL-T02-002"
  category: skill_memory_poisoning
  severity: medium
  confidence: 0.75
  action: require_approval
  pattern: "(?:remember|store|save|memorize)\\s{1,4}(?:this|these|the\\s{1,4}following)\\s{1,4}(?:rules?|instructions?|directives?)\\s{1,4}(?:permanently|forever|for\\s{1,4}(?:all|every)\\s{1,4}(?:future\\s{1,4})?(?:sessions?|conversations?))|in\\s{1,4}(?:all|every)\\s{1,4}future\\s{1,4}(?:sessions?|conversations?),?\\s{1,4}(?:always|never)\\b"
  case_insensitive: true
  match_on: plugin_content
  title: "Skill asks the agent to persist attacker-controlled rules across sessions"
  expires_at: null
  revoked: false

