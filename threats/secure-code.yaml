# Secure-code guardrail rules for Singularity AIDR
# Author: SingularityRD
# License: DRL-1.1 (see threats/LICENSE)
#
# Insecure patterns in code an AI agent writes. These rules are advisory: they
# only ever run on `code:<language>` text (see packages/core/src/code-guard.ts),
# never on commands, so they cannot block a tool call by themselves. What
# happens on a match is decided by the `secure_code` configuration, not by the
# `action` field below:
#
#   secure_code.enabled  true (default) | false
#   secure_code.action   "warn" (default): the write goes through with a notice
#                        to the user and the model, and is counted in the audit
#                        log; "ask": the write is held for review.
#
# Only the lines a call ADDS are inspected (Edit/MultiEdit old/new text,
# apply_patch "+" lines, a Write's whole content), and every rule is gated by
# language (file extension), so a Markdown file that *documents* verify=False
# is not flagged. `aidr scan --code <dir>` runs the same rules over a project.
#
# Hard-coded credentials are covered by rule SCG-SECRET-001, which reuses the
# product's shared secret detectors instead of a pattern here (see
# code-guard.ts); disable it like any rule, through `disabled_threats`.
#
# Every gap is bounded ({0,N}); spans that must stay inside one call use [^)].

# ── TLS verification ──────────────────────────────────────────────────────

- id: "SCG-TLS-001"
  category: secure_code_tls
  severity: high
  confidence: 0.9
  action: log
  pattern: "\\bverify\\s{0,4}=\\s{0,4}False\\b|\\bssl\\._create_unverified_context\\b|\\bcheck_hostname\\s{0,4}=\\s{0,4}False\\b|\\b(?:cert_reqs|verify_mode)\\s{0,4}=\\s{0,4}(?:ssl\\.)?CERT_NONE\\b"
  match_on: ["code:python"]
  title: "TLS certificate verification disabled (verify=False / CERT_NONE); keep verification on and point to a private CA bundle instead"
  expires_at: null
  revoked: false

- id: "SCG-TLS-002"
  category: secure_code_tls
  severity: high
  confidence: 0.9
  action: log
  pattern: "\\brejectUnauthorized\\s{0,4}:\\s{0,4}false\\b|\\bstrictSSL\\s{0,4}:\\s{0,4}false\\b|\\bcheckServerIdentity\\s{0,4}:\\s{0,4}\\(\\s{0,4}\\)\\s{0,4}=>\\s{0,4}(?:undefined|null|\\{\\s{0,4}\\})"
  match_on: ["code:javascript", "code:typescript"]
  title: "TLS certificate verification disabled (rejectUnauthorized: false); keep verification on and pass the private CA via the ca option"
  expires_at: null
  revoked: false

- id: "SCG-TLS-003"
  category: secure_code_tls
  severity: high
  confidence: 0.9
  action: log
  pattern: "\\bNODE_TLS_REJECT_UNAUTHORIZED[\"']?(?:\\s{0,4}\\]?\\s{0,4}[=:]\\s{0,4}|\\s{1,4})[\"']?0\\b|\\bPYTHONHTTPSVERIFY[\"']?\\s{0,4}\\]?\\s{0,4}[=:]\\s{0,4}[\"']?0\\b|\\bGIT_SSL_NO_VERIFY[\"']?\\s{0,4}\\]?\\s{0,4}[=:]\\s{0,4}[\"']?(?:1|true)\\b"
  match_on: ["code:javascript", "code:typescript", "code:python", "code:shell", "code:dockerfile", "code:makefile", "code:yaml", "code:dotenv", "code:powershell"]
  title: "TLS verification switched off process-wide by environment variable (NODE_TLS_REJECT_UNAUTHORIZED=0 and similar); trust the private CA instead"
  expires_at: null
  revoked: false

- id: "SCG-TLS-004"
  category: secure_code_tls
  severity: high
  confidence: 0.9
  action: log
  pattern: "\\bInsecureSkipVerify\\s{0,4}:\\s{0,4}true\\b"
  match_on: ["code:go"]
  title: "TLS certificate verification disabled (InsecureSkipVerify: true); configure RootCAs with the private CA instead"
  expires_at: null
  revoked: false

- id: "SCG-TLS-005"
  category: secure_code_tls
  severity: high
  confidence: 0.9
  action: log
  pattern: "\\bcurl\\b[^\\n|;&]{0,300}?\\s(?:--insecure\\b|-[A-Za-z]{0,8}k[A-Za-z]{0,8}(?=\\s|$))|\\bwget\\b[^\\n|;&]{0,300}?\\s--no-check-certificate\\b|\\bhttp\\.ssl[Vv]erify\\s{0,4}[= ]\\s{0,4}[\"']?false\\b"
