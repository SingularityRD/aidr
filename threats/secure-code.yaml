- id: "SCG-TLS-006"
  category: secure_code_tls
  severity: high
  confidence: 0.9
  action: log
  pattern: "\\b(?:NoopHostnameVerifier|ALLOW_ALL_HOSTNAME_VERIFIER|TrustAllStrategy|InsecureTrustManagerFactory)\\b|\\bsetHostnameVerifier\\s{0,4}\\(\\s{0,4}\\(\\s{0,4}\\w{1,40}\\s{0,4},\\s{0,4}\\w{1,40}\\s{0,4}\\)\\s{0,4}->\\s{0,4}true\\b"
  match_on: ["code:java", "code:kotlin"]
