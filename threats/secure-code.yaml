  pattern: "\\b(?:eval|exec)\\s{0,4}\\([^\\n)]{0,200}?(?:\\brequest\\.(?:args|form|values|json|data|files|headers|cookies|GET|POST|body|query_params|path_params)\\b|\\bflask\\.request\\b|\\b(?:raw_)?input\\s{0,4}\\(|\\bsys\\.argv\\b|\\bself\\.request\\b)"
