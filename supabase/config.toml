# Local Supabase configuration for the AIDR control plane.
#
# This is intentionally checked in so `supabase start`, `supabase db reset`,
# and local Edge Function smoke tests use the same ports and JWT policy as the
# deployment runbook. Replace `project_id` only when linking a real project.
project_id = "aidr"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/recover",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/recover",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/recover",
]
enable_signup = true

[auth.email.template.recovery]
subject = "Reset your AIDR password"
content_path = "./supabase/templates/recovery.html"

# Invites must use the server-verified, single-use token_hash flow. The default
# {{ .ConfirmationURL }} template ends in an implicit-flow redirect that puts
# session tokens in the URL fragment, which the dashboard rejects (login CSRF).
[auth.email.template.invite]
subject = "You have been invited to AIDR"
content_path = "./supabase/templates/invite.html"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Functions which implement their own API-key, device-code, webhook, or
# public-intake authentication must bypass the Supabase gateway JWT check.
# Functions accepting Supabase access tokens keep gateway verification enabled.
[functions.api-keys]
verify_jwt = true
[functions.autosecops-runtime]
verify_jwt = true
[functions.azure-ad-groups]
# The handler repeats session revocation, tenant membership and MFA checks.
verify_jwt = true
[functions.billing-checkout]
verify_jwt = true
[functions.device-poll]
verify_jwt = false
[functions.device-start]
verify_jwt = false
[functions.device-verify]
verify_jwt = true
[functions.enroll]
verify_jwt = false
[functions.enrollment-tokens]
verify_jwt = true
[functions.file-check]
verify_jwt = false
[functions.ingest]
verify_jwt = false
[functions.packs-download]
verify_jwt = false
[functions.packs-manifest]
verify_jwt = false
[functions.paddle-webhook]
verify_jwt = false
[functions.pilot-admin]
verify_jwt = true
[functions.pilot-apply]
verify_jwt = true
[functions.pilot-status]
verify_jwt = true
[functions.revocations]
verify_jwt = false
[functions.response-playbooks]
# `trigger_automation` authenticates with an `aidr_rsp_` grant secret, which is
# not a Supabase JWT, so gateway JWT checking would reject it before the handler.
# Every operator action (start/trigger/status/grant/revoke) still verifies the
# access token with getUser, runs the identity barrier and requires an active
# owner/admin membership at AAL2 before any SQL.
verify_jwt = false
[functions.url-check]
verify_jwt = false
[functions.waitlist-signup]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
[functions.policy]
verify_jwt = false
[functions.policy-ack]
verify_jwt = false
[functions.policy-management]
verify_jwt = true
[functions.team-invite]
verify_jwt = true
[functions.oauth-callback]
verify_jwt = true
[functions.audit-export]
verify_jwt = true
[functions.identity-security]
# Password-reset and break-glass entry points are public. The function validates
# access tokens, session barriers, tenant membership and AAL for protected actions.
verify_jwt = false
[functions.delegated-credentials]
# This endpoint accepts both Supabase access tokens and AIDR delegated tokens;
# each path verifies its own credential before any authorization decision.
verify_jwt = false
[functions.scim]
  # SCIM clients use tenant-scoped hash-only bearer tokens which the function
  # validates before resolving any directory object or role mapping.
  verify_jwt = false
[functions.retention-admin]
  # Legal holds and per-tenant retention are managed only by an authenticated
  # active tenant owner (admins may read); every write RPC re-verifies the owner,
  # takes the shared tenant lock and writes an admin audit row transactionally.
  verify_jwt = true
[functions.scim-admin]
  # SCIM provisioning credentials and role mappings are managed only by an
  # authenticated tenant owner; the handler repeats identity and MFA checks.
  verify_jwt = true
[functions.discovery]
# The function validates JWTs for operator actions and separately validates
# tenant/collector-bound machine credentials for ingest. Gateway JWT checking
# would reject the machine key before the function can apply its own boundary.
verify_jwt = false

[functions.invoice-entitlement]
# Enterprise invoice orders require an authenticated operator session; the
# function repeats identity, MFA and tenant-role checks before any SQL call.
verify_jwt = true

[functions.billing-portal]
# Self-service subscription portal. Requires an authenticated operator session;
# the handler re-resolves tenant, membership, role and MFA server-side and never
# accepts a client-supplied tenant or provider customer id.
verify_jwt = true

[functions.oidc-sso]
# Public start/callback/break-glass actions are bound by single-use state, PKCE and a
# browser binding secret (or a single-use recovery code); every other action
# verifies the access token and runs the shared identity barrier in the handler.
verify_jwt = false
