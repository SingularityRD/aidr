# Local Supabase configuration for the AIDR control plane.
#
# This is intentionally checked in so `supabase start`, `supabase db reset`,
# and local Edge Function smoke tests use the same ports and JWT policy as the
# deployment runbook. Replace `project_id` only when linking a real project.
project_id = "aidr"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/recover",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/recover",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/recover",
]
enable_signup = true

# Email/password sign-ups must confirm the address before a session is issued.
# Locally the confirmation mail is captured by Inbucket (http://localhost:54324),
# so the sign-up flow still works without an SMTP provider.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Cloudflare Turnstile bot protection for sign-up, sign-in and magic links.
# Off for local development. A deployed project enables it through the Supabase
# CLI environment overrides (never by editing this file):
#   SUPABASE_AUTH_CAPTCHA_ENABLED=true
#   SUPABASE_AUTH_CAPTCHA_SECRET=<Turnstile secret key>
# and builds the dashboard with the matching VITE_TURNSTILE_SITE_KEY, which
# makes LoginPage send a captchaToken with every Auth request.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email.template.recovery]
subject = "Reset your AIDR password"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Functions which implement their own API-key, device-code, webhook, or
# public-intake authentication must bypass the Supabase gateway JWT check.
# Functions accepting Supabase access tokens keep gateway verification enabled.
[functions.api-keys]
verify_jwt = true
[functions.autosecops-runtime]
verify_jwt = true
[functions.azure-ad-groups]
# The handler repeats session revocation, tenant membership and MFA checks.
verify_jwt = true
[functions.billing-checkout]
verify_jwt = true
[functions.device-poll]
verify_jwt = false
[functions.device-start]
verify_jwt = false
[functions.device-verify]
verify_jwt = true
[functions.enroll]
verify_jwt = false
[functions.enrollment-tokens]
verify_jwt = true
[functions.file-check]
verify_jwt = false
[functions.ingest]
verify_jwt = false
[functions.packs-download]
verify_jwt = false
[functions.packs-manifest]
verify_jwt = false
[functions.paddle-webhook]
verify_jwt = false
[functions.operator-admin]
# Platform-operator surface (admission mode, legal documents, licenses). The
# handler repeats session revocation, operator allowlist and AAL2 checks.
verify_jwt = true
[functions.pilot-admin]
verify_jwt = true
[functions.pilot-apply]
verify_jwt = true
[functions.pilot-status]
verify_jwt = true
[functions.revocations]
verify_jwt = false
[functions.response-playbooks]
# The handler also repeats session, owner/admin and AAL2 checks before SQL.
verify_jwt = true
[functions.url-check]
verify_jwt = false
[functions.waitlist-signup]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
[functions.policy]
verify_jwt = false
[functions.policy-ack]
verify_jwt = false
[functions.policy-management]
verify_jwt = true
[functions.team-invite]
verify_jwt = true
[functions.tenant-settings]
# Workspace rename, retention and closure. The handler repeats session, identity
# barrier, membership/role and AAL2 checks, and the RPCs re-check under locks.
verify_jwt = true
[functions.approval-requests]
# Managed-mode dashboard approvals. Connectors authenticate with a hash-only
# tenant API key (not a Supabase JWT), so gateway JWT verification is off; the
# handler verifies the API key (scope tenant) for create/poll and, for
# decisions, the Supabase session, identity barrier, owner/admin role and AAL2.
verify_jwt = false

[functions.compliance-report]
# Compliance evidence report. The handler repeats session, identity barrier,
# owner/admin role, AAL2 and a tenant rate limit; the SQL re-checks under locks.
verify_jwt = true
[functions.governance-digest]
# Scheduled governance summary. The dispatch path requires the deployment
# service credential (compared in constant time); the test-send path repeats
# session, identity barrier, owner/admin role and a tenant rate limit, and the
# SQL re-checks under locks.
verify_jwt = true

[functions.notification-channels]
# Tenant alert channels (Settings -> Notifications). The handler repeats session,
# identity barrier, owner/admin and AAL2 checks; destinations are write-only.
verify_jwt = true

[functions.notification-dispatch]
# Outbox dispatcher, invoked by the deployment scheduler with the dedicated
# AIDR_NOTIFICATION_DISPATCH_TOKEN bearer (not a JWT); never browser-facing.
verify_jwt = false
[functions.oauth-callback]
verify_jwt = true
[functions.audit-export]
verify_jwt = true
[functions.identity-security]
# Password-reset and break-glass entry points are public. The function validates
# access tokens, session barriers, tenant membership and AAL for protected actions.
verify_jwt = false
[functions.delegated-credentials]
# This endpoint accepts both Supabase access tokens and AIDR delegated tokens;
# each path verifies its own credential before any authorization decision.
verify_jwt = false
[functions.scim]
  # SCIM clients use tenant-scoped hash-only bearer tokens which the function
  # validates before resolving any directory object or role mapping.
  verify_jwt = false
[functions.scim-admin]
  # SCIM provisioning credentials and role mappings are managed only by an
  # authenticated tenant owner; the handler repeats identity and MFA checks.
  verify_jwt = true
[functions.discovery]
# The function validates JWTs for operator actions and separately validates
# tenant/collector-bound machine credentials for ingest. Gateway JWT checking
# would reject the machine key before the function can apply its own boundary.
verify_jwt = false

[functions.invoice-entitlement]
# Enterprise invoice orders require an authenticated operator session; the
# function repeats identity, MFA and tenant-role checks before any SQL call.
verify_jwt = true

[functions.billing-portal]
# Self-service subscription portal. Requires an authenticated operator session;
# the handler re-resolves tenant, membership, role and MFA server-side and never
# accepts a client-supplied tenant or provider customer id.
verify_jwt = true
